l_english:
 qing_paper.1.t:0 "紙鈔之議 The Paper-Money Proposal"
 qing_paper.1.desc:0 "The Taiping fires have gutted the revenue: the land tax uncollected across the rebel provinces, the Yangzi salt routes cut, the Yunnan copper roads severed. The Board of Revenue silver runs low, and the armies must be paid. A memorial urges the desperate expedient the dynasty has shunned for two centuries — to print notes, the 寶鈔 and 官票, backed by what silver remains. It would buy time. It would also, every official present knows, invite the ghost of the Ming’s worthless paper."
 qing_paper.1.sanction:0 "Sanction the notes (行鈔)"
 qing_paper.1.sanction.tt:0 "Unlock the #G Paper Currency#! monetary stance. The throne may now print notes against the silver reserve for real deficit-finance headroom — but watch the depreciation: over-issue debases the notes toward collapse."
 qing_paper.1.refuse:0 "Hold to silver (守銀)"
 qing_paper.1.refuse.tt:0 "Refuse the paper expedient; the crisis must be met from specie and retrenchment. The throne is seen to hold the line on sound money (#G +legitimacy#!). The stance stays locked."
 qing_paper.2.t:0 "鈔法大壞 The Notes Collapse"
 qing_paper.2.desc:0 "It has happened as the sceptics foretold. The notes trade at a few cash on the string; the money-shops refuse them; the tax offices will not take them; the soldiers spurn them as pay. The 寶鈔 is waste paper, and the throne’s word with it. There is nothing left but to abolish the notes and eat the ruin — the confidence of the realm in the currency will not be quickly rebuilt."
 qing_paper.2.abolish:0 "Abolish the notes (廢鈔)"
 qing_paper.2.abolish.tt:0 "Withdraw the paper entirely and return to specie. #R A heavy blow to legitimacy and stability#!; the ruler’s standing suffers, and the paper-money stance is locked away for a generation."
