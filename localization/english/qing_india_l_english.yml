l_english:
 # ####################################################################
 # [#449] Contest the Company (逐夷復印) — the Qing bid to contest the
 # British East India Company for the paramountcy of Hindustan: break
 # the Company at Calcutta, take the Nawab of Bengal and the Mughal
 # emperor under the wing.
 # See common/missions/qing_india_missions.txt,
 # common/scripted_effects/se_QING_INDIA.txt,
 # common/modifiers/qing_india_modifiers.txt.
 # ####################################################################

 qing_india_mission:0 "Contest the Company (逐夷復印)"
 qing_india_mission_DESCRIPTION:0 "Beyond the Himalayas, the sea-merchants of a distant western isle are fastening their grip on the wealth of Bengal. The English East India Company, seated at Calcutta, has broken the Nawab at Plassey and drains the province into its ships — but it is not yet an empire, only an upstart trading company clinging to the coast. India is in anarchy: the Nawab of Bengal is in arms against the Company, the Timurid emperor at Delhi awaits a protector, and no western master yet rules the interior. Descend from the passes, make common cause with the Nawab, bring the independent Mughal under the wing, and break the Company at Calcutta before it swallows the subcontinent — let the paramountcy of Hindustan pass to the Son of Heaven."
 qing_india_mission_CRITERIA_DESCRIPTION:0 "This enterprise is complete when the East India Company has been driven from the subcontinent and Qing paramountcy is established over India."
 qing_india_mission_REWARD_DESCRIPTION:0 "Completing every objective in this tree grants its capstone reward."
 qing_india_mission_BUTTON_TOOLTIP:0 "Open this mission tree."

 qing_india_descent:0 "The Descent on Hindustan (南征印度)"
 qing_india_descent_DESC:0 "Commit the frontier armies and the treasury to the long march south through the passes into the plains of Hindustan — the point of no return from which the empire contests the western sea-merchants for the subcontinent. Costs #Y 150#! treasury and #Y 30#! political influence."
 qing_india_descent_tt:0 "Open the enterprise: the descent lays #G company pressure (逼夷)#! on the Company's Bengal factories, and the court takes heart (#G ruler popularity#!)."
 qing_india_descent_napoleonic_tt:0 "#Y While the Company is overstretched by the Napoleonic emergency#! (Bonaparte in Egypt, Tipu's Mysore in arms, ~1798-1815), the descent finds the moment riper — a #G stability#! bonus and extra #G ruler popularity#!."

 qing_india_nawab:0 "The Nawab's Cause (撫孟加拉)"
 qing_india_nawab_DESC:0 "Make common cause with the Nawab of Bengal, sovereign and at war with the Company in this very year. Take him under the Qing wing — the anti-Company ally in the field — and set the drive on Calcutta its war-goal. Costs #Y 30#! political influence."
 qing_india_needs_nawab_tt:0 "The #Y Nawab of Bengal (孟加拉) must exist#! on the map to be reached."
 qing_india_nawab_tt:0 "The Nawab bows: Bengal is taken under the wing as a #G sinosphere tributary#!, a #G claim is laid on the Company seat at Calcutta (加爾各答)#! so the drive has its war-goal, and the court exults (#G ruler popularity#!)."

 qing_india_calcutta:0 "The Fall of Calcutta (克加爾各答)"
 qing_india_calcutta_DESC:0 "Storm the Company's Bengal stronghold — take and hold Fort William at Calcutta itself. With its seat lost, the Company's grip on Bengal is broken. Costs #Y 100#! treasury."
 qing_india_needs_calcutta_tt:0 "The Qing must #Y control Calcutta (加爾各答, province 6219)#! — the Company's seat."
 qing_india_calcutta_tt:0 "Calcutta falls. A #G claim on the Company seat#! is confirmed if it is not yet Qing soil, the realm steadies (#G stability#!) and the court rejoices (#G ruler popularity#!)."

 qing_india_mughal:0 "The Mughal Restored (復蒙兀兒)"
 qing_india_mughal_DESC:0 "Reach the Timurid emperor at Delhi — INDEPENDENT in 1763, the nominal paramount of Hindustan courted by every rising power. Bring him under the Son of Heaven as a tributary before the Company can make him its puppet — the legitimist crown of Hindustan turned east. Costs #Y 30#! political influence."
 qing_india_needs_mughal_tt:0 "The #Y Mughal emperor (蒙兀兒) must exist#! on the map to be reached."
 qing_india_mughal_tt:0 "The independent Timurid throne — nominal paramount of Hindustan — is brought under the wing as a #G sinosphere tributary#! before the Company can claim it, the crown of Hindustan turned east, and the court takes heart (#G ruler popularity#!)."

 qing_india_heartland:0 "The Gangetic Heartland (據恆河)"
 qing_india_heartland_DESC:0 "Secure the plains: take and hold ground in the Gangetic heartland — Bihar and the doab, the granary of Hindustan — so the Qing paramountcy rests on real soil and not on tribute alone. The Qing directly, or the freed Mughal tributary, may hold it."
 qing_india_needs_heartland_tt:0 "The Qing must #Y hold at least two provinces in the East India region#! (恆河), OR the #Y freed Mughal tributary must hold ground there#!."
 qing_india_heartland_tt:0 "The Gangetic plains are held — the paramountcy rests on real soil. The realm steadies (#G stability#!) and the court rejoices (#G ruler popularity#!)."

 qing_india_capstone:0 "The Company Expelled (逐夷復印)"
 qing_india_capstone_DESC:0 "The Company broken at Calcutta, and the two thrones of Hindustan — the Nawab of Bengal and the Timurid emperor — both under the wing of the Son of Heaven. The western sea-merchants are driven from the subcontinent and the paramountcy of Hindustan is won."
 qing_india_needs_paramountcy_tt:0 "The Qing must #Y hold Calcutta (6219)#! AND master both #Y the Nawab of Bengal#! and #Y the Mughal emperor#! — each held as a tributary or absorbed into the empire outright."
 qing_india_capstone_tt:0 "The Company is expelled. The lasting #G The Paramountcy of Hindustan (qing_india_paramountcy)#! is sealed — diplomatic weight, the reopened wealth of the Indian trade, legitimacy and revenue — the realm steadies (#G stability#!), the pressure on the factories lifts (#G company pressure lifts#!), and the emperor's glory rings across the southern seas (#G ruler popularity#!)."

 # ---- modifiers ----
 qing_india_company_pressure:0 "Company Pressure (逼夷)"
 qing_india_company_pressure_desc:0 "The Qing descent bears down on this Company factory, throttling its trade and sapping the garrison's will. Lifts on its own as the campaign moves on."
 qing_india_paramountcy:0 "The Paramountcy of Hindustan (印度霸權)"
 qing_india_paramountcy_desc:0 "The Company broken at Calcutta and the thrones of Bengal and Delhi under the wing. A lasting dividend of diplomatic weight, the reopened wealth of the Indian trade, legitimacy and revenue."

# --- mission tree expansion (>=10 tasks) ---
 qing_india_maratha_tt:0 "We court the Maratha confederacy against the Company's advance."
 qing_india_sikh_tt:0 "We open relations with the Sikh misls of the Punjab."
 qing_india_trade_tt:0 "The Company's commerce is seized — #G customs houses#! and #G silk filatures#! raised on the textile ports we hold, and their raw-export fibre #G turned to Qing manufacture#! as finished silk (with tea stood up at the old spice post on Sumatra)."
 qing_india_needs_trade_ground_tt:0 "We must hold real #Y India-trade ground#! — the Company seat at Calcutta, or a controlled port across its Bengal/Bihar/South-India footprint — to seize its commerce."
 qing_india_himalaya_road_tt:0 "We force the Himalayan passes from Tibet into the Gangetic plain."

# --- task titles + descriptions (mission-tree display) ---
 qing_india_maratha:0 "The Maratha Courts (結馬拉塔)"
 qing_india_maratha_DESC:0 "Court the Maratha confederacy against the Company's advance. Costs #Y 25#! political influence."
 qing_india_sikh:0 "The Punjab (通錫克)"
 qing_india_sikh_DESC:0 "Open relations with the Sikh misls of the Punjab. Costs #Y 20#! political influence."
 qing_india_trade:0 "Seize the Company's Commerce (奪夷商)"
 qing_india_trade_DESC:0 "Tear out the Company's raw-export trade and stand Qing commerce up in its place: #G customs houses#! and #G silk filatures#! on every India-trade province we control, the trade goods turned from the Company's cash crops to #G Qing-directed manufacture#!. Requires holding real trade ground (the Calcutta seat or a Bengal/Bihar/South-India port). Costs #Y 60#! treasury."
 qing_india_himalaya_road:0 "The Himalaya Road (越嶺入印)"
 qing_india_himalaya_road_DESC:0 "Force the passes from Tibet into the Gangetic plain. Costs #Y 80#! treasury."

 qing_india_hyderabad:0 "The Nizam of Hyderabad (通海德拉巴)"
 qing_india_hyderabad_DESC:0 "Open relations with the Nizam of Hyderabad, the greatest of the Deccan princes. Costs #Y 25#! political influence."
 qing_india_hyderabad_tt:0 "The Nizam of Hyderabad receives the Son of Heaven's envoys."
 qing_india_mysore:0 "The Tiger of Mysore (結邁索爾)"
 qing_india_mysore_DESC:0 "Make common cause with Mysore, whose sultans wage their own war on the Company. Costs #Y 25#! political influence."
 qing_india_mysore_tt:0 "Mysore joins the cause against the Company."
 qing_india_rohilla:0 "The Rohilla Afghans (羅希拉)"
 qing_india_rohilla_DESC:0 "Court the Rohilla Afghan chieftains of the doab against the Company's advance. Costs #Y 20#! political influence."
 qing_india_rohilla_tt:0 "The Rohilla Afghans of the doab are courted to the cause."
 qing_india_awadh:0 "The Nawab of Awadh (撫奧德)"
 qing_india_awadh_DESC:0 "Reach the Nawab of Awadh, whose Lucknow court the Company would bleed white. Costs #Y 25#! political influence."
 qing_india_awadh_tt:0 "The Nawab of Awadh at Lucknow inclines to the Son of Heaven."
 qing_india_deccan:0 "The Deccan Trade (南印通商)"
 qing_india_deccan_DESC:0 "Open the overland trade to the Deccan plateau and its fortress-kingdoms. Costs #Y 60#! treasury."
 qing_india_deccan_tt:0 "The overland trade to the Deccan is opened."
 qing_india_coromandel:0 "The Coromandel Coast (科羅曼德)"
 qing_india_coromandel_DESC:0 "Contest the Coromandel ports where the western companies keep their factories. Costs #Y 60#! treasury."
 qing_india_coromandel_tt:0 "The Coromandel ports are contested with the western companies."
 qing_india_malabar:0 "The Malabar Pepper Coast (馬拉巴海岸)"
 qing_india_malabar_DESC:0 "Take a share of the Malabar pepper coast, the spice-wealth of the western shore. Costs #Y 60#! treasury."
 qing_india_malabar_tt:0 "A share of the Malabar pepper trade is secured."
 qing_india_ceylon:0 "The Island of Ceylon (錫蘭)"
 qing_india_ceylon_DESC:0 "Reach across the strait to the cinnamon-island of Ceylon. Costs #Y 65#! treasury."
 qing_india_ceylon_tt:0 "The cinnamon-island of Ceylon is drawn into the sphere."
 qing_india_afghan:0 "The Afghan Passes (阿富汗通道)"
 qing_india_afghan_DESC:0 "Treat with the Durrani Afghans who hold the northwest passes into Hindustan. Costs #Y 25#! political influence."
 qing_india_afghan_tt:0 "The Durrani Afghans open the northwest passes."
 qing_india_ganges_fleet:0 "The Ganges River Fleet (恆河舟師)"
 qing_india_ganges_fleet_DESC:0 "Float a river fleet on the sacred Ganges, master of the artery of Hindustan. Costs #Y 80#! treasury."
 qing_india_ganges_fleet_tt:0 "A river fleet masters the artery of the Ganges."
