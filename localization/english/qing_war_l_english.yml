l_english:
 qing_war.1.t:0 "Officer Review Board"
 qing_war.1.desc:0 "The Grand Minister of War, [war_minister.GetName], convenes a board to review the realm's field commanders. The 兵部 administered the Green Standard Army and officer appointments; a capable War minister ensures his commanders remain loyal and effective."
 qing_war.1.a:0 "Commend [able_commander.GetName] for his service."
 qing_war.1.a.tt:0 "[able_commander.GetName] is commended for his service.\n#R Political Influence: -20#!\n[able_commander.GetName]:\n#G Martial: +2#!\n#G Loyalty: +10#!\n#G Gold: +50#!\n#G Commended Officer#! (5 years: loyalty +10, prominence +5)"
 qing_war.1.b:0 "Cashier [negligent_commander.GetName] for negligence."
 qing_war.1.b.tt:0 "[negligent_commander.GetName] is cashiered for negligence.\n[negligent_commander.GetName]:\n#R Loyalty: -5#!\n#R Loyal Veteran Cohorts: -3#!\n#R Cashiered Officer#! (5 years: loyalty -15, popularity -10)\n#R Officer Corps Purge#! (5 years: army morale -5%, loyalty-gain chance -10%)"
 qing_war.1.c:0 "A general review suffices."
 qing_war.1.c.tt:0 "A general review of the officer corps.\n#G Legitimacy: +5#!\n#G General Review#! (5 years: army morale +5%, loyalty-gain chance +5%)"
 qing_war.2.t:0 "A Commander's Private Following"
 qing_war.2.desc:0 "Commander [wayward_commander.GetName] has grown too close to his own troops. The 19th-century danger: regional armies (湘軍/淮軍) whose commanders answered to their patrons, not the throne. His power base now rivals that of the court itself."
 qing_war.2.a:0 "Recall him and disband his force."
 qing_war.2.a.tt:0 "Recall [wayward_commander.GetName] and disband his force.\n#R Stability: -10#!\n#R Tyranny: +5#!\n[wayward_commander.GetName]:\n#R Loyal Veteran Cohorts: -6#!\n#R Loyalty: -5#!\n#R Recalled Commander#! (5 years: loyalty -20, prominence -10)"
 qing_war.2.b:0 "Promote him to a great office."
 qing_war.2.b.tt:0 "Promote [wayward_commander.GetName] to a great office, binding him to the court.\n#R Political Influence: -15#!\n[wayward_commander.GetName]: #G Seated in the first vacant Grand Council office#!\nHow the honour lands depends on his affinity with the throne: if congenial (affinity 70+), #G Loyalty +10 (decaying)#!, and if especially so (85+), #G he becomes a friend of the Emperor#!. If estranged (affinity 30 or below), #R Loyalty -5 (decaying)#!, and if especially so (15 or below), #R he becomes a rival of the Emperor#!. A middling man is unaffected either way.\nRequires a free council seat and no office already held."
 qing_war.2.c:0 "Watch and wait."
 qing_war.2.c.tt:0 "Watch and wait, gambling on his continued loyalty.\n#R Green Standard Decay: +5#!\n[wayward_commander.GetName]:\n#R Loyalty: -5#!\n#G Loyal Veteran Cohorts: +2#!\n#R Unmonitored Commander#! (5 years: loyalty -5, prominence +3)"
 qing_war.3.t:0 "Military Commission"
 qing_war.3.desc:0 "The Grand Minister of War, [war_minister.GetName], recommends a new military commission. The 兵部 administered the Green Standard Army; a capable minister can expand the realm's armed forces."
 qing_war.3.a:0 "Commission a new army."
 qing_war.3.a.tt:0 "Commission a new army.\n#R Treasury: -490#! (spent regardless)\nIf a capital province stands: #G a new 3-cohort infantry legion raised at the capital#!. Otherwise, no legion is raised.\n#G Army Expansion#! (5 years: land morale +5%, manpower recovery +10%)"
 qing_war.3.b:0 "Commission a naval squadron."
 qing_war.3.b.tt:0 "Commission a naval squadron, if a coastal province is held.\nIf coastal: #R Treasury: -535#!, #G a new 2-brig naval squadron raised#!, #G Naval Expansion#! (5 years: naval morale +5%, ship recruit speed +10%).\nOtherwise: no squadron is raised and no treasury is spent."
 qing_war.3.c:0 "Decline the commission."
 qing_war.3.c.tt:0 "Decline the commission. The War minister is disappointed.\n[war_minister.GetName]'s #R Loyalty: -5#!"
 qing_war.4.t:0 "Military-Examination Cycle (武舉)"
 qing_war.4.desc:0 "The Grand Minister of War, [war_minister.GetName], proposes a military-examination cycle to recruit fresh officers. The 武舉 was the military counterpart to the civil examinations, testing candidates in archery, strategy, and the martial classics."
 qing_war.4.a:0 "Fund the full examination cycle."
 qing_war.4.a.tt:0 "Fund the full military-examination cycle.\n#R Treasury: -360#!\n#G 2 new martial courtiers join the court#! (a further 50% chance of a 3rd)\n#G Military-Examination Success#! (5 years: legitimacy/month +0.05, loyalty-gain chance +10%)"
 qing_war.4.b:0 "A modest intake."
 qing_war.4.b.tt:0 "A modest examination intake.\n#R Treasury: -285#!\n#G 1 new martial courtier joins the court#!\n#G Military-Examination Intake#! (3 years: legitimacy/month +0.02)"
 qing_war.4.c:0 "Defer the examination."
 qing_war.4.c.tt:0 "Defer the examination, disappointing officer candidates.\n#R Stability: -5#!"
 qing_war_officer_purge:0 "Officer Corps Purge"
 qing_war_officer_purge_desc:0 "A purge of negligent officers has strained the officer corps."
 qing_war_general_review:0 "General Review"
 qing_war_general_review_desc:0 "A general review of the officer corps has bolstered morale and loyalty."
 qing_war_army_expansion:0 "Army Expansion"
 qing_war_army_expansion_desc:0 "A new army commission has strengthened the realm's land forces."
 qing_war_naval_expansion:0 "Naval Expansion"
 qing_war_naval_expansion_desc:0 "A new naval squadron has strengthened the realm's maritime forces."
 qing_war_examination_success:0 "Military-Examination Success (武舉)"
 qing_war_examination_success_desc:0 "A successful military-examination cycle has recruited fresh officers."
 qing_war_examination_modest:0 "Military-Examination Intake (武舉)"
 qing_war_examination_modest_desc:0 "A modest military-examination intake has recruited a new officer."
 qing_war_commended_officer:0 "Commended Officer"
 qing_war_commended_officer_desc:0 "This officer has been commended by the Grand Minister of War."
 qing_war_cashiered_officer:0 "Cashiered Officer"
 qing_war_cashiered_officer_desc:0 "This officer has been cashiered for negligence."
 qing_war_recalled_commander:0 "Recalled Commander"
 qing_war_recalled_commander_desc:0 "This commander has been recalled and his force disbanded."
 qing_war_unmonitored_commander:0 "Unmonitored Commander"
 qing_war_unmonitored_commander_desc:0 "This commander operates without oversight, his power base growing."
