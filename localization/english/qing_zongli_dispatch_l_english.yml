l_english:

######################################################################
# qing_zongli_dispatch_l_english.yml — DISPATCH A ZONGLI YAMEN DIPLOMAT (總理衙門
# 特使). Covers the qing_zongli_dispatch.1 ongoing-report event. See
# se_QING_ZONGLI_DISPATCH.txt / qing_zongli_dispatch_events.txt.
######################################################################

 qing_zongli_dispatch.1.t:0 "A Report from the Field"
 qing_zongli_dispatch.1.desc_success:0 "[qing_dispatch_evt_diplomat.GetName], the diplomat sent from the Zongli Yamen, has succeeded in his gambit on behalf of the throne."
 qing_zongli_dispatch.1.desc_failure:0 "[qing_dispatch_evt_diplomat.GetName], the diplomat sent from the Zongli Yamen, has stumbled in his negotiations on behalf of the throne."
 qing_zongli_dispatch.1.a:0 "Understood"
 # [placement review-fix 2026-09-02] moved off the desc text and onto this option's own
 # hover tooltip, per user instruction -- the quantified effect belongs on the choice,
 # not baked into the narrative description.
 # [tooltip review-fix, task #5 2026-09-03] ONE static key reading the signed delta and the
 # resulting new value straight off the play scope (qing_zongli_dispatch_evt_delta / real
 # diplomatic_play_success, both staged/read there by se_QING_ZONGLI_DISPATCH.txt) -- no
 # conditional custom_tooltip needed (that form only works inside allow= trigger blocks, never
 # on an option's own effects; the two-variant version rendered a literal "{").
 qing_zongli_dispatch.1.a.tt:0 "#Y Play Success Chance: [qing_dispatch_evt_play.MakeScope.GetVariable('qing_zongli_dispatch_evt_delta').GetValue|0+=]#!, now [qing_dispatch_evt_play.MakeScope.GetVariable('diplomatic_play_success').GetValue|0]"
