l_english:
 qing_revenue.1.t:0 "Statecraft Reform (更新治法)"
 qing_revenue.1.desc:0 "The throne has resolved to reform the salt monopoly. [salt_commissioner.GetName], the 兩淮鹽政 Salt Commissioner, is summoned to answer for his handling of the 鹽政 — the first test of the Grand Minister of Revenue's new authority. Nothing is settled today: this opens a longer struggle between the Minister and the Commissioner, playing out over the years to come, before the reform can be formally enacted."
 qing_revenue.1.a:0 "Open the inquiry."
 qing_revenue.1.a.tt:0 "The Minister of Revenue begins his years-long struggle to assert authority over the Salt Commissioner. #Y This will unlock a series of future events#!."
 qing_revenue.7.t:0 "The Minister Presses His Case"
 qing_revenue.7.desc:0 "[revenue_minister.GetName], the Grand Minister of Revenue, formally requests an audit of the 兩淮鹽政's books. [salt_commissioner.GetName] cites decades of precedent and the merchants' own stake in stability — an audit, he warns, will only stir up trouble."
 qing_revenue.7.a:0 "Press the audit now."
 qing_revenue.7.a.tt:0 "#G The minister's authority rises (+20)#!. #R The treasury pays for the audit (-40)#!. The commissioner is estranged."
 qing_revenue.7.b:0 "Give him time to comply voluntarily."
 qing_revenue.7.b.tt:0 "#G The minister's authority rises a little (+5)#!. No cost, no confrontation — yet."
 qing_revenue.8.t:0 "The Commissioner Digs In"
 qing_revenue.8.desc:0 "[salt_commissioner.GetName] moves to defend his position. An offer is made to [revenue_minister.GetName] — quietly, through an intermediary — that would make this whole inquiry go away."
 qing_revenue.8.a:0 "Refuse the bribe and press on."
 qing_revenue.8.a.tt:0 "#G The minister's authority rises (+15)#!. The commissioner's networks may retaliate with a temporary dip in income."
 qing_revenue.8.b:0 "Let it pass for now."
 qing_revenue.8.b.tt:0 "No progress, but no risk either."
 qing_revenue.10.t:0 "The Merchants Petition the Throne"
 qing_revenue.10.desc:0 "[salt_commissioner.GetName]'s merchant patrons have gone over [revenue_minister.GetName]'s head, petitioning the throne directly to drop the inquiry. They speak of stability, of decades of precedent, of the silver the gabelle has always provided — and never once of graft."
 qing_revenue.10.a:0 "Stand firm before the throne."
 qing_revenue.10.a.tt:0 "#G The minister's authority rises (+15)#!. #R Standing against powerful merchants publicly costs political influence (-5)#!."
 qing_revenue.10.b:0 "Let the petition cool tempers."
 qing_revenue.10.b.tt:0 "#G The minister's authority rises a little (+5)#!. No cost, no confrontation — yet."
 qing_revenue.11.t:0 "A Test of Loyalty"
 qing_revenue.11.desc:0 "The audit needs more hands than [revenue_minister.GetName] can spare himself. A trusted subordinate could press the investigation further — but [salt_commissioner.GetName]'s purse is deep, and not every man's loyalty survives the temptation."
 qing_revenue.11.a:0 "Send a trusted subordinate."
 qing_revenue.11.a.tt:0 "#G The minister's authority rises (+20)#! if the man holds — but the commissioner's deep pockets may suborn him instead, costing authority."
 qing_revenue.11.b:0 "Proceed cautiously, without extra hands."
 qing_revenue.11.b.tt:0 "#G The minister's authority rises a little (+5)#!. Slower, but no risk of betrayal."
 qing_revenue.12.t:0 "The Books Come to Light"
 qing_revenue.12.desc:0 "Partial results of the audit have surfaced. [salt_commissioner.GetName]'s graft is no longer a private matter whispered at court — it is becoming a public one."
 qing_revenue.12.a:0 "Publicize the findings."
 qing_revenue.12.a.tt:0 "#G The minister's authority rises (+20)#! and his own standing with it. #R A public scandal stirs a touch of unrest#!."
 qing_revenue.12.b:0 "Keep the findings private for now."
 qing_revenue.12.b.tt:0 "#G The minister's authority rises a little (+5)#!. Safer, but slower."
 qing_revenue.13.t:0 "The Court Takes Sides"
 qing_revenue.13.desc:0 "The struggle has run long enough that the Grand Council itself must weigh in. [revenue_minister.GetName] can call in favours to rally its support, or let the matter run its course unaided."
 qing_revenue.13.a:0 "Rally the Grand Council's support."
 qing_revenue.13.a.tt:0 "#G The minister's authority rises (+15)#!. #R Calling in favours costs political influence (-5)#!."
 qing_revenue.13.b:0 "Let events take their course."
 qing_revenue.13.b.tt:0 "#G The minister's authority rises a little (+5)#!. No cost, no help either."
 qing_revenue.9.t:0 "The Reckoning"
 qing_revenue.9.desc_success:0 "The Minister of Revenue's authority has told. [salt_commissioner.GetName] has no patrons left willing to shield him — the 兩淮鹽政 submits to formal oversight, and the salt gabelle is reformed."
 qing_revenue.9.desc_failure:0 "For all the Minister's pressing, [salt_commissioner.GetName]'s networks have held. The salt-merchant patronage endures, and the throne's reformers withdraw, chastened, for now."
 qing_revenue.9.a:0 "The reform is enacted."
 qing_revenue.9.a.tt:0 "#G The salt monopoly law changes to its reformed form#!. #R The treasury absorbs the cost of reform (-120)#!. #G +8% tax efficiency, permanently#!, and the commissioner's graft is cleaned out. The minister's standing rises."
 qing_revenue.9.b:0 "The effort collapses."
 qing_revenue.9.b.tt:0 "The Commissioner's entrenched interests prevail. The matter is closed for a decade."

 # decisions/imp19c_mod_decisions/qing_salt_decisions.txt
 qing_reform_salt_monopoly:0 "Reform the State Salt Monopoly"
 qing_reform_salt_monopoly_desc:0 "The salt gabelle is a vast source of revenue, but the salt-merchant networks are riddled with graft. Committing the throne's authority to reforming it means a real struggle — the Grand Minister of Revenue must assert himself over the entrenched Salt Commissioner, a contest that will play out over years, not days.\n\n#Y Requires the Minister of Revenue to be more personally compelling than the Salt Commissioner.#!"
 qing_reform_salt_monopoly_charisma_req:0 "The Minister of Revenue must be more personally compelling (charismatic) than the Salt Commissioner."

 qing_revenue.2.t:0 "The Ever-Normal Granaries (常平倉)"
 qing_revenue.2.desc:0 "The harvest has been good in the Yellow River provinces. [revenue_minister.GetName] proposes stocking the ever-normal granaries (常平倉) — grain reserves to stabilise prices and buffer famine. This is the mark of wise administration, but it costs silver."
 qing_revenue.2.a:0 "Stock the granaries — wise administration."
 qing_revenue.2.a.tt:0 "A granary is built in a Yellow River province. Unrest falls as the people see the throne's care."
 qing_revenue.2.b:0 "Divert the surplus to the treasury."
 qing_revenue.2.b.tt:0 "The throne takes the silver, but forgoes the unrest control the granaries would have provided."
 qing_revenue.2.c:0 "The reserves are tested by famine."
 qing_revenue.2.c.tt:0 "A famine consumes a granary's reserves, but the blow is cushioned. The ever-normal system works."

 qing_revenue.3.t:0 "The Silver Crisis (銀荒)"
 qing_revenue.3.desc:0 "The opium drain is bleeding silver from the realm, and copper-cash inflation is ruining the taxpayers (銀貴錢賤 — silver dear, cash base). [revenue_minister.GetName] must act: can the Grand Minister of Revenue arrest this crisis, or will the throne's fisc collapse?"
 qing_revenue.3.a:0 "Decisive policy response — arrest the silver drain."
 qing_revenue.3.a.tt:0 "The minister's decisive intervention replenishes the 戶部銀庫 silver reserve and reduces currency stress, at a cost to the treasury."
 qing_revenue.3.b:0 "Half-measures — do what we can."
 qing_revenue.3.b.tt:0 "A partial intervention modestly replenishes the silver reserve and yields a small reduction in currency stress."
 qing_revenue.3.c:0 "Botched response — the minister is unfit."
 qing_revenue.3.c.tt:0 "The intervention fails. Currency stress INCREASES, and the minister is discredited."
 qing_revenue.3.d:0 "Do nothing — the crisis continues."
 qing_revenue.3.d.tt:0 "The silver crisis worsens."

 qing_revenue.4.t:0 "The Treasury Audit"
 qing_revenue.4.desc:0 "Corruption has seeped into every corner of the realm, and the land-tax revenue does not match what the throne should receive. [revenue_minister.GetName] proposes a thorough audit of the provincial treasuries: will it uncover embezzlement, or will the graft prove too well-hidden?"
 qing_revenue.4.a:0 "Uncover the embezzlement — an honest audit."
 qing_revenue.4.a.tt:0 "The audit recovers embezzled funds and reduces corruption, but the minister makes powerful enemies."
 qing_revenue.4.b:0 "Find nothing — the graft is too deep, or the minister is complicit."
 qing_revenue.4.b.tt:0 "The audit finds nothing. Corruption persists, and the minister's reputation suffers."
 qing_revenue.4.c:0 "Partial recovery — some graft uncovered, but not all."
 qing_revenue.4.c.tt:0 "The audit recovers some embezzled funds and modestly reduces corruption."
 qing_revenue.4.d:0 "Impanel a tribunal — try the minister (審理)."
 qing_revenue.4.d.tt:0 "Escalate to a #Y Censorate trial#! of the Grand Minister of Revenue: conviction brings confiscation, a vacated office, and the emperor's sentence (dismissal or death); acquittal emboldens him. #Y Shown only when corruption is flagrant (>=60), and once the court has a free hand this quarter.#!"

 qing_salt_gabelle_reformed_mod:0 "Salt Gabelle Reformed (鹽政)"
 qing_salt_gabelle_reformed_mod_desc:0 "The salt monopoly has been cleaned up, bringing honest revenue to the throne."
 qing_salt_gabelle_graft:0 "Salt Gabelle Graft"
 qing_salt_gabelle_graft_desc:0 "The salt-merchant patronage networks are entrenched, and graft persists."
 qing_granaries_stocked:0 "Granaries Stocked (常平倉)"
 qing_granaries_stocked_desc:0 "The ever-normal granaries are full, buffering famine and stabilising grain prices."
 qing_granaries_cushioned_famine:0 "Granaries Cushioned Famine"
 qing_granaries_cushioned_famine_desc:0 "The grain reserves absorbed the famine's shock. The ever-normal system works."
 qing_silver_crisis_managed:0 "Silver Crisis Managed (銀荒)"
 qing_silver_crisis_managed_desc:0 "Effective policy has arrested the opium/silver drain."
 qing_silver_crisis_botched:0 "Silver Crisis Botched"
 qing_silver_crisis_botched_desc:0 "The failed intervention has worsened the silver crisis."
 qing_treasury_audit_success:0 "Treasury Audit Success"
 qing_treasury_audit_success_desc:0 "The audit has recovered embezzled funds and exposed corrupt officials."

 # ---- qing_revenue.5 — the treasury at its historic peak (盈庫之盛) [#372] ----
 qing_revenue.5.t:0 "The Fullest Coffers the Dynasty Has Known"
 qing_revenue.5.desc:0 "The Grand Minister of Revenue brings word that the silver treasury of the Ministry (戶部銀庫) has swollen to a height never before seen — better than eighty million taels lie in the vaults at Peking, the accumulated surplus of decades of peace, a reformed salt gabelle, the grain tribute of the canal, and the taxes of a teeming, prosperous empire. Not the Ming at its height, nor any dynasty before, kept so great a store. The court debates what such abundance is for: is it a reserve against the lean years and the wars that always come, to be locked away and husbanded — or is it the means, at last, to build on a scale worthy of the age, and to let the empire feast on its own success?"
 qing_revenue.5.a:0 "Lock it away — a war-chest against the lean years (盈庫備荒)."
 qing_revenue.5.a.tt:0 "The Yongzheng prudence: the treasure is husbanded against future dearth and war. #G +2 Stability#!, #G +5 Legitimacy#!, #G the Emperor is esteemed for his foresight#!."
 qing_revenue.5.b:0 "Build on a scale worthy of the age (大興土木)."
 qing_revenue.5.b.tt:0 "The expansive late-Qianlong magnificence: a share of the reserve funds grand works and largesse. #R Draws down 8,000千兩 (~8 million taels) of silver#!, but #G the Emperor is acclaimed#! (+10 popularity), #G +3 Legitimacy#!, and #G a new ever-normal granary is stocked#!."

 # ---- qing_revenue.6 — a new ever-normal granary funded (常平倉增置) [#92] ----
 qing_revenue.6.t:0 "A New Ever-Normal Granary"
 qing_revenue.6.desc:0 "The reserves stand high, and a good harvest has left the Board of Revenue with a surplus to invest. The Grand Minister of Revenue reports that a new ever-normal granary (常平倉) has been raised at [qing_gran_built_province.GetName] in the Yellow River basin, at a cost of #R 255 to the treasury#!. The store will hold grain against the lean years and steady the price of rice across the heartland — the classic instrument of the dynasty's care for the people's livelihood (民生)."
 qing_revenue.6.a:0 "The reserve grows (增置常平倉)."
