l_english:
 # [#223] Localization for the state-investment / city-status province buttons and their
 # state_improvement.N event chain. The buttons + events were copied from Terra Indomita (a vanilla
 # Imperator: Rome feature) but never localized in this total conversion. Reskinned to the Qing /
 # 19th-century setting per project direction. Covers: the 4 invest-in-state buttons, the
 # found-city / found-metropolis / revoke-city-status buttons (already wired in province_window.gui
 # but previously showing raw loc keys), the increase-civilization-cap button, the state_improvement_*
 # modifier names + descriptions, and the notification events state_improvement.12-.15/.18.

 # --- Invest-in-state buttons: confirm dialogs ---
 invest_mil_t:0 "Fortify the Province"
 invest_mil_desc:0 "Raise garrison works, drill grounds, and provincial procurators across #Y [ProvinceWindow.GetState.GetName]#!. Proceed?"
 invest_civ_t:0 "Fund Yamen Works"
 invest_civ_desc:0 "Commission granaries, courthouses, roads, and waterworks throughout #Y [ProvinceWindow.GetState.GetName]#!. Proceed?"
 invest_ora_t:0 "Charter Merchant Guilds"
 invest_ora_desc:0 "Grant charters to the merchant guilds of #Y [ProvinceWindow.GetState.GetName]#! and open new trade custom. Proceed?"
 invest_rel_t:0 "Endow Temples & Academies"
 invest_rel_desc:0 "Patronise the shrines, examination halls, and local academies of #Y [ProvinceWindow.GetState.GetName]#!. Proceed?"

 # --- Shared invest-button tooltips ---
 already_improving_infrastructure:0 "#R An investment is already underway in this state.#!"
 investments_ongoing_1_year:0 "\nAfter #Y 6 months#!:"
 reduce_investments_by_1:0 "Spends #Y 1#! free province investment.\n"

 # --- Invest-button GUI hover tooltips (province_window.gui) ---
 INVEST_IN_STATE_BUTTON_MILITARY_BUTTON_TOOLTIP:0 "#T Fortify the Province#!\nInvest in this state's defences: #G +1 Fortress Limit#! and #G +0.01 Monthly State Loyalty#!, after six months."
 INVEST_IN_STATE_BUTTON_CIVIC_BUTTON_TOOLTIP:0 "#T Fund Yamen Works#!\nInvest in public infrastructure: #G +5% Local Tax#! and #G +0.01 Monthly State Loyalty#!, after six months."
 INVEST_IN_STATE_BUTTON_ORATORY_BUTTON_TOOLTIP:0 "#T Charter Merchant Guilds#!\nEncourage commerce: #G +2 State Trade Routes#!, after six months."
 INVEST_IN_STATE_BUTTON_RELIGIOUS_BUTTON_TOOLTIP:0 "#T Endow Temples & Academies#!\nPatronise faith and learning: #G +5% Local Population Happiness#!, after six months."

 # --- State-improvement modifiers: names + descriptions ---
 state_improvement_military:0 "Fortified Province"
 desc_state_improvement_military:0 "Garrison works and drill grounds strengthen this state's defences."
 state_improvement_civic:0 "Yamen Works"
 desc_state_improvement_civic:0 "Granaries, courthouses, and waterworks enrich and order this state."
 state_improvement_oratory:0 "Chartered Guilds"
 desc_state_improvement_oratory:0 "Merchant guilds have opened new trade custom in this state."
 state_improvement_religious:0 "Temple & Academy Endowments"
 desc_state_improvement_religious:0 "Endowed shrines and academies raise the spirits of this state's people."
 desc_state_modification_in_progress:0 "An investment is underway in this state; another cannot begin until it is complete."

 # --- Notification events (state_improvement.12-.15, .18) ---
 state_improvement.12.t:0 "Province Fortified"
 state_improvement.12.desc:0 "The garrison works commissioned in [state_improvement_target.GetName] are complete, and the province stands better defended."
 state_improvement.12.a:0 "A wall well raised."
 state_improvement.13.t:0 "Yamen Works Completed"
 state_improvement.13.desc:0 "The new public works in [state_improvement_target.GetName] — granaries, courthouses, and roads — are finished and already easing the burdens of administration."
 state_improvement.13.a:0 "The realm is the better for it."
 state_improvement.14.t:0 "Guilds Chartered"
 state_improvement.14.desc:0 "The merchant guilds of [state_improvement_target.GetName] have taken up their charters, and fresh trade custom flows through the province."
 state_improvement.14.a:0 "Let commerce flourish."
 state_improvement.15.t:0 "Temples & Academies Endowed"
 state_improvement.15.desc:0 "Our endowments to the shrines and academies of [state_improvement_target.GetName] are gratefully received, and the people's spirits rise."
 state_improvement.15.a:0 "Piety and learning rewarded."
 state_improvement.18.t:0 "Urban Development Complete"
 state_improvement.18.desc:0 "The coordinated works in [local_civilization_target.GetName] are finished, and the city has grown more civilised."
 state_improvement.18.a:0 "A city worthy of the age."

 # --- Increase civilization cap button ---
 increase_civ_cap_t:0 "Coordinate Urban Development"
 increase_civ_cap_desc:0 "Direct a concerted programme of urban planning in #Y [ProvinceWindow.GetProvince.GetName]#!. Output will fall while works proceed, but the city will grow more developed. Proceed?"
 city_output_reduced_tt:0 "#R Output of this city will be reduced#! for two years while urban development is coordinated.\n\nAfter #Y 2 years#!:"

 # --- Found city / metropolis / revoke buttons: confirm dialogs ---
 found_city_button_confirm_t:0 "Found City"
 found_city_button_confirm_desc:0 "Raise #Y [ProvinceWindow.GetProvince.GetName]#! to the status of a city? Existing settlement buildings will be torn down and their cost is not refunded."
 found_metropolis_button_confirm_t:0 "Found Metropolis"
 found_metropolis_button_confirm_desc:0 "Elevate #Y [ProvinceWindow.GetProvince.GetName]#! to a great metropolis?"
 revoke_city_status_button_confirm_t:0 "Revoke City Status"
 revoke_city_status_button_confirm_desc:0 "Reduce #Y [ProvinceWindow.GetProvince.GetName]#! back to a settlement? Its people will resent the loss for a time."

 # --- Found/revoke button tooltips (custom_tooltip + gui hover) ---
 newline_tt:0 "\n"
 founding_city_in_progress_tt:0 "#Y This province is being raised to a city.#!"
 founding_metropolis_in_progress_tt:0 "#Y This city is being elevated to a metropolis.#!"
 gains_new_trade_good_city_tt:0 "A new #Y trade good#! will be produced here."
 time_to_complete_city_tt:0 "After a period of reduced output, a #Y city#! will be established."
 time_to_complete_metropolis_tt:0 "After a period of reduced output, a #Y metropolis#! will be established."
 city_angry_for_a_while:0 "#R The province will resent the loss of its city status for a time.#!"
 FOUND_CITY_BUTTON_TOOLTIP:0 "#T Found City#!\nRaise this settlement to a city, increasing its population capacity and unlocking new buildings."
 FOUND_METROPOLIS_BUTTON_TOOLTIP:0 "#T Found Metropolis#!\nElevate this city to a metropolis, the grandest rank a province may hold."
 REVOKE_CITY_STATUS_BUTTON_TOOLTIP:0 "#T Revoke City Status#!\nReduce a city or metropolis back to a settlement, sharply lowering its population capacity and angering its people."
