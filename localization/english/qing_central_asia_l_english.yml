l_english:
 # ####################################################################
 # [#448] The Western Regions (經略西域) — the Qing expansion into
 # Central Asia beyond the Xinjiang consolidation: the Kazakh steppe
 # and the Silk Road khanates of the Ferghana and Transoxiana.
 # See common/missions/qing_central_asia_missions.txt,
 # common/scripted_effects/se_QING_CENTRAL_ASIA.txt,
 # common/modifiers/qing_central_asia_modifiers.txt.
 # ####################################################################

 qing_central_asia_mission:0 "The Western Regions (經略西域)"
 qing_central_asia_mission_DESCRIPTION:0 "The Qianlong conquest of Xinjiang has brought the empire to the doorstep of the Kazakh steppe and the caravan cities of the Silk Road. The three Juz of the Kazakhs and the khanates of the Ferghana — Kokand, Bukhara, Khiva — sit astride the old roads west. Push the empire's dominance past the pass: bring the steppe hordes into the tributary system, overawe the caravan cities, and hold the ground of Transoxiana itself. Let the Western Regions be pacified as they were in the days of the Han and the Tang."
 qing_central_asia_mission_CRITERIA_DESCRIPTION:0 "This enterprise is complete when the Central Asian khanates have been subdued and the Qing writ runs from Kokand to the Kazakh steppe."
 qing_central_asia_mission_REWARD_DESCRIPTION:0 "Completing every objective in this tree grants its capstone reward."
 qing_central_asia_mission_BUTTON_TOOLTIP:0 "Open this mission tree."

 qing_ca_beyond_pass:0 "The Road Beyond the Pass (出關)"
 qing_ca_beyond_pass_DESC:0 "Commit the frontier armies and the caravan revenues to the westward push past Jiayuguan and the Ili valley — the point from which the empire reaches into the steppe and the khanates. Costs #Y 100#! treasury and #Y 25#! political influence."
 qing_ca_beyond_pass_tt:0 "Open the enterprise: the westward road is committed, and the court takes heart (#G ruler popularity#!)."

 qing_ca_kazakh:0 "The Kazakh Steppe (撫哈薩克)"
 qing_ca_kazakh_DESC:0 "Bring the three Juz — the Great, Middle and Little Hordes — into the tributary system, as they historically sent tribute to Qianlong after the fall of the Dzungars. Costs #Y 30#! political influence."
 qing_ca_needs_kazakh_tt:0 "At least one of the three #Y Kazakh hordes (哈薩克) must exist#! on the map to be reached."
 qing_ca_kazakh_tt:0 "The steppe bows: every extant Kazakh horde is brought under the wing as a #G sinosphere tributary#!, and the court exults (#G ruler popularity#!)."

 qing_ca_khanates:0 "The Caravan Cities (懾服浩罕)"
 qing_ca_khanates_DESC:0 "Overawe the khanates of the Silk Road — Kokand, Bukhara, Khiva — into the tributary system. Costs #Y 30#! political influence."
 qing_ca_needs_khanates_tt:0 "At least one of the #Y Silk Road khanates (浩罕/布哈拉/希瓦) must exist#! on the map to be reached."
 qing_ca_khanates_tt:0 "The caravan cities submit: every extant khanate is overawed into the fold as a #G sinosphere tributary#!, and the court exults (#G ruler popularity#!)."

 qing_ca_ferghana:0 "The Ferghana Valley (據費爾干納)"
 qing_ca_ferghana_DESC:0 "The deepest reach: hold the ground of the Ferghana — the rich valley of Kokand and Tashkent, the heart of Transoxiana's Silk Road. You must take and hold the ground yourself. Costs #Y 80#! treasury."
 qing_ca_needs_ferghana_tt:0 "The Qing must #Y control at least one province in the Fergana region#! (費爾干納)."
 qing_ca_ferghana_tt:0 "The valley is held — Qing arms stand in the heart of Transoxiana. The realm steadies (#G stability#!) and the court rejoices (#G ruler popularity#!)."

 qing_ca_capstone:0 "The Western Regions Pacified (西域大定)"
 qing_ca_capstone_DESC:0 "The steppe hordes and the caravan cities under the Son of Heaven, and Qing ground in the heart of Transoxiana. The Silk Road revived under the imperial peace — tribute and caravan trade flowing east — as in the days of the Han and the Tang."
 qing_ca_needs_pacified_tt:0 "The Qing must hold #Y at least two Central Asian tributaries#! (Kazakh hordes or khanates) AND #Y control ground in the Fergana#! (費爾干納)."
 qing_ca_capstone_tt:0 "The Western Regions are pacified. The lasting #G The Western Regions (qing_western_regions)#! is sealed — diplomatic weight, a revived caravan-commerce dividend, legitimacy and the manpower of the steppe frontier — the realm steadies (#G stability#!) and the emperor's glory rings across the western marches (#G ruler popularity#!)."

 # ---- modifiers ----
 qing_western_regions:0 "The Western Regions (西域大定)"
 qing_western_regions_desc:0 "The Kazakh steppe and the Silk Road khanates under the Son of Heaven, and Qing ground in the heart of Transoxiana. A lasting dividend of diplomatic weight, revived caravan commerce, legitimacy, and the manpower of the pacified western frontier."

# --- Western Regions tree expansion (>=10 tasks) ---
 qing_ca_ili_general_tt:0 "Seat the General of Ili at Huiyuan — the administrative heart of the New Dominion."
 qing_ca_needs_ili_tt:0 "We must hold ground in the Ili valley and Dzungaria (Turkestan region)."
 qing_ca_begs_tt:0 "The Muslim begs of the Tarim oases rule their cities under our warrant."
 qing_ca_tuntian_tt:0 "Soldier-farmers settle the oasis land; the garrisons feed themselves."
 qing_ca_silk_road_tt:0 "The imperial peace reopens the caravan roads — tribute and trade flow east."
 qing_ca_border_tt:0 "The boundary markers and picket line fix the empire's western limit."

# --- task titles + descriptions (mission-tree display) ---
 qing_ca_ili_general:0 "The Ili General (設伊犁將軍)"
 qing_ca_ili_general_DESC:0 "Plant the administrative seat of the New Dominion at Huiyuan — the General of Ili. Costs #Y 60#! treasury."
 qing_ca_begs:0 "The Begs of Altishahr (羈縻伯克)"
 qing_ca_begs_DESC:0 "Co-opt the Muslim oasis nobility of the Tarim, ruling the caravan cities through their begs. Costs #Y 25#! political influence."
 qing_ca_tuntian:0 "The Military Colonies (廣興屯田)"
 qing_ca_tuntian_DESC:0 "Settle soldier-farmers on the oasis land so the garrisons feed themselves. Costs #Y 50#! treasury."
 qing_ca_silk_road:0 "The Silk Road Revived (絲路重興)"
 qing_ca_silk_road_DESC:0 "The imperial peace reopens the caravan roads; tribute and trade flow east. Costs #Y 20#! political influence."
 qing_ca_border:0 "The Frontier Fixed (定界立碑)"
 qing_ca_border_DESC:0 "Set the boundary markers and karun picket line that fix the empire's western limit. Costs #Y 40#! treasury."

 qing_ca_dzungar_remnant:0 "The Dzungar Remnant (準噶爾餘部)"
 qing_ca_dzungar_remnant_DESC:0 "Run down the last Dzungar bands scattered across the steppe. Costs #Y 55#! treasury."
 qing_ca_dzungar_remnant_tt:0 "The last Dzungar bands are run down on the steppe."
 qing_ca_torghut:0 "The Return of the Torghut (土爾扈特歸)"
 qing_ca_torghut_DESC:0 "Receive the Torghut Mongols home from the Volga to the imperial pastures. Costs #Y 25#! political influence."
 qing_ca_torghut_tt:0 "The Torghut Mongols are received home from the Volga."
 qing_ca_kashgar:0 "The Oasis of Kashgar (喀什噶爾)"
 qing_ca_kashgar_DESC:0 "Take Kashgar, the great western oasis of the Tarim rim. Costs #Y 60#! treasury."
 qing_ca_kashgar_tt:0 "Kashgar, the western oasis, is taken."
 qing_ca_yarkand:0 "Yarkand (葉爾羌)"
 qing_ca_yarkand_DESC:0 "Bring Yarkand and its caravan wealth under the Ili general's writ. Costs #Y 55#! treasury."
 qing_ca_yarkand_tt:0 "Yarkand and its caravan wealth submit."
 qing_ca_khotan:0 "The Jade of Khotan (和闐玉)"
 qing_ca_khotan_DESC:0 "Master Khotan, whose rivers yield the finest jade of the empire. Costs #Y 60#! treasury."
 qing_ca_khotan_tt:0 "Khotan and its jade rivers pass to the throne."
 qing_ca_kokand:0 "The Khanate of Kokand (浩罕汗國)"
 qing_ca_kokand_DESC:0 "Treat with the Khanate of Kokand beyond the western passes. Costs #Y 25#! political influence."
 qing_ca_kokand_tt:0 "The Khanate of Kokand accepts the caravan accord."
 qing_ca_bukhara:0 "Bukhara the Noble (布哈拉)"
 qing_ca_bukhara_DESC:0 "Open the road to Bukhara, ancient seat of learning on the Silk Road. Costs #Y 25#! political influence."
 qing_ca_bukhara_tt:0 "The road to Bukhara is opened."
 qing_ca_tarbagatai:0 "The Tarbagatai Passes (塔爾巴哈台)"
 qing_ca_tarbagatai_DESC:0 "Hold the Tarbagatai passes onto the Kazakh steppe. Costs #Y 55#! treasury."
 qing_ca_tarbagatai_tt:0 "The Tarbagatai passes are held."
 qing_ca_muslim_begs:0 "The Muslim Begs (回部伯克)"
 qing_ca_muslim_begs_DESC:0 "Confirm the Muslim begs as the throne's officers over the oasis towns. Costs #Y 20#! political influence."
 qing_ca_muslim_begs_tt:0 "The Muslim begs govern the oases as the throne's officers."
 qing_ca_garrison_cities:0 "The Garrison Cities (滿城駐防)"
 qing_ca_garrison_cities_DESC:0 "Raise the walled Manchu garrison cities that anchor the western dominion. Costs #Y 70#! treasury."
 qing_ca_garrison_cities_tt:0 "The Manchu garrison cities anchor the western dominion."

 # --- 安西都護府 the Pacified-West MARCH (relocated from the colonization tree, #27 P3b) ---
 qing_ca_anxi_march:0 "The Protectorate-General of the Pacified West (安西都護府)"
 qing_ca_anxi_march_DESC:0 "The Tang held the Silk Road through the Protectorate-General of the Pacified West (安西都護府), seated at Kucha, its Four Garrisons (安西四鎮) watching the road to Central Asia. Revive it not as directly-ruled provinces but as a self-governing frontier march: gather the conquered oasis khanates — Kokand, Bukhara, Khiva — under a Manchu Governor-General appointed by the Lifan Yuan, a march mandated to hold and extend the western road on the Son of Heaven's behalf, funded by the throne's silver rather than paying tribute to it."
 qing_ca_anxi_march_tt:0 "Erect the #Y Protectorate-General of the Pacified West#! from your conquered oasis holdings (Ferghana, Bukhara, Khwarezm) — a self-governing #G frontier march#! (都護府) that holds the other khanates as its own subjects; #G eases ethnic tension#!. Gain the #G Pacified West#! modifier."
 qing_ca_needs_oasis_land_tt:0 "You must own at least #Y 3 provinces across the conquered oasis khanates#! (the Ferghana, Bukhara or Khwarezm regions) to erect the march"
 qing_protectorate_anxi_name:0 "Anxi (安西都護府)"
 qing_protectorate_anxi_adj:0 "Anxi"
 qing_col_protectorate_west:0 "Protectorate of the Pacified West (安西)"
