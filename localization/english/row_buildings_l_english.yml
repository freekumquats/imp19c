l_english:

 # ==========================================================================
 # row_buildings_l_english.yml — [bookmark-1763 #291] Rest-of-world specialty
 # production buildings (common/buildings/row_production_buildings.txt). Generic,
 # abstract counterparts to the Qing's five named specialty works — one manufactory
 # for finished/craft goods, one plantation for cash crops.
 # BOM / LF, matching the other localization/english/*.yml files.
 # ==========================================================================

 row_manufactory_building:0 "Manufactory"
 row_manufactory_building_desc:0 "A concentrated works of skilled looms, kilns and craft benches — the mills of Lancashire and Flanders, the Saxon and Bohemian workshops, the muslin houses of Bengal. It multiplies the province's output of finished and craft goods and swells the skilled middle and upper strata that staff it."

 row_plantation_building:0 "Plantation"
 row_plantation_building_desc:0 "A large commercial estate worked for export — Caribbean sugar, Chesapeake tobacco, Brazilian coffee, East-Indies spice. Labour-intensive: it multiplies the province's cash-crop output and draws in the lower strata and bound labour that worked the fields."

 # [#101 2026-08-13] Cottage Industry — generic non-Chinese rural raw-good top-up building.
 row_cottage_workshop_building:0 "Cottage Workshop"
 row_cottage_workshop_building_desc:0 "A rural household workshop working iron, lead, textile fibres, silk, wood, vegetables, copper, tin, or stone at the family scale — labour outside the formal employment economy. It multiplies the province's raw-good output and draws in the lower strata and proletariat who work it, without competing with any other building for the province's job slots."

 # Build-menu / macro-builder tooltip strings (referenced by gui/shared/custom_tooltip.gui).
 tooltip_row_manufactory_building:0 "#T Results:#!\n#G +40%#! middle strata output\n#G +30%#! upper strata output\n#G +30%#! lower strata output\n#G +3%#! middle strata desired share\n#G +1%#! upper strata desired share\n#G +0.005#! monthly civilization\n\n#T Other Results:#!\n#G +2#! base resources — produces the province's finished/craft good.\n\nRequires #Y Manufactories#!; buildable by any non-Chinese state on a matching good."
 tooltip_row_plantation_building:0 "#T Results:#!\n#G +50%#! lower strata output\n#G +40%#! indentured output\n#G +20%#! middle strata output\n#G +5%#! lower strata desired share\n#G +0.003#! monthly civilization\n\n#T Other Results:#!\n#G +2#! base resources — produces the province's cash crop.\n\nRequires #Y Construction#!; buildable by any non-Chinese state on a matching good."
 tooltip_row_cottage_workshop_building:0 "#T Results:#!\n#G +20%#! lower strata output\n#G +15%#! proletariat output\n\n#T Other Results:#!\n#G +1#! base resources — produces the province's raw good.\n\nRural only; does #Y not#! require sufficient job slots — buildable even when the province has none left."
 tooltip_macro_building_title_row_manufactory_building:0 "#T Build #L $row_manufactory_building$#!"
 tooltip_macro_building_title_row_plantation_building:0 "#T Build #L $row_plantation_building$#!"
