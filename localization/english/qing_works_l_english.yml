l_english:
 qing_dike_building:0 "河堤 River Dike"
 qing_dike_building_desc:0 "A section of the Yellow River dike system (黃河河堤), maintained by the Board of Works at enormous annual expense (河工). Reduces flood risk and supports local food production."
 qing_canal_depot_building:0 "漕運倉 Grand Canal Depot"
 qing_canal_depot_building_desc:0 "A grain-tribute granary and warehouse on the Grand Canal (大運河), part of the 漕運 system that moved rice north to the capital. Supports trade, food supply, and tax collection."
 qing_wall_section_building:0 "長城段 Great Wall Section"
 qing_wall_section_building_desc:0 "A restored monumental section of the Great Wall (長城). Militarily obsolete by the Qing but symbolically resonant — a demonstration of imperial majesty and defensive resolve."

 qing_works.1.t:0 "The Yellow River Dike Breach"
 qing_works.1.desc:0 "A section of the Yellow River (黃河) dike system has failed, and floodwaters threaten the North China plain. The Board of Works (工部) advises immediate repairs, but the hydraulic-works budget (河工) is notoriously a sink of graft and overruns. A proper repair will be costly; a cheap one will feed corruption and risk recurring failures."
 qing_works.1.a:0 "Commission a proper dike repair."
 qing_works.1.a.tt:0 "The Board of Works commissions a proper dike repair, if the minister's finesse is at least 7.\nIf finesse 9 or higher: #R Treasury: -70#!\nIf finesse 7-8: #R Treasury: -90#!, #R Corruption: +4#!\nIf finesse below 7: no dike is built and no treasury is spent.\n#G Stability: +1#!\n#G Well-Maintained Dikes#! (10 years: state loyalty +2%/month, stability +1%/month, unrest -0.5)"
 qing_works.1.b:0 "Cut corners and save the treasury."
 qing_works.1.b.tt:0 "The Board of Works builds a dike on the cheap, regardless of who holds the ministry.\nIf a capable minister (finesse 9 or higher) oversees it: #R Treasury: -70#!\nOtherwise: #R Treasury: -90#!, #R Corruption: +8#!\n#R Shoddy Dikes#! (5 years: unrest +0.8)\nA follow-up flood-risk event may fire in 2-3 years."
 qing_works.1.c:0 "We cannot afford it."
 qing_works.1.c.tt:0 "The dike is not repaired; the Yellow River breaches the levee.\n#R Flood Damage#! (5 years: unrest +2, state loyalty -3%/month, population happiness -5%)\n#R Corruption: +5#!"

 qing_works.2.t:0 "The Grand Canal Silts Up"
 qing_works.2.desc:0 "The Grand Canal (大運河) system is clogging with silt, threatening the grain-tribute lifeline (漕運) that feeds the capital. The Board of Works (工部) can dredge and maintain the canal, but the cost is high. Alternatively, we could shift to sea-borne grain transport, abandoning the old system — but that will cause unrest among the canal workers and dependent regions."
 qing_works.2.a:0 "Dredge the canal and maintain the tribute system."
 qing_works.2.a.tt:0 "The Board of Works dredges the canal and builds a depot, if the minister's finesse is at least 7.\nIf finesse 9 or higher: #R Treasury: -65#!\nIf finesse 7-8: #R Treasury: -85#!, #R Corruption: +3#!\nIf finesse below 7: no depot is built and no treasury is spent.\n#G Canal Maintained#! (10 years: tax +5%, food +5%/month, stability +1%/month)"
 qing_works.2.b:0 "Dredge it cheaply."
 qing_works.2.b.tt:0 "The Board of Works dredges the canal on the cheap, regardless of who holds the ministry.\nIf a capable minister (finesse 9 or higher) oversees it: #R Treasury: -65#!\nOtherwise: #R Treasury: -85#!, #R Corruption: +7#!\n#R Canal Decay#! (5 years: food -3%/month, unrest +0.5)"
 qing_works.2.c:0 "Shift to sea transport and abandon the canal."
 qing_works.2.c.tt:0 "Abandon the Grand Canal tribute system for sea transport.\n#R Stability: -1#!\n#R Corruption: +3#!\n#R Canal Abandoned#! (10 years: unrest +1.5, state loyalty -2%/month, stability -2%/month)"

 qing_works.3.t:0 "Rebuild the Great Wall"
 qing_works.3.desc:0 "The Board of Works (工部) proposes restoring a monumental section of the Great Wall (長城) as a prestige project. Militarily obsolete — the Wall did not stop our own conquest from Manchuria — but symbolically resonant. It would demonstrate imperial majesty and defensive resolve, at considerable cost."
 qing_works.3.a:0 "Commission the Great Wall restoration."
 qing_works.3.a.tt:0 "The Board of Works restores a Great Wall section, if the minister's finesse is at least 7.\nIf finesse 9 or higher: #R Treasury: -90#!, #G Stability: +1#!\nIf finesse 7-8: #R Treasury: -120#!, #R Corruption: +5#!, #G Stability: +1#!\nIf finesse below 7: no wall section is built and no treasury is spent.\n#G Political Influence: +25#!\n#G Great Wall Restored#! (20 years: political influence +8%/month, defensive +3%, stability +1%/month)"
 qing_works.3.b:0 "Do it on the cheap."
 qing_works.3.b.tt:0 "The Board of Works restores a Great Wall section on the cheap, regardless of who holds the ministry.\nIf a capable minister (finesse 9 or higher) oversees it: #R Treasury: -90#!, #G Stability: +1#!\nOtherwise: #R Treasury: -120#!, #R Corruption: +10#!\n#G Political Influence: +15#!\n#G Shoddy Wall Work#! (10 years: political influence +4%/month, defensive +1%)"
 qing_works.3.c:0 "Decline the project."
 qing_works.3.c.tt:0 "Decline the Great Wall project.\n#G Wall Project Deferred#! (5 years: marker only, no mechanical effect)"

 qing_works.4.t:0 "River-Works Embezzlement Scandal"
 qing_works.4.desc:0 "The Grand Minister of Works (工部尚書) has been caught siphoning funds from the hydraulic-works budget (河工). The Yellow River dike system is a notorious sink of graft; officials have enriched themselves on overruns for generations. [scope:works_minister.GetName] is merely the latest. Do we punish him, or let it slide?"
 qing_works.4.a:0 "Confiscate the embezzled funds and brand him corrupt."
 qing_works.4.a.tt:0 "Confiscate the embezzled funds and brand [scope:works_minister.GetName] corrupt.\n[scope:works_minister.GetName]:\n#R Corruption: +20#! (gains the Corrupt trait if he lacked it)\n#R Gold: -100#!\n#R Loyalty: -40 (Disgraced)#!\n#G Treasury: +40#!\n#G Corruption: -6#!\n#R Tyranny: +2#!"
 qing_works.4.b:0 "Look the other way."
 qing_works.4.b.tt:0 "Let it slide — [scope:works_minister.GetName] prospers.\n#R Corruption: +10#!\n[scope:works_minister.GetName]:\n#G Gold: +80#!\n#R Corruption: +15#!\n#R Graft Tolerated#! (10 years: monthly corruption +5%, tax -3%)"

 qing_works.5.t:0 "The Shoddy Dike Fails"
 qing_works.5.desc:0 "The cheap dike repair we commissioned has failed. The Yellow River (黃河) has breached the makeshift levee, and floodwaters are spreading across the North China plain. We can pay to repair it properly this time, or accept the damage."
 qing_works.5.a:0 "Repair it properly this time."
 qing_works.5.a.tt:0 "Commission a proper dike repair, if the minister's finesse is at least 7.\nIf finesse 9 or higher: #R Treasury: -70#!\nIf finesse 7-8: #R Treasury: -90#!, #R Corruption: +4#!\nIf finesse below 7: no dike is built and no treasury is spent.\n#G Well-Maintained Dikes#! (10 years: state loyalty +2%/month, stability +1%/month, unrest -0.5)"
 qing_works.5.b:0 "Accept the flood damage."
 qing_works.5.b.tt:0 "Accept the flood damage.\n#R Flood Damage#! (5 years: unrest +2, state loyalty -3%/month, population happiness -5%)\n#R Corruption: +8#!"

 qing_works_dike_maintained:0 "河堤 Well-Maintained Dikes"
 qing_works_dike_maintained_desc:0 "The Yellow River dike system is in good repair, protecting the populace from floods."
 qing_works_dike_shoddy:0 "河堤 Shoddy Dikes"
 qing_works_dike_shoddy_desc:0 "The dikes were repaired on the cheap; they may fail again."
 qing_works_flood_damage:0 "黃河水患 Flood Damage"
 qing_works_flood_damage_desc:0 "The Yellow River has flooded, causing widespread damage."
 qing_works_canal_maintained:0 "漕運 Canal Maintained"
 qing_works_canal_maintained_desc:0 "The Grand Canal is well-maintained, and the grain tribute flows smoothly."
 qing_works_canal_decay:0 "漕運衰敗 Canal Decay"
 qing_works_canal_decay_desc:0 "The canal is deteriorating despite recent dredging."
 qing_works_canal_abandoned:0 "漕運廢棄 Canal Abandoned"
 qing_works_canal_abandoned_desc:0 "The Grand Canal tribute system has been abandoned; sea transport replaces it."
 qing_works_wall_restored:0 "長城重建 Great Wall Restored"
 qing_works_wall_restored_desc:0 "A monumental section of the Great Wall has been restored, demonstrating imperial majesty."
 qing_works_wall_shoddy:0 "長城草率 Shoddy Wall Work"
 qing_works_wall_shoddy_desc:0 "The Wall section was rebuilt on the cheap; prestige is diminished."
 qing_works_wall_deferred:0 "長城擱置 Wall Project Deferred"
 qing_works_wall_deferred_desc:0 "We declined the Great Wall restoration to conserve funds."
 qing_works_graft_tolerated:0 "河工貪腐 River-Works Graft Tolerated"
 qing_works_graft_tolerated_desc:0 "We turned a blind eye to embezzlement in the hydraulic-works budget; corruption has deepened."
