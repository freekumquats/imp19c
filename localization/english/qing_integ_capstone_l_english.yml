l_english:
 qing_integ.30.t:0 "改土歸流: The Circuit is Complete"
 qing_integ.30.desc:0 "The integration of [target.GetName] has reached its culmination. After years of surveys, tax rolls, and careful pressure, the native chieftaincy (土司 tusi) is ready to be converted into a directly-administered circuit under a regular magistrate (流官 liuguan). This is gaitu guiliu (改土歸流) — the historic Qing policy that turned autonomous frontier lordships into provinces of the realm.\n\nHow shall we enact the absorption?"
 qing_integ.30.a:0 "A grand ceremony: investiture, feast, and solemn ritual."
 qing_integ.30.a.tt:0 "Spend §Y120§! gold to hold a triumphal investiture. Gain legitimacy and stability. The newly incorporated circuit is welcomed with fanfare."
 qing_integ.30.b:0 "A bureaucratic integration: dispatch surveyors and magistrates."
 qing_integ.30.b.tt:0 "Spend §Y60§! gold. The pragmatic path: a census, tax rolls, and circuit officials. Less glory, but faster and cheaper. Strains the bureaucracy."
 qing_integ.30.c:0 "A coercive absorption: send in the Green Standard Army."
 qing_integ.30.c.tt:0 "The Zhao Erfeng model: garrison first, administrate second. Cheap and fast, but provokes tyranny and unrest. The frontier remembers force."
 qing_integ.40.t:0 "川邊改土歸流: Force the Pace?"
 qing_integ.40.desc:0 "The integration of [target.GetName] is well advanced, but not yet complete. Some at court argue that the time has come to issue an incorporation decree (改土歸流令) — to force the pace and finish the work now, rather than wait for the process to mature naturally.\n\nThe precedent: Zhao Erfeng's 川邊改土歸流 (Chuanbian gaitu guiliu, 1904-11), where the Sichuan governor-general forcibly incorporated Kham and eastern Tibet. It worked — but it provoked the 1905 Batang Uprising and laid the groundwork for Tibetan separatism after 1911.\n\nShall we push the decree through, or wait?"
 # [#task-20 2026-08-04] actor-status addenda appended to the .40 desc when the local amban/garrison exist
 qing_integ.40.desc_actors_both:0 "\n\n#Y On the ground:#! the resident amban [integ_amban.GetName] holds his post and an imperial garrison stands in the dependency — a decree forced with both a trusted broker and banner troops behind it is far likelier to be swallowed quietly."
 qing_integ.40.desc_actors_amban:0 "\n\n#Y On the ground:#! the resident amban [integ_amban.GetName] holds his post, though no imperial garrison stands near to overawe the local elite. Whether he can prepare the ground for a decree depends on how firmly he holds the throne's trust."
 qing_integ.40.desc_actors_garrison:0 "\n\n#Y On the ground:#! an imperial garrison stands in the dependency to overawe it — but with no resident amban, there is no-one to soften the decree beforehand."
 qing_integ.40.desc_actors_none:0 "\n\n#Y On the ground:#! neither a resident amban nor an imperial garrison is at hand — a decree forced from afar is the likeliest of all to provoke a rising."
 qing_integ.40.a:0 "Issue the decree. Spend legitimacy and gold to finish now."
 qing_integ.40.a.tt:0 "Spend §Y100§! gold and §Y20§! legitimacy to jump to the integration threshold. Risky: the dependency may resist — though a garrison on the spot and a loyal amban make a rising much less likely."
 qing_integ.40.c:0 "Have the resident amban prepare the ground, then decree."
 qing_integ.40.c.tt:0 "Only when a #G staunch resident amban#! sits in the dependency: he spends months smoothing the local elite, so the decree is forced #G without provoking a rising#!. Spend §Y80§! gold and §Y10§! legitimacy; the amban's standing rises."
 qing_integ.40.b:0 "Wait. Let the process mature naturally."
 qing_integ.40.b.tt:0 "The patient path: no cost, no risk, no acceleration."
 qing_integ.41.t:0 "巴塘起義: The Chieftain Resists"
 qing_integ.41.desc:0 "The incorporation decree has landed in [target.GetName] — and the native chieftain (土司 tusi) has refused it. His kinsmen have risen in armed defiance, echoing the 1905 Batang Uprising (巴塘起義) when Zhao Erfeng's coercive incorporation provoked the Gyalrong chieftains to revolt.\n\nThe precedent cuts both ways. Kangxi, after the Revolt of the Three Feudatories (三藩之亂, 1673-81), granted Wu Sangui's grandson a lesser title and left him in Yunnan rather than executing him outright — a conciliation that kept the peace. Qianlong, facing the second Jinchuan War (金川之戰, 1771-76), sent 60,000 troops and 70 million taels to crush the Gyalrong chieftains — a victory that drained the treasury and seeded resentment for generations.\n\nHow shall we respond?"
 # [#task-20 2026-08-04] actor-status addenda appended to the .41 desc when the local amban/garrison exist
 qing_integ.41.desc_actors_both:0 "\n\n#Y On the ground:#! the resident amban [integ_amban.GetName] is at his post in the rebel dependency, and a Beijing banner garrison stands on its soil — the throne can negotiate through the one or strike through the other."
 qing_integ.41.desc_actors_amban:0 "\n\n#Y On the ground:#! the resident amban [integ_amban.GetName] is at his post, though no imperial garrison stands near to compel the chieftain. Whether the amban can talk him down depends on how firmly he holds the throne's trust."
 qing_integ.41.desc_actors_garrison:0 "\n\n#Y On the ground:#! a Beijing banner garrison stands on the dependency's soil, ready to march — but with no resident amban, there is no-one on the spot to negotiate a settlement."
 qing_integ.41.desc_actors_none:0 "\n\n#Y On the ground:#! neither a resident amban nor an imperial garrison is at hand — the throne must answer this revolt from afar."
 qing_integ.41.a:0 "Conciliate: roll back the decree, restore autonomy."
 qing_integ.41.a.tt:0 "The Kangxi model: when pressed, give ground. Roll back integration progress by §Y2§! steps. Gain stability, lose prestige."
 qing_integ.41.b:0 "Crush: let the revolt become open war, and break it by arms."
 qing_integ.41.b.tt:0 "The Qianlong model. The defiance flares into an open #R war of independence#! — the dependency takes up arms against the throne (it remains your subject unless it wins), and you crush the rising by winning the war. A full field campaign, whether or not a garrison sits on the spot. Costs #R -5 Stability#! and #R -15 Legitimacy#!; gain tyranny and aggressive expansion; suffer war exhaustion and unrest. A wavering or absent amban flees his post. (When a strong garrison IS present, ordering it to march out — the other option — breaks the rising in the field far more cheaply, with no war at all.)"
 qing_integ.41.e:0 "Order the local garrison to march out and crush the rising."
 qing_integ.41.e.tt:0 "Only when a #G banner garrison strong enough to take the field#! already stands in the dependency (two garrisons, as at Yili, count together). The troops are #G already there#!, so the rising is broken #G in the field at once#! — no war to declare, no releasing the subject, and far less tyranny and aggressive expansion than a from-scratch expedition. Costs #R Stability and Legitimacy#! (lighter than the expedition): a dominant garrison crushes it cleanly (#R -1 Stab, -3 Legitimacy#!); rough parity wins but bloodier (#R -3 Stab, -6 Legitimacy#!). The subject is held; integration is not rolled back."
 qing_integ.41.c:0 "Co-opt: bribe the chieftain, marry into his family, grant titles."
 qing_integ.41.c.tt:0 "The Yongzheng rou yuan (柔遠) model: instead of force, co-opt the native elite via gold, prestige, and affinity. Spend §Y100§! gold. If both houses have eligible children, an #G imperial prince weds the chieftain's daughter#!, binding the families in blood."
 qing_integ.41.d:0 "Let the resident amban negotiate a settlement."
 qing_integ.41.d.tt:0 "Only when a #G staunch resident amban#! sits in the dependency: he knows the chieftain and talks him down. A modest rollback of integration, peace kept, and the amban's standing rises for the service."
 qing_integ_new_circuit_solemn:0 "Newly Incorporated Circuit (Solemn Rite)"
 qing_integ_new_circuit_solemn_desc:0 "A triumphal investiture has welcomed this newly absorbed territory into the realm. The pomp and ceremony have won the populace's goodwill, easing the administrative burden."
 qing_integ_new_circuit_bureaucratic:0 "Newly Incorporated Circuit (Bureaucratic)"
 qing_integ_new_circuit_bureaucratic_desc:0 "Surveyors, tax rolls, and circuit magistrates are working overtime to digest this newly absorbed territory. Efficient, but the bureaucracy is strained."
 qing_integ_new_circuit_coercive:0 "Newly Incorporated Circuit (Coercive)"
 qing_integ_new_circuit_coercive_desc:0 "The Green Standard Army garrison holds this newly absorbed territory down. Fast and cheap, but the frontier remembers the heavy hand."
 qing_integ_conciliation_granted:0 "Conciliation Granted to Frontier"
 qing_integ_conciliation_granted_desc:0 "The throne has rolled back its incorporation decree and restored autonomy to a resistant dependency. Face is lost, but peace is kept."
 qing_integ_coopted_chieftain:0 "Co-opted Chieftain"
 qing_integ_coopted_chieftain_desc:0 "This native chieftain has been co-opted via gold, titles, and marriage into the imperial network. His loyalty is personal, not institutional."
