l_english:
 qing_integ.30.t:0 "改土歸流: The Circuit is Complete"
 qing_integ.30.desc:0 "The integration of [target.GetName] has reached its culmination. After years of surveys, tax rolls, and careful pressure, the native chieftaincy (土司 tusi) is ready to be converted into a directly-administered circuit under a regular magistrate (流官 liuguan). This is gaitu guiliu (改土歸流) — the historic Qing policy that turned autonomous frontier lordships into provinces of the realm.\n\nHow shall we enact the absorption?"
 qing_integ.30.a:0 "A grand ceremony: investiture, feast, and solemn ritual."
 qing_integ.30.a.tt:0 "Spend #Y120#! gold to hold a triumphal investiture. Gain legitimacy and stability. The newly incorporated circuit is welcomed with fanfare."
 qing_integ.30.b:0 "A bureaucratic integration: dispatch surveyors and magistrates."
 qing_integ.30.b.tt:0 "Spend #Y60#! gold. The pragmatic path: a census, tax rolls, and circuit officials. Less glory, but faster and cheaper. Strains the bureaucracy."
 qing_integ.30.c:0 "A coercive absorption: bring in the Green Standard Army."
 qing_integ.30.c.tt:0 "The Zhao Erfeng model: garrison first, administrate second. Bringing in an outside column is cheap and fast, but a raw imposition — #R -5 Stability#!, #R +8 Tyranny, +8 Aggressive Expansion#!. The frontier remembers force. (When a #G local garrison#! already stands on the spot, having IT enforce the handover is milder — the other option.)"
 qing_integ.30.e:0 "Have the local garrison enforce the incorporation."
 qing_integ.30.e.tt:0 "Only when a #G banner garrison#! already stands in the dependency: the troops #G already there#! enforce the 改土歸流 on the ground — cheaper and milder than a marched-in column. A dominant garrison makes the handover almost orderly (#R -2 Stability#!); rough parity is rougher (#R -3#!). Still coercive (#R +5 Tyranny, +5 Aggressive Expansion#!) but less than the from-outside imposition; the Ministry of War is credited."
 qing_integ.40.t:0 "川邊改土歸流: Force the Pace?"
 qing_integ.40.desc:0 "The integration of [target.GetName] is well advanced, but not yet complete. Some at court argue that the time has come to issue an incorporation decree (改土歸流令) — to force the pace and finish the work now, rather than wait for the process to mature naturally.\n\nThe precedent: Zhao Erfeng's 川邊改土歸流 (Chuanbian gaitu guiliu, 1904-11), where the Sichuan governor-general forcibly incorporated Kham and eastern Tibet. It worked — but it provoked the 1905 Batang Uprising and laid the groundwork for Tibetan separatism after 1911.\n\nShall we push the decree through, or wait?"
 # [#task-20 2026-08-04] actor-status addenda appended to the .40 desc when the local amban/garrison exist
 qing_integ.40.desc_actors_both:0 "\n\n#Y On the ground:#! the resident amban [integ_amban.GetName] holds his post and an imperial garrison stands in the dependency — a decree forced with both a trusted broker and banner troops behind it is far likelier to be swallowed quietly."
 qing_integ.40.desc_actors_amban:0 "\n\n#Y On the ground:#! the resident amban [integ_amban.GetName] holds his post, though no imperial garrison stands near to overawe the local elite. Whether he can prepare the ground for a decree depends on how firmly he holds the throne's trust."
 qing_integ.40.desc_actors_garrison:0 "\n\n#Y On the ground:#! an imperial garrison stands in the dependency to overawe it — but with no resident amban, there is no-one to soften the decree beforehand."
 qing_integ.40.desc_actors_none:0 "\n\n#Y On the ground:#! neither a resident amban nor an imperial garrison is at hand — a decree forced from afar is the likeliest of all to provoke a rising."
 qing_integ.40.a:0 "Force the decree cold. Spend legitimacy and gold to finish now."
 qing_integ.40.a.tt:0 "Spend #Y100#! gold and #Y20#! legitimacy to jump to the integration threshold — forced #R without local backing#!. Risky: the dependency may resist (.41). (When a #G local garrison#! stands on the spot, having it back the decree is far safer — the other option.)"
 qing_integ.40.e:0 "Force the decree with the local garrison standing behind it."
 qing_integ.40.e.tt:0 "Only when a #G banner garrison#! already stands in the dependency: the same #Y100#! gold and #Y20#! legitimacy as the raw decree, but a decree #G backed by visible troops on the ground#! is far likelier to be swallowed without a rising. A dominant garrison all but eliminates the risk; rough parity greatly reduces it. The saving is in #G risk#!, not treasury."
 qing_integ.40.c:0 "Have the resident amban prepare the ground, then decree."
 qing_integ.40.c.tt:0 "Only when a #G staunch resident amban#! sits in the dependency: he attempts to spend months smoothing the local elite — a #Y skill check#! on his charisma and finesse (25 + twice his charisma + his finesse, bounded 10–90%). Spend #Y80#! gold and #Y10#! legitimacy. #G [integ_amban.MakeScope.GetVariable('qing_amban_negotiate_chance_shown').GetValue|0]% on success#!: the decree is forced #G without provoking a rising#! and his standing rises. #R [integ_amban.MakeScope.GetVariable('qing_amban_negotiate_fail_shown').GetValue|0]% on failure#!: his groundwork falls flat — the decree still lands but draws the #R ordinary resistance roll#!, and he is discredited. (He is not executed — that is the mortal gamble of a rebel negotiation, not a decree.)"
 qing_integ.40.b:0 "Wait. Let the process mature naturally."
 qing_integ.40.b.tt:0 "The patient path: no cost, no risk, no acceleration."
 qing_integ.41.t:0 "巴塘起義: The Chieftain Resists"
 qing_integ.41.desc:0 "The incorporation decree has landed in [target.GetName] — and the native chieftain (土司 tusi) has refused it. His kinsmen have risen in armed defiance, echoing the 1905 Batang Uprising (巴塘起義) when Zhao Erfeng's coercive incorporation provoked the Gyalrong chieftains to revolt.\n\nThe precedent cuts both ways. Kangxi, after the Revolt of the Three Feudatories (三藩之亂, 1673-81), granted Wu Sangui's grandson a lesser title and left him in Yunnan rather than executing him outright — a conciliation that kept the peace. Qianlong, facing the second Jinchuan War (金川之戰, 1771-76), sent 60,000 troops and 70 million taels to crush the Gyalrong chieftains — a victory that drained the treasury and seeded resentment for generations.\n\nHow shall we respond?"
 # [#task-20 2026-08-04] actor-status addenda appended to the .41 desc when the local amban/garrison exist
 qing_integ.41.desc_actors_both:0 "\n\n#Y On the ground:#! the resident amban [integ_amban.GetName] is at his post in the rebel dependency, and a Beijing banner garrison stands on its soil — the throne can negotiate through the one or strike through the other."
 qing_integ.41.desc_actors_amban:0 "\n\n#Y On the ground:#! the resident amban [integ_amban.GetName] is at his post, though no imperial garrison stands near to compel the chieftain. Whether the amban can talk him down depends on how firmly he holds the throne's trust."
 qing_integ.41.desc_actors_garrison:0 "\n\n#Y On the ground:#! a Beijing banner garrison stands on the dependency's soil, ready to march — but with no resident amban, there is no-one on the spot to negotiate a settlement."
 qing_integ.41.desc_actors_none:0 "\n\n#Y On the ground:#! neither a resident amban nor an imperial garrison is at hand — the throne must answer this revolt from afar."
 qing_integ.41.a:0 "Conciliate: roll back the decree, restore autonomy."
 qing_integ.41.a.tt:0 "The Kangxi model: when pressed, give ground. Roll back integration progress by #Y2#! steps. Gain stability, lose prestige."
 qing_integ.41.b:0 "Crush: let the revolt become open war, and break it by arms."
 qing_integ.41.b.tt:0 "The Qianlong model. The defiance flares into an open #R war of independence#! — the dependency takes up arms against the throne (it remains your subject unless it wins), and you crush the rising by winning the war. A full field campaign, whether or not a garrison sits on the spot. Costs #R -5 Stability#! and #R -15 Legitimacy#!; gain tyranny and aggressive expansion; suffer war exhaustion and unrest. A #R wavering resident amban#! flees his post as the shooting starts (a further legitimacy toll). (When a strong garrison IS present, ordering it to march out — the other option — breaks the rising in the field far more cheaply, with no war at all.)"
 qing_integ.41.e:0 "Order the local garrison to march out and crush the rising."
 qing_integ.41.e.tt:0 "Only when a #G banner garrison strong enough to take the field#! already stands in the dependency (two garrisons, as at Yili, count together). The troops are #G already there#!, so the rising is broken #G in the field at once#! — no war to declare, no releasing the subject, and far less tyranny and aggressive expansion than a from-scratch expedition. Whether it is broken #G cleanly or chaotically#! turns on the #Y garrison commander's martial and zeal#! (a led garrison rolls 30 + twice his martial + his zeal, bounded 10–90%; a leaderless one falls back to its strength — a dominant edge crushes cleanly, rough parity chaotically): #G [Player.MakeScope.GetVariable('qing_garrison_clean_crush_shown').GetValue|0]% clean#! (#R -1 Stab, -3 Legitimacy#!, Ministry of War credited) vs #R [Player.MakeScope.GetVariable('qing_garrison_chaotic_crush_shown').GetValue|0]% chaotic#! (#R -3 Stab, -6 Legitimacy#!, more unrest, commander marked down). The subject is held; integration is not rolled back."
 qing_integ.41.c:0 "Co-opt: bribe the chieftain, marry into his family, grant titles."
 qing_integ.41.c.tt:0 "The Yongzheng rou yuan (柔遠) model: instead of force, co-opt the native elite via gold, prestige, and affinity. Spend #Y100#! gold. If both houses have eligible children, an #G imperial prince weds the chieftain's daughter#!, binding the families in blood."
 qing_integ.41.d:0 "Let the resident amban negotiate with the rebel chieftain."
 qing_integ.41.d.tt:0 "Only when a #G staunch resident amban#! sits in the dependency: he knows the chieftain and offers to talk him down — a #Y skill check#! on his charisma and finesse (25 + twice his charisma + his finesse, bounded 10–90%). This is a #R genuine gamble#!. #G [integ_amban.MakeScope.GetVariable('qing_amban_negotiate_chance_shown').GetValue|0]% on success#!: a modest rollback of integration, peace kept, his standing rises, and the Lifan Yuan is credited. #R [integ_amban.MakeScope.GetVariable('qing_amban_negotiate_fail_shown').GetValue|0]% on failure#!: the chieftain has him #R seized and executed#! — the revolt goes on, and you are returned to this same crisis #R without the amban option#! (you gambled him and lost him). A failed envoy is a heavy blow to the Court of Colonial Affairs."
 qing_integ_new_circuit_solemn:0 "Newly Incorporated Circuit (Solemn Rite)"
 qing_integ_new_circuit_solemn_desc:0 "A triumphal investiture has welcomed this newly absorbed territory into the realm. The pomp and ceremony have won the populace's goodwill, easing the administrative burden."
 qing_integ_new_circuit_bureaucratic:0 "Newly Incorporated Circuit (Bureaucratic)"
 qing_integ_new_circuit_bureaucratic_desc:0 "Surveyors, tax rolls, and circuit magistrates are working overtime to digest this newly absorbed territory. Efficient, but the bureaucracy is strained."
 qing_integ_new_circuit_coercive:0 "Newly Incorporated Circuit (Coercive)"
 qing_integ_new_circuit_coercive_desc:0 "The Green Standard Army garrison holds this newly absorbed territory down. Fast and cheap, but the frontier remembers the heavy hand."
 qing_integ_conciliation_granted:0 "Conciliation Granted to Frontier"
 qing_integ_conciliation_granted_desc:0 "The throne has rolled back its incorporation decree and restored autonomy to a resistant dependency. Face is lost, but peace is kept."
 qing_integ_coopted_chieftain:0 "Co-opted Chieftain"
 qing_integ_coopted_chieftain_desc:0 "This native chieftain has been co-opted via gold, titles, and marriage into the imperial network. His loyalty is personal, not institutional."
 qing_integ.40.a.resist.tt:0 "#R The dependency resists#! — the forced decree, without local backing, provokes a revolt (a resistance crisis follows)."
 qing_integ.40.a.accept.tt:0 "#G The decree is accepted#! — the incorporation lands without incident and the integration proceeds."
 qing_integ.40.e.resist.tt:0 "#R The dependency resists despite the garrison#! — even with troops on the spot, the decree provokes a revolt (a resistance crisis follows)."
 qing_integ.40.e.accept.tt:0 "#G The decree is accepted under the garrison's eye#! — the banner troops overawe the dependency and the incorporation proceeds."
 qing_integ.40.c.resist.tt:0 "#R The dependency resists#! — with the amban's groundwork failed, the decree draws the ordinary resistance crisis."
 qing_integ.40.c.accept.tt:0 "#G The decree is accepted#! — even without the amban's smoothing, the incorporation lands without revolt."
 qing_integ.42.t:0 "The Decree Is Accepted (改土歸流令行)"
 qing_integ.42.desc:0 "Word comes from [target.GetName] that the incorporation decree (改土歸流令) has been received without revolt. The circuit magistrate takes up his seal, the tax rolls are opened, and the old chieftain's writ gives way to the throne's. The Western Regions administrators note it with quiet satisfaction: the New Dominion is one step nearer a province like any other, and the absorption may now proceed."
 qing_integ.42.a:0 "The realm is served."
 qing_integ.43.t:0 "The Amban Brokers Peace (撫綏之功)"
 qing_integ.43.desc:0 "Word comes from [target.GetName] that our resident amban has prevailed. Where the decree provoked open resistance, [integ_amban.GetName] went among the chieftains, weighed threat against inducement, and talked the rising down — the settlement holds without a column marching. The Court of Colonial Affairs (理藩院) marks the service: this is the 撫綏 (conciliation) by which the frontier is meant to be governed, the throne's writ carried by a skilled hand rather than by the sword."
 qing_integ.43.a:0 "A servant worth his seal."
 qing_integ.44.t:0 "The Amban Is Executed (斬使之辱)"
 qing_integ.44.desc:0 "Grave news from [target.GetName]. Our resident amban, sent to treat with the rebellious chieftains, was seized and put to death — his head returned to the frontier post as a defiance to the throne. The negotiation is ruin, the rising stands, and the murder of an imperial envoy is an affront the Court cannot ignore. The Court of Colonial Affairs (理藩院) is disgraced by the loss; the crisis must now be settled by other means, and without the man who might have settled it."
 qing_integ.44.a:0 "His murder will be answered."
 qing_integ.45.t:0 "The Amban Restores Order (綏靖之效)"
 qing_integ.45.desc:0 "Word comes from [target.GetName] that our resident amban has settled the trouble. [integ_amban.GetName] went among the local elite, weighed grievance against inducement, and quieted the disturbance by persuasion alone — no troops marched, no blood was shed. The Court of Colonial Affairs (理藩院) marks the service: this is the patient conciliation (綏靖) by which a frontier is meant to be held, and his standing rises accordingly."
 qing_integ.45.a:0 "A servant worth his seal."
 qing_integ.46.t:0 "The Amban Is Discredited (失職之議)"
 qing_integ.46.desc:0 "Word comes from [target.GetName] that our resident amban has failed. [integ_amban.GetName] tried to talk the local elite round, but his appeal fell flat — the trouble ran its course despite him, and the court blames the man on the spot. He keeps his life and his post, but his prominence is diminished and the Court of Colonial Affairs (理藩院) is marked down for the failure. A frontier officer is only as useful as the trust he can command."
 qing_integ.46.a:0 "A note against his name."
 qing_integ.47.t:0 "The Garrison Prevails (雷霆之捷)"
 qing_integ.47.desc:0 "The banner garrison already posted in [target.GetName] has broken the rising where it stood. Under a capable hand the troops struck fast and clean — the chieftain's defiance was crushed in a single sharp action, with little disorder and no war to declare. The Ministry of War (兵部) notes the local commander's competence; the dependency is held, and the frontier learns the reach of the throne's arm."
 qing_integ.47.a:0 "Swiftly and well done."
 qing_integ.48.t:0 "A Costly Victory (慘勝之弊)"
 qing_integ.48.desc:0 "The banner garrison in [target.GetName] has put the rising down — but clumsily, and at a heavy price. Poorly led, the troops won only after wide destruction: villages burned, the countryside left sullen, and the ranks worn thin. The revolt is broken and the dependency held, but the Ministry of War (兵部) is marked down for the shambles, and the frontier's resentment will smoulder for years. A victory, but not one to be proud of."
 qing_integ.48.a:0 "Held — at a price."
