 # Military supplies >>>
 MILITARY_SUPPLIES_TT:0 "#T Military supplies#!\n[Player.GetName] gains #Y [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('MILITARY_supplies_income_country')|2]#! each quarter and consumes #R [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('MILITARY_supplies_country_consumed_quarterly_magnitude')|2]#! each quarter.\n\n#T Produced by good (quarterly, total output):#!\n  Munitions (early): #G [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('GOODS_national_production_early_munitions')|2]#!\n  Munitions (late): #G [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('GOODS_national_production_late_munitions')|2]#!\n  Artillery: #G [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('GOODS_national_production_early_artillery')|2]#!\n  Clothing: #G [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('GOODS_national_production_clothing')|2]#!\n  Pharmaceuticals: #G [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('GOODS_national_production_pharmaceuticals')|2]#!\n  Construction materials: #G [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('GOODS_national_production_construction_materials')|2]#!\n\n#T Supplied by good (quarterly, met demand):#!\n  Munitions (early): #Y [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('MILITARY_supplies_prod_early_munitions')|2]#!\n  Munitions (late): #Y [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('MILITARY_supplies_prod_late_munitions')|2]#!\n  Clothing: #Y [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('MILITARY_supplies_prod_clothing')|2]#!\n  Pharmaceuticals: #Y [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('MILITARY_supplies_prod_pharmaceuticals')|2]#!\n  Construction materials: #Y [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('MILITARY_supplies_prod_construction')|2]#!\n\n#T Consumption by good (quarterly):#!\n  Munitions (early): #R [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('MILITARY_supplies_country_early_munitions')|2]#!\n  Munitions (late): #R [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('MILITARY_supplies_country_late_munitions')|2]#!\n  Artillery: #R [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('MILITARY_supplies_country_early_artillery')|2]#!\n  Clothing: #R [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('MILITARY_supplies_country_clothing')|2]#!\n  Pharmaceuticals: #R [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('MILITARY_supplies_country_pharmaceuticals')|2]#!\n  Construction materials: #R [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('MILITARY_supplies_country_construction')|2]#!\n\nBy changing your military spending, you can buy less or more than the army consumes each quarter, however import shortages will always cause some loss in efficiency.\n\nWhen there are 0 supplies left in the national stockpile, armies will suffer a morale malus and forts will suffer a defensiveness malus.\n\n#TF Military supplies include munitions, clothing, pharmaceuticals and construction supplies which your armies use to operate in both peace and war.#!"

