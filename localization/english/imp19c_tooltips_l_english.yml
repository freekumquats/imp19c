 # Qing buildings >>>
 # [#42] yamen tooltip lives at the top of this file (Fortress-style hand-written Results/Other Results
 # form); the stale flavor-only duplicate that used to sit here was removed (duplicate loc keys clobber).
 # All buildings below follow the same Fortress spec: #T Results:#! (vanilla modifiers, hand-written with
 # icons/values), #T Other Results:#! (non-vanilla effects — admin capacity, production hooks — or None),
