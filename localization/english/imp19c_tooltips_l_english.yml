 tooltip_depot:0 "#T Results:#!\n#G +1#! local building slot\n#G +5%#! proletariat desired share\n\n#T Other Results:#!\n#Y [GuiScope.SetRoot(Player.MakeScope.GetVariable('selected_province').GetProvince.MakeScope).ScriptValue('num_of_INF_depot_svalue')|0]#! depots in [Player.MakeScope.GetVariable('selected_province').GetProvince.GetName] supporting up to [GuiScope.SetRoot(Player.MakeScope.GetVariable('selected_province').GetProvince.MakeScope).ScriptValue('JOBS_building_cap_limit_from_depots')|0] buildings.\n\nEach new depot will increase the cap by #G [GuiScope.SetRoot(Player.MakeScope.GetVariable('selected_province').GetProvince.MakeScope).ScriptValue('JOBS_building_cap_per_depot')|0]#! up to a maximum of [GuiScope.SetRoot(Player.MakeScope.GetVariable('selected_province').GetProvince.MakeScope).ScriptValue('JOBS_building_cap_unmaxed_by_depots')|0] from pops.\n#Y Industrialisation#! modifies building cap from pops by #G +[GuiScope.SetRoot(Player.MakeScope.GetVariable('selected_province').GetProvince.MakeScope).ScriptValue('province_industrialisation_percent')|%0]#! bonus to this cap.\n\n$edu_required$$edu_t1_used$INF_depot$edu_used_end$ $edu_t1_req$INF_depot$edu_req_end$ \n$edu_t2_used$INF_depot$edu_used_end$ $edu_t2_req$INF_depot$edu_req_end$\n"

