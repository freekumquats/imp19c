 # ====================================================================
 # THE MANILA GALLEON & THE MEXICAN ADVENTURE (馬尼拉大帆船 / 墨西哥).
 # #27, lifted out of qing_colonization_l_english.yml (2026-08-02, see
 # design/DESIGN_COLONIZATION_SPLIT.md §C). Mission front for the Mexican-
 # empire arc in se_QING_MEXICO.txt / design/DESIGN_MEXICO.md.
 # ====================================================================

 # --- mission-group title (new tree, split 2026-08-02) ---------------
 qing_mexico_mission:0 "The Manila Galleon & the Mexican Adventure (馬尼拉大帆船 / 墨西哥)"
 qing_mexico_mission_DESCRIPTION:0 "For two and a half centuries the Manila galleon crossed the Pacific each year — Mexican silver west to Canton, Chinese silk east to Acapulco — the one steady thread binding the Middle Kingdom to the New World. The Spanish crown cut the line in 1815. Let the dragon fleet take up the route the galleons abandoned, follow the silver home to its source, and insert itself into the great American contest over the throne of Mexico."
 qing_mexico_mission_CRITERIA_DESCRIPTION:0 "This enterprise is complete when the silver road is reopened and a throne in Mexico wears the dragon's protection."
 qing_mexico_mission_REWARD_DESCRIPTION:0 "Completing every objective in this tree grants its capstone reward."
 qing_mexico_mission_BUTTON_TOOLTIP:0 "Open this mission tree."

 # ##################################################################
 # 墨西哥 THE MEXICAN ADVENTURE — the Manila galleon & the throne of Mexico
 # ##################################################################
 # --- allow-tooltips ------------------------------------------------
 qing_col_needs_pacific_reach_tt:0 "You need #Y a modern battle-fleet (the Beiyang or Nanyang squadron) or a foothold in California#! before you can reach across the Pacific to the New World"
 qing_col_needs_acapulco_tt:0 "You must #Y hold Acapulco or have re-opened the silver road#! before pressing on to the Gulf coast of Mexico"
 qing_col_needs_mexico_land_tt:0 "You must own at least #Y 3 provinces in Mexico#! (Pacific Mexico incl. Mexico City, Eastern Mexico, Northern Mexico or Central America) to enthrone a client emperor"

 # --- 馬尼拉大帆船 — the galleon reborn -----------------------------
 qing_col_galleon:0 "Reopen the Silver Road (馬尼拉大帆船)"
 qing_col_galleon_DESC:0 "For two hundred and fifty years the Manila galleon crossed the Pacific each year — Mexican silver west to Canton, Chinese silk and porcelain east to Acapulco — the one steady thread binding the Middle Kingdom to the New World, and the pump that drew half the silver of the Americas into China. The Spanish crown cut the line in 1815, the very year of our reckoning. Let the dragon fleet take up the route the galleons abandoned, and follow the silver home to its source."
 qing_col_galleon_tt:0 "Reopen the #Y Manila-Acapulco silver road#!. #G Claim Acapulco and draw settlers to it; a Silver Road modifier (export/import commerce, naval range); a wealth grant#!. #R Nettles Britain#! (unless the Daoguang entente holds), master of the world's trade."

 # --- 韋拉克魯斯 — the Gulf foothold --------------------------------
 qing_col_veracruz:0 "Land at Veracruz (韋拉克魯斯)"
 qing_col_veracruz_DESC:0 "Veracruz — the fever-coast port where Cortés burned his ships, and where in 1862 a French army landed to begin its Mexican adventure. From the Pacific shore the enterprise reaches across to the Gulf, and sets its foot upon the door to the Mexican interior: the same door, and the same year's contest, that France itself covets."
 qing_col_veracruz_tt:0 "Seize the Gulf gate at #Y Veracruz#!, the French landing point of 1862. #G Claim it and open a diplomatic play for it against France; a Gulf-Gate modifier; a wealth grant#!. #R Affronts France#!, whose own Mexican adventure contests the same ground."

 # --- 墨西哥帝業 — the Mexican adventure (the fork) -----------------
 qing_col_maximilian:0 "The Mexican Adventure (墨西哥帝業)"
 qing_col_maximilian_DESC:0 "In our history it was Louis-Napoleon's Second Empire that, screened by the American war between the states, shipped the Habsburg archduke Maximilian across the ocean and crowned him Emperor of Mexico (1864). Here that gambit is ours to share or to seize. Should the Emperor Emeritus grace our court, we make common cause with his nephew's France, and together prop the throne against the republicans and the affronted Americans. Should he not, the dragon plays the game alone — and plants its crown over the head of the France that would deny it."
 qing_col_maximilian_tt:0 "Contest the #Y throne of Mexico#!. #G Claim Mexico City; a Mexican-Crown modifier; a wealth grant#!.\n#Y If the Emperor Emeritus (Napoleon) is at court#!: a #G Franco-Qing condominium#! — warm relations with France and Napoleon's gratitude, but it #R provokes Britain#!.\n#Y Otherwise#!: the Qing seizes the adventure alone, which #R provokes France#!.\nEither way, enthroning a monarch in the Americas #R betrays the Daoguang entente#! and affronts the United States."

 # --- 墨西哥帝國 — the client Empire of Mexico ----------------------
 qing_col_mexican_empire:0 "The Empire of Mexico (墨西哥帝國)"
 qing_col_mexican_empire_DESC:0 "Gather all of Mexico — the Pacific coast and its capital of Mexico City, the Gulf shore, the northern deserts, the isthmus of Central America — and raise it up as a client Empire, an imperial throne bound to the Son of Heaven as his most distant tributary. A Habsburg-styled monarchy on the far side of the world, seated in the ancient valley of Anáhuac and wearing the dragon's protection. (The leaner Pacified New World march, Anxin, keeps to the fur coast and California, north of the mountains.)"
 qing_col_mexican_empire_tt:0 "Raise Mexico into a client #Y Empire of Mexico#! — released as an #G imperial-monarchy tributary#! seated at Mexico City (Pacific, Eastern and Northern Mexico, and Central America). Gain the #G Empire of Mexico#! modifier (export commerce, legitimacy, land morale)."

 # --- client-empire country name / adjective ------------------------
 qing_protectorate_mexico_name:0 "Mexico (墨西哥帝國)"
 qing_protectorate_mexico_adj:0 "Mexican"

 # --- Mexican reward-modifier display names -------------------------
 qing_col_silver_road:0 "The Silver Road (馬尼拉大帆船)"
 qing_col_gulf_gate:0 "The Gulf Gate (韋拉克魯斯)"
 qing_col_mexican_crown:0 "The Crown of Mexico (墨西哥帝冕)"
 qing_col_mexican_empire_mod:0 "Empire of Mexico (墨西哥帝國)"

 # ##################################################################
 # [#41] THE SILVER SYSTEM (白銀之路) — the expanded galleon enterprise.
 # ##################################################################
 # --- allow-tooltips ------------------------------------------------
 qing_mx_needs_silver_road_tt:0 "You must have #Y reopened the silver road#! (the Manila-Acapulco trade) before seizing the mines that feed it"
 qing_mx_needs_silver_dominion_tt:0 "You must own at least #Y 4 provinces#! across the Spanish silver system (Peru, Upper Peru, Chile, the Isthmus, Cuba, Colombia, the Philippines or northern Mexico) to proclaim the Silver Dominion"

 # --- 新西班牙銀礦 — the mines of New Spain --------------------------
 qing_mx_new_spain_silver:0 "The Mines of New Spain (新西班牙銀礦)"
 qing_mx_new_spain_silver_DESC:0 "Zacatecas, Guanajuato, the Bajío — the great silver lodes of New Spain, whose ore was struck into the pieces of eight that circled the globe and pooled at last in the treasuries of Canton. Seize the mines, and you seize the silver road at its very source."
 qing_mx_new_spain_silver_tt:0 "Take the #Y silver mines of New Spain#!. #G Claim Zacatecas and San Luis Potosí; a Mexican-Silver modifier (tax, commerce); a wealth grant#!. #R Nettles Britain#!."
 # --- 馬尼拉 — the galleon's western terminus ------------------------
 qing_mx_manila:0 "Seize Manila (馬尼拉)"
 qing_mx_manila_DESC:0 "Manila — the galleon's far western anchor, and the seat of the Parián, the walled quarter where thousands of Chinese merchants (the Sangley) handled the silver-for-silk exchange that was the trade's whole purpose. Take the city, and the western end of the silver road is the dragon's own."
 qing_mx_manila_tt:0 "Seize #Y Manila#!, the galleon's western terminus and its Chinese Parián. #G Claim it and open a diplomatic play for it against Spain; draw settlers; a Galleon-Terminus modifier (export/import commerce, naval range); a wealth grant#!. #R Nettles Britain#!."
 # --- 未獅耶 — the Visayas ------------------------------------------
 qing_mx_visayas:0 "The Visayas (未獅耶)"
 qing_mx_visayas_DESC:0 "Cebu, where Magellan fell and Legazpi first planted the Spanish flag in 1565, and Iloilo of the sugar coast — the central islands that are the heart of the archipelago. Holding them binds the Philippines to the enterprise."
 qing_mx_visayas_tt:0 "Take the #Y central Philippine islands#!. #G Claim Cebu and Iloilo; a Visayas modifier (commerce, naval morale); a wealth grant#!."
 # --- 蘇祿海 — the Sulu Sea ------------------------------------------
 qing_mx_sulu:0 "The Sulu Sea (蘇祿海)"
 qing_mx_sulu_DESC:0 "Zamboanga and the Moro coast of Mindanao — the pearl-fisheries and raiding sea at the archipelago's southern edge, which the Spanish garrisoned but never truly subdued. The frontier of the island world."
 qing_mx_sulu_tt:0 "Secure the #Y Sulu Sea and the Moro coast#!. #G Claim Zamboanga; a Sulu modifier (naval range, export commerce); a wealth grant#!."
 # --- 巴拿馬地峽 — the Isthmus ---------------------------------------
 qing_mx_isthmus:0 "The Isthmus of Panama (巴拿馬地峽)"
 qing_mx_isthmus_DESC:0 "Panama and the fairs of Portobelo — the narrow waist of the two Americas, where the silver of the South Sea was hauled overland to meet the Caribbean plate fleets. Whoever holds the isthmus holds the hinge of the whole silver system."
 qing_mx_isthmus_tt:0 "Seize the #Y crossing of Panama#!. #G Claim the isthmus and open a diplomatic play for it against Spain; an Isthmus modifier (import/export commerce, naval range); a wealth grant#!. #R Nettles Britain#!."
 # --- 秘魯 — Peru ---------------------------------------------------
 qing_mx_peru:0 "The Viceroyalty of Peru (秘魯)"
 qing_mx_peru_DESC:0 "Lima, the City of Kings, and its port of Callao — seat of the southern viceroyalty and the chief Spanish harbour on the Pacific, through which the silver of Potosí sailed north to Panama. The pivot of the South-Sea trade."
 qing_mx_peru_tt:0 "Take #Y Lima and Callao#!, the southern viceregal capital. #G Claim it and open a diplomatic play for it against Spain; draw settlers; a Peru modifier (commerce, tax); a wealth grant#!. #R Nettles Britain#!."
 # --- 波托西 — Potosí -----------------------------------------------
 qing_mx_potosi:0 "The Cerro Rico of Potosí (波托西)"
 qing_mx_potosi_DESC:0 "The silver mountain itself: the Cerro Rico towering over Potosí, richest strike in the history of the world, whose ore bankrolled the Spanish empire for two centuries and glutted the markets of Ming and Qing China with silver. To hold Potosí is to hold the fountainhead of the age's money."
 qing_mx_potosi_tt:0 "Seize the #Y silver mountain of Potosí#!. #G Claim the Cerro Rico and open a diplomatic play for it against Spain; a Potosí modifier (heavy tax, commerce); a large wealth grant and prestige#!. #R Nettles Britain#!."
 # --- 瓜亞基爾 — Guayaquil -------------------------------------------
 qing_mx_guayaquil:0 "Guayaquil (瓜亞基爾)"
 qing_mx_guayaquil_DESC:0 "The great shipyard of the Spanish Pacific, where the timber of the Ecuadorian coast built the galleons and guarda-costas of the South Sea, and the cacao coast that fed the chocolate trade. A waystation midway between Panama and Lima."
 qing_mx_guayaquil_tt:0 "Take the #Y shipyard-coast of Guayaquil#!. #G Claim it; a Guayaquil modifier (commerce, ship-recruitment speed); a wealth grant#!."
 # --- 智利 — Chile --------------------------------------------------
 qing_mx_chile:0 "Chile (智利)"
 qing_mx_chile_DESC:0 "Valparaíso and the Central Valley beyond the Atacama — the southern terminus of the Pacific coast, the wine-country and granary that provisioned the ports of the viceroyalty. The far end of the silver shore."
 qing_mx_chile_tt:0 "Plant a foothold in #Y Chile#!. #G Claim Valparaíso and draw settlers; a Chile modifier (commerce, tax); a wealth grant#!."
 # --- 哈瓦那 — Havana -----------------------------------------------
 qing_mx_havana:0 "Havana (哈瓦那)"
 qing_mx_havana_DESC:0 "The key of the New World: Havana, where the treasure fleets of both the mainland and the Main gathered each year under convoy for the guarded run across the Atlantic to Cádiz. Britain stormed and held it in 1762, and gave it back at the peace of 1763 — a prize the dragon need not return."
 qing_mx_havana_tt:0 "Seize #Y Havana#!, the Caribbean muster of the plate fleets. #G Claim it and open a diplomatic play for it against Spain; draw settlers; a Havana modifier (naval morale, commerce); a wealth grant#!. #R Nettles Britain#!."
 # --- 卡塔赫納 — Cartagena de Indias ---------------------------------
 qing_mx_cartagena:0 "Cartagena de Indias (卡塔赫納)"
 qing_mx_cartagena_DESC:0 "The fortress-port of the Spanish Main, muster of the Tierra Firme fleet, whose great walls and harbour forts beat back Admiral Vernon's vast armada in 1741. To take Cartagena is to hold the Caribbean shoulder of the silver system."
 qing_mx_cartagena_tt:0 "Take the #Y fortress-port of Cartagena#!. #G Claim it and open a diplomatic play for it against Spain; a Cartagena modifier (export commerce, defensive); a wealth grant#!. #R Nettles Britain#!."
 # --- 白銀帝國 — the Silver Dominion capstone -----------------------
 qing_mx_silver_capstone:0 "The Silver Dominion (白銀帝國)"
 qing_mx_silver_capstone_DESC:0 "From the mines of Zacatecas and the Cerro Rico of Potosí, through the crossing of Panama and the walls of Havana and Cartagena, to the wharves of Lima and the Parián of Manila — the whole world-girdling silver machine of the Spanish empire, gathered link by link under the dragon banner. The galleon reborn has run its course: the silver of the world flows now to Canton."
 qing_mx_silver_capstone_tt:0 "Proclaim the #Y Silver Dominion#! — the whole Spanish-Pacific bullion system under the dragon. #G Gain the Silver Dominion modifier (export/import commerce, tax, naval range, legitimacy), a burst of prestige, and stability#!."

 # --- [#41] Silver-system reward-modifier display names (keys match the
 # modifier DEFINITIONS in qing_colonization_modifiers.txt; distinct from the
 # task-title keys above so no yml key is defined twice). ------------
 qing_mx_mexican_silver:0 "The Mines of New Spain (新西班牙銀礦)"
 qing_mx_manila_galleon:0 "The Galleon Terminus (馬尼拉)"
 qing_mx_visayas_coast:0 "The Visayas (未獅耶)"
 qing_mx_sulu_sea:0 "The Sulu Sea (蘇祿海)"
 qing_mx_isthmus_crossing:0 "The Isthmus (巴拿馬地峽)"
 qing_mx_peru_viceroyalty:0 "The Viceroyalty of Peru (秘魯)"
 qing_mx_cerro_rico:0 "The Cerro Rico (波托西)"
 qing_mx_guayaquil_yard:0 "Guayaquil (瓜亞基爾)"
 qing_mx_chile_valley:0 "Chile (智利)"
 qing_mx_havana_key:0 "Havana (哈瓦那)"
 qing_mx_cartagena_fort:0 "Cartagena de Indias (卡塔赫納)"
 qing_mx_silver_dominion:0 "The Silver Dominion (白銀帝國)"

 # --- [#96] consumer event: the Qing reacts to the Mexico arc's Second Empire ---
 # Fired by mex_instability.12 (human CHI only) once MEX_install_empire has crowned
 # Maximilian and set global_var:mex_empire_country. The AI Qing expresses its
 # stance through the #69 mission tree, not this pop-up.
 qing_mexico_adventure.1.t:0 "The Throne Across the Ocean (墨西哥帝業)"
 qing_mexico_adventure.1.desc:0 "Word crosses the Pacific: screened by the great war between the American states, Louis-Napoleon's France has shipped a Habsburg archduke across the ocean and crowned him Emperor of Mexico. A European throne now stands in the valley of Anáhuac, upheld by French bayonets — and shadowed, as every throne in the Americas must be, by the republic to the north and by the Juarista bands that have not laid down their arms. The Middle Kingdom has reached the far shore; the enterprise is ours to make our own. We may prop this throne — bind it to us, uphold it against the day Washington and the Republic come to pull it down — or we may throw in with Juárez and wager on its fall."
 qing_mexico_adventure.1.a:0 "Prop the throne — a Franco-Qing patronage."
 qing_mexico_adventure.1.a.tt:0 "Become the Second Empire's #Y foreign patron#!. #G Set the patronage that keeps the Empire standing past the day France abandons it (the throne survives its historical fall); warm relations with Mexico City; a wealth grant and prestige#!. #R Provokes Britain#!, and — if the Daoguang entente was sealed — #R betrays it and affronts the United States#!.\n#R Reform Pressure: +4#!"
 qing_mexico_adventure.1.b:0 "Back Juárez — bet on the Republic."
 qing_mexico_adventure.1.b.tt:0 "Court the #Y Juarista Republic#! instead. #G A commercial windfall and prestige; the American republic that backs Juárez is pleased#!. #R Affronts France#!, whose throne this repudiates. The Empire is left to fall on its own schedule.\n#G Reform Pressure: -2#!"
