l_english:
 QING_AMBAN_MANAGE_POST_TT:0 "#T Post an Amban (駐紮大臣)#!\nDispatch a resident commissioner to oversee this Inner Asian dependency on the throne's behalf. Managing this post by hand removes it from the automatic Lifan Yuan rotation — the resident will not be recalled or replaced without your order.\nCost: 25 political influence. Requires the Lifan Yuan office to be filled."
 QING_AMBAN_MANAGE_RECALL_TT:0 "#T Recall the Amban#!\nWithdraw the resident from this dependency, leaving the post vacant. It will remain unattended until you post a new man or return the dependency to automatic management.\nCost: #R 10 political influence#! and #R 1 tyranny#! (direct intervention in the frontier bureaucracy).\n#I Greyed out when you hold under 10 political influence, or no living resident is posted here.#!"
 QING_AMBAN_MANAGE_REPLACE_TT:0 "#T Replace the Amban#!\nRecall the sitting resident and dispatch a fresh one in a single stroke — the court draws the ablest available banner-examination graduate automatically.\nCost: #R 25 political influence#! and #R 2 tyranny#! (replacing a sitting official is a heavier intervention than filling a vacancy).\n#I Greyed out when you hold under 25 political influence, or the Lifan Yuan (理藩院) office is unfilled. There is no cooldown.#!"
 QING_AMBAN_MANAGE_RETURN_AUTO_TT:0 "#T Return to Automatic Management#!\nHand this post back to the quarterly Lifan Yuan rotation. If it is vacant the court will staff it in time; if occupied, the ordinary turnover of residents resumes."
 qing_amban_needs_lifanyuan_tt:0 "The Lifan Yuan (理藩院) office must be filled to dispatch a resident"
 qing_amban_needs_influence_25_tt:0 "Requires 25 political influence"
 QING_AMBAN_PICKER_HEADER:0 "Post an Amban (簡放駐臣)"
 QING_AMBAN_PICKER_INSTR:0 "Eligible residents, ablest first — the banner-examination graduates (繙譯進士) the court can spare. #I Click a name to post him to the dependency;#! the window then closes. Costs 25 political influence. The ruler, heir, serving commanders, governors, and men already holding a court post are not offered."
 QING_AMBAN_NO_CANDIDATES:0 "#I No eligible resident at present. Every able banner graduate already holds a post — appoint an examination laureate or wait for the next cohort before posting a new amban.#!"
 QING_AMBAN_APPOINT_ROW_TT:0 "#Y Click this row#! to post this man as resident amban to the dependency (#R 25 political influence#!). Managing the post by hand freezes the automatic Lifan Yuan rotation for it."
 qing_amban_recall_valid_tt:0 "A living resident must be posted here"
 qing_amban_recall_needs_influence_10_tt:0 "Requires 10 political influence"
