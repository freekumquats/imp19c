 qing_nanyang_pepper_tt:0 "A #Y claim#! is laid on #Y Palembang#!, the pepper-and-tin sultanate of Sumatra."
 qing_nanyang_secret_societies:0 "The Overseas Brotherhoods (天地會)"
 qing_nanyang_secret_societies_DESC:0 "Turn the overseas brotherhoods to the throne's cause abroad. Costs #Y 20#! political influence."
 qing_nanyang_secret_societies_tt:0 "The overseas brotherhoods are turned to the throne's cause. Gain the #G Overseas Brotherhoods#! modifier (political influence, legitimacy)."
 qing_nanyang_consuls:0 "The South Seas Consuls (南洋領事)"
 qing_nanyang_consuls_DESC:0 "Appoint consuls to protect the diaspora among the western colonies. Costs #Y 25#! political influence."
 qing_nanyang_consuls_tt:0 "Consuls are appointed to protect the diaspora. Gain the #G South Seas Consuls#! modifier (reputation, political influence)."
 qing_nanyang_fleet:0 "The South Seas Squadron (南洋巡師)"
 qing_nanyang_fleet_DESC:0 "Station a South Seas squadron to show the flag among the islands. Costs #Y 70#! treasury."
 qing_nanyang_fleet_tt:0 "A real #Y South Seas Squadron#! (5 war-junks) is raised at #Y Haikou#! (Hainan)."
