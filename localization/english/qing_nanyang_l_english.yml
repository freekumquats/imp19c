 qing_nanyang_tin_tt:0 "A #Y claim#! is laid on #Y Taiping (the Larut tin belt)#!; a held Larut is turned to #G tin#!."
 qing_nanyang_pepper:0 "The Pepper Trade (胡椒貿易)"
