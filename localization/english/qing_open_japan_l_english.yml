l_english:
 # ####################################################################
 # [#447] Open the Closed Country (叩關破鎖國) — the anachronistic Qing
 # naval opening of Sakoku Japan, gated on the New Treasure Fleet (#439).
 # See common/missions/qing_open_japan_missions.txt,
 # common/scripted_effects/se_QING_OPEN_JAPAN.txt,
 # common/modifiers/qing_open_japan_modifiers.txt.
 # ####################################################################

 qing_open_japan_mission:0 "Open the Closed Country (叩關破鎖國)"
 qing_open_japan_mission_DESCRIPTION:0 "For a century and a half the Tokugawa Shogunate has kept Japan sealed behind the Sakoku edicts — one window at Nagasaki, the coast forbidden to foreign hulls on pain of death. But the treasure fleet has sailed to the Western Ocean and returned, and the Qing command the sea once more. Sail into the closed isles and force them open — a full century before the black ships of the West would have done it. Force the southern gate through Kyushu and drive on Edo, or reach past the shogun to the Ainu of the north; break the isolation of the Chrysanthemum court on the Dragon Throne's terms."
 qing_open_japan_mission_CRITERIA_DESCRIPTION:0 "This enterprise is complete when the treasure fleet has forced open the closed ports of the Tokugawa and Japan is opened a century early."
 qing_open_japan_mission_REWARD_DESCRIPTION:0 "Completing every objective in this tree grants its capstone reward."
 qing_open_japan_mission_BUTTON_TOOLTIP:0 "Open this mission tree."

 qing_openjapan_arrive:0 "The Fleet Arrives (寶船抵日)"
 qing_openjapan_arrive_DESC:0 "Let the great fleet stand off the closed coast and the court present its demand: the isles will open. The shogunate will stiffen, but the treasure-ships that dwarf its coastal junks bear their pressure on the seaward domains. This is the point of commitment. Costs #Y 120#! treasury and #Y 30#! political influence."
 qing_openjapan_arrive_tt:0 "Open the enterprise: the fleet's presence lays #G coastal pressure (海壓)#! on the shogunate's ports, and the court takes heart (#G ruler popularity#!)."

 qing_openjapan_kyushu:0 "The Southern Gate (南路叩關)"
 qing_openjapan_kyushu_DESC:0 "Force the one window the shogunate keeps on the world. Take and hold Kyushu — the Nagasaki approach through which the whole Sakoku trade was funnelled. You must seize the ground yourself; the mission recognises the gate once it is genuinely held."
 qing_openjapan_needs_kyushu_tt:0 "The Qing must #Y control at least one province in the Kyushu region#! (九州)."
 qing_openjapan_kyushu_tt:0 "The southern gate is held — a #G claim is laid on the shogun's seat at Edo (江戶)#! so the drive on the heartland has its war-goal, and the court exults (#G ruler popularity#!)."

 qing_openjapan_edo:0 "The March on Edo (進逼江戶)"
 qing_openjapan_edo_DESC:0 "Drive into the Kanto heartland and take the shogun's seat — Edo itself. With the capital held, the Bakufu's will to keep the country closed is broken. Costs #Y 80#! treasury."
 qing_openjapan_needs_edo_tt:0 "The Qing must #Y control Edo (江戶, province 3684)#! — the shogun's seat."
 qing_openjapan_edo_tt:0 "Edo falls. A #G claim on the shogun's seat#! is confirmed if it is not yet Qing soil, the realm steadies (#G stability#!) and the court rejoices (#G ruler popularity#!)."

 qing_openjapan_ainu:0 "The Ainu Road (撫蝦夷)"
 qing_openjapan_ainu_DESC:0 "Reach past the shogunate to the Ainu of Ezo, whom the Matsumae clan has been grinding north for two centuries. Take them under the Qing wing — a foothold at Japan's back, and a lever against the Chrysanthemum court from the north. Costs #Y 25#! political influence."
 qing_openjapan_needs_ainu_tt:0 "The #Y Ainu (蝦夷) must exist#! on the map to be reached."
 qing_openjapan_ainu_tt:0 "The Ainu are taken under the wing as a #G sinosphere tributary#! — a Qing foothold in the north — and the court takes heart (#G ruler popularity#!)."

 qing_openjapan_ezo:0 "Hold Ezo (據蝦夷地)"
 qing_openjapan_ezo_DESC:0 "Secure Hokkaido. Take and hold the ground of Ezo — whether under the Qing flag directly or through the Ainu tributary — so the Matsumae window closes and Japan is hemmed from the north."
 qing_openjapan_needs_ezo_tt:0 "The #Y Ezo region (蝦夷地 / Hokkaido) must be held#! — by the Qing directly, or by the Ainu tributary."
 qing_openjapan_ezo_tt:0 "Ezo is secured — Japan is hemmed from the north (#G ruler popularity#!)."

 qing_openjapan_capstone:0 "The Country Opened (開國)"
 qing_openjapan_capstone_DESC:0 "Both gates carried: the southern one forced at Edo and the northern one shut on the shogunate through Ezo. The Sakoku is ended — a full century before the West would have done it — and Japan is opened on the Dragon Throne's terms."
 qing_openjapan_needs_opened_tt:0 "The Qing must #Y hold Edo (3684)#! AND #Y hold Ezo#! (directly or through the Ainu tributary)."
 qing_openjapan_capstone_tt:0 "The closed country is opened. The lasting #G The Country Opened (qing_japan_opened)#! is sealed — diplomatic weight, a maritime-commerce dividend, legitimacy and naval morale — the realm steadies (#G stability#!), the fleet's #G coastal pressure lifts#!, and the emperor's glory rings across the eastern sea (#G ruler popularity#!)."

 # ---- modifiers ----
 qing_japan_coastal_pressure:0 "Coastal Pressure (海壓)"
 qing_japan_coastal_pressure_desc:0 "The Qing treasure fleet stands off this port, throttling its trade and sapping the defenders' will. Lifts on its own as the fleet moves on."
 qing_japan_opened:0 "The Country Opened (開國)"
 qing_japan_opened_desc:0 "The Sakoku ended a century early — Japan opened to the Qing by the northern and southern gates alike. A lasting dividend of diplomatic weight, reopened maritime commerce, and naval prestige."

# --- mission tree expansion (>=10 tasks) ---
 qing_openjapan_nagasaki_tt:0 "We force open the closed port of Nagasaki beyond the Dutch factory: #G a claim is laid on Nagasaki (長崎)#! and #G development capital#! flows from the newly-opened trade."
 qing_openjapan_shogun_tt:0 "The bakufu is compelled to receive our envoy on the throne's terms: the humiliation costs Tokugawa #R goodwill (resentment)#! and #R -1 stability#!."
 qing_openjapan_ryukyu_tt:0 "We press the Qing claim to Ryukyu against Satsuma: #G a claim is laid on Naha (那霸)#!, and #R Satsuma resents the challenge#! to its suzerainty."
 qing_openjapan_treaty_ports_tt:0 "A chain of treaty ports opens along the Japanese coast: #G claims are laid on Yokohama, Hakodate and Niigata#!."

# --- task titles + descriptions (mission-tree display) ---
 qing_openjapan_nagasaki:0 "The Nagasaki Trade (長崎通商)"
 qing_openjapan_nagasaki_DESC:0 "Force open the closed port of Nagasaki beyond the Dutch factory. Costs #Y 70#! treasury."
 qing_openjapan_shogun:0 "The Shogun's Submission (迫幕府)"
 qing_openjapan_shogun_DESC:0 "Compel the bakufu to receive the imperial envoy on the throne's terms. Costs #Y 30#! political influence."
 qing_openjapan_ryukyu:0 "The Ryukyu Question (爭琉球)"
 qing_openjapan_ryukyu_DESC:0 "Press the Qing claim to the Ryukyu kingdom against Satsuma. Costs #Y 25#! political influence."
 qing_openjapan_treaty_ports:0 "The Treaty Ports (開埠通商)"
 qing_openjapan_treaty_ports_DESC:0 "Open a chain of treaty ports along the Japanese coast. Costs #Y 80#! treasury."

 qing_openjapan_satsuma:0 "The Satsuma Domain (薩摩)"
 qing_openjapan_satsuma_DESC:0 "Treat with Satsuma, the great southern domain of Kyushu. Costs #Y 25#! political influence."
 qing_openjapan_satsuma_tt:0 "Satsuma of the south receives the treasure fleet's envoys: #G mutual goodwill with Satsuma#!."
 qing_openjapan_choshu:0 "The Choshu Domain (長州)"
 qing_openjapan_choshu_DESC:0 "Reach Choshu, keeper of the western strait. Costs #Y 25#! political influence."
 qing_openjapan_choshu_tt:0 "Choshu of the western strait inclines to the fleet: #G mutual goodwill with Choshu#!."
 qing_openjapan_osaka:0 "The Merchant City of Osaka (大阪)"
 qing_openjapan_osaka_DESC:0 "Open the merchant city of Osaka, kitchen of the realm. Costs #Y 55#! treasury."
 qing_openjapan_osaka_tt:0 "The merchant city of Osaka is opened to trade: #G a claim is laid on Osaka#! and #G development capital#! flows from its markets."
 qing_openjapan_kyoto:0 "The Court at Kyoto (京都朝廷)"
 qing_openjapan_kyoto_DESC:0 "Send an embassy to the imperial court at Kyoto. Costs #Y 25#! political influence."
 qing_openjapan_kyoto_tt:0 "An embassy reaches the imperial court at Kyoto: recognition at the throne's fountainhead steadies the realm (#G +1 Stability#!)."
 qing_openjapan_silver:0 "The Iwami Silver (石見銀山)"
 qing_openjapan_silver_DESC:0 "Open the Iwami silver mines to the trade of the fleet. Costs #Y 60#! treasury."
 qing_openjapan_silver_tt:0 "The Iwami silver mines feed the fleet's trade: #G a claim is laid on the Iwami silver country (Izumo)#! and #G development capital#! surges from the silver."
 qing_openjapan_sakai:0 "The Port of Sakai (堺港)"
 qing_openjapan_sakai_DESC:0 "Charter the free port of Sakai for the treasure trade. Costs #Y 55#! treasury."
 qing_openjapan_sakai_tt:0 "The free port of Sakai is chartered for the trade: #G a claim is laid on the Sakai/Hyogo littoral (Kobe)#! and #G development capital#! flows from the charter."
 qing_openjapan_daimyo:0 "Ally the Daimyo (大名結盟)"
 qing_openjapan_daimyo_DESC:0 "Bind the coastal daimyo to the fleet with gifts and treaties. Costs #Y 25#! political influence."
 qing_openjapan_daimyo_tt:0 "The coastal daimyo — Satsuma, Choshu, Date, Nambu and Maeda — are bound to the fleet: #G mutual goodwill with each existing domain#!."
 qing_openjapan_buddhism:0 "The Zen Exchange (禪宗交流)"
 qing_openjapan_buddhism_DESC:0 "Renew the Zen Buddhist exchange between the two lands. Costs #Y 20#! political influence."
 qing_openjapan_buddhism_tt:0 "The Zen Buddhist exchange between the lands is renewed: the realm is calmed (#G +1 Stability#!)."
 qing_openjapan_swords:0 "The Sword Trade (日本刀貿)"
 qing_openjapan_swords_DESC:0 "Open the trade in Japanese blades, prized across the sea. Costs #Y 55#! treasury."
 qing_openjapan_swords_tt:0 "The trade in Japanese blades is opened: #G development capital#! flows from the blades prized across the sea."
 qing_openjapan_alliance:0 "The Sino-Japanese Pact (中日盟約)"
 qing_openjapan_alliance_DESC:0 "Seal a lasting pact between the throne and the realm of the rising sun. Costs #Y 70#! treasury."
 qing_openjapan_alliance_tt:0 "A lasting pact is sealed with the realm of the rising sun: #G mutual goodwill with Tokugawa Japan#!, and #G modernising momentum#! if the Self-Strengthening movement is already under way."

 # --- 安東都護府 the Pacified-East MARCH (fragmented Japan; relocated #27 P3b-4) ---
 qing_openjapan_andong_march:0 "The Protectorate-General of the Pacified East (安東都護府)"
 qing_openjapan_andong_march_DESC:0 "After the fall of Goguryeo the Tang governed the eastern marches through the Protectorate-General of the Pacified East (安東都護府). Revive it not over already-imperial Liaoning nor the ritual tributary Korea, but over the fragmented isles of Japan the treasure fleet has forced open: a self-governing frontier march under a Manchu Governor-General appointed by the Lifan Yuan, holding the daimyo, the Tokugawa shogunate and the Ainu of Ezo as its own subjects, funded by the throne to hold and extend the Qing paramountcy across the eastern sea."
 qing_openjapan_andong_march_tt:0 "Erect the #Y Protectorate-General of the Pacified East#! from your conquered holdings in Japan — a self-governing maritime #G frontier march#! (都護府) that holds the daimyo, the shogunate and the Ainu as its own subjects. Gain the #G Pacified East#! modifier."
 qing_openjapan_needs_japan_land_tt:0 "You must own at least #Y 3 provinces across the conquered Japanese home islands#! (the Honshu, Kyushu, Shikoku or Ezo regions) to erect the march"
 qing_protectorate_andong_name:0 "Andong (安東都護府)"
 qing_protectorate_andong_adj:0 "Andong"
 qing_col_protectorate_east:0 "Protectorate of the Pacified East (安東)"
