 # ####################################################################
 # [#439] The New Treasure Fleet (新寶船隊 / 鄭和寶船) mission tree.
 # See common/missions/qing_treasure_fleet_missions.txt,
 # common/scripted_effects/se_QING_TREASURE_FLEET.txt,
 # common/modifiers/qing_treasure_fleet_modifiers.txt.
 # ####################################################################

 qing_treasure_fleet_mission:0 "The New Treasure Fleet (新寶船隊)"
 qing_treasure_fleet_mission_DESCRIPTION:0 "Three centuries ago the eunuch-admiral Zheng He (鄭和) took the greatest fleet the world had ever seen down to the Western Ocean — nine-masted treasure-ships (寶船) longer than a European galleon was wide, bearing the Ming flag to Ceylon, Arabia and the coast of Africa. Then the court burned the plans, banned the building of ocean-going ships, and turned its back on the sea. Turn it back again. Revive the coastal shipyards, raise the great ports, build a fleet to dwarf the war-junks of the water-forces, and send it once more down to the southern seas — a sea-power reborn, tribute and renown flowing back up the Pearl and the Yangtze."
 qing_treasure_fleet_mission_CRITERIA_DESCRIPTION:0 "This enterprise is complete when the great armada has been mustered and sailed to the Western Ocean and back, a sea-power reborn."
 qing_treasure_fleet_mission_REWARD_DESCRIPTION:0 "Completing every objective in this tree grants its capstone reward."
 qing_treasure_fleet_mission_BUTTON_TOOLTIP:0 "Open this mission tree."

 qing_treasure_revive_yards:0 "Revive the Shipyards (振興船政)"
 qing_treasure_revive_yards_DESC:0 "Overturn the sea-ban mindset that has bound the empire to its shores. Pour silver into the coastal yards — the Longjiang works, the Fujian slips — and set the shipwrights to their craft once more. The programme raises a real home shipyard at your ablest coastal province. Costs #Y 100#! treasury."
 qing_treasure_revive_yards_tt:0 "Open the treasure-fleet programme: #G raise a home shipyard / sea port#! at the realm's ablest coastal province, and the court takes heart (#G ruler popularity#!)."

 qing_treasure_build_ports:0 "Build the Great Ports (廣建船塢)"
 qing_treasure_build_ports_DESC:0 "A treasure fleet needs harbours to match. Raise the port infrastructure yourself — develop a sea port to its fullest — so the great hulls have deep water to lie in and yards to fit them out. The mission recognises the harbour once it genuinely stands."
 qing_treasure_needs_port_tt:0 "The Qing must #Y own a fully-developed sea port#! — a #Y Harbour (port_building) at level 3#! in a coastal province."
 qing_treasure_needs_coast_tt:0 "The empire must #Y touch the sea#! — hold at least one #Y coastal (port) province#! — before the shipyards can be revived."
 qing_treasure_build_ports_tt:0 "The great ports stand — the realm's standing rises (#G legitimacy#!) and the court exults (#G ruler popularity#!). The lasting glory awaits the fleet's return."

 qing_treasure_amass_fleet:0 "Amass the Fleet (聚舟師)"
 qing_treasure_amass_fleet_DESC:0 "Build the hulls. Not the handful of war-junks of a coastal patrol, but a true ocean-going fleet — you must raise the ships yourself. When the fleet is genuinely gathered, the great treasure-ship armada is formally mustered under the imperial flag. Costs #Y 80#! treasury."
 qing_treasure_needs_fleet_tt:0 "The Qing must have a fleet of #Y 20 ships or more#! afloat."
 qing_treasure_amass_fleet_tt:0 "The armada is gathered — the named #Y 新寶船隊 (New Treasure Fleet)#! is mustered at the home sea port, and the court rejoices (#G ruler popularity#!)."

 qing_treasure_capstone:0 "The Voyage to the Western Ocean (下西洋)"
 qing_treasure_capstone_DESC:0 "Let the fleet sail. Down past Champa and Malacca, across to Ceylon and the pepper coast, into the Indian Ocean where no Chinese fleet has flown the flag in three hundred years — and home again, laden with tribute, envoys, and the renown of a realm that once more commands the sea."
 qing_treasure_needs_voyage_tt:0 "The Qing must have a grand ocean-going fleet of #Y 30 ships or more#!."
 qing_treasure_capstone_tt:0 "The treasure fleet returns in triumph. The lasting #G Glory of the Treasure Fleet (qing_treasure_fleet_glory)#! is sealed — naval reach, diplomatic weight, and a trade dividend from the reopened sea lanes — the realm steadies (#G stability, legitimacy#!), the tributary courts are overawed (#G tributary prestige#!), and the emperor's glory rings from the southern seas (#G ruler popularity#!). #Y The fleet now sails STANDING return voyages#!, bringing home the wealth of the empire's overseas colonies — the more #Y dominions established through the Great Pacific Enterprise#! (Australia, Africa, the fur coast, the Americas), the richer each homecoming."

 # the returning-fleet dominion modifier
 qing_treasure_fleet_glory:0 "Glory of the Treasure Fleet (寶船之威)"
 qing_treasure_fleet_glory_desc:0 "The New Treasure Fleet has sailed to the Western Ocean and returned — a sea-power reborn. The empire commands the southern sea lanes once more: swifter shipyards, a fleet that fights above its weight, the diplomatic weight of a realm whose flag flies from Ceylon to the African coast, and the commerce of the reopened routes."

 ###[BT-M 2026-07-25] expanded tree: Longjiang shipyard, Mao Kun chart, the seven voyage legs, 萬國來朝
 qing_treasure_grand_shipyard:0 "The Longjiang Shipyard (龍江船廠)"
 qing_treasure_grand_shipyard_DESC:0 "One harbour is not a navy. Raise a second great sea port to its fullest, and found at the ablest of them the Longjiang works — the vast state yard at which Zheng He's nine-masted 寶船 were laid down. A true naval-industrial base: dry docks, slips, and the manufactories behind them. Costs #Y 120#! treasury."
 qing_treasure_needs_shipyard_tt:0 "The Qing must #Y own two fully-developed sea ports#! — #Y two coastal provinces each with a Harbour (port_building) at level 3#!."
 qing_treasure_grand_shipyard_tt:0 "The great yard is founded — the home port is topped out and an #G industrial estate#! rises behind the slips. The realm's standing grows (#G legitimacy#!) and the court takes pride (#G ruler popularity#!)."
 qing_treasure_mao_kun_chart:0 "The Mao Kun Chart (鄭和航海圖)"
 qing_treasure_mao_kun_chart_DESC:0 "Gather the pilots and the compass-masters, and set down the accumulated seamanship of the voyages — the sailing directions, the star-paths, the coasts and currents of the Western Ocean — into a great navigation chart. The knowledge that makes the far voyages possible. Costs #Y 60#! treasury."
 qing_treasure_mao_kun_chart_tt:0 "The chart is drawn — a lasting #G Mastery of Navigation (qing_treasure_navigation)#!: faster shipbuilding, abler crews, and the research of a sea-power reborn."
 qing_treasure_champa:0 "The Southern Landfall — Champa (占城)"
 qing_treasure_champa_DESC:0 "Point the prows south. Past Hainan and the shoals of the South China Sea to Champa, the first tributary landfall and the gate to the southern route. The fleet overawes the court, trades, and confirms safe passage. Costs #Y 60#! treasury."
 qing_treasure_needs_champa_tt:0 "The Qing must have a fleet of #Y 20 ships or more#! afloat."
 qing_treasure_champa_tt:0 "Champa enters the tributary order — a #G trade dividend, a wealth haul, and tributary prestige#!, and the court's glory (#G ruler popularity, legitimacy#!)."
 qing_treasure_malacca:0 "The Great Entrepôt — Malacca (滿剌加)"
 qing_treasure_malacca_DESC:0 "Sail on to Malacca, the chokepoint of the southern seas. As Zheng He once raised it from a minor port to a Ming-protected sultanate, so the Qing fleet plants its flag on the strait through which all the ocean's trade must pass. Costs #Y 70#! treasury."
 qing_treasure_needs_malacca_tt:0 "The Qing must have a fleet of #Y 22 ships or more#! afloat."
 qing_treasure_malacca_tt:0 "Malacca becomes a Qing-protected waystation — a #G commerce dividend and a new trade route#!, a wealth haul, and rising tributary prestige."
 qing_treasure_ceylon:0 "The Isle of Serendib — Ceylon (錫蘭山)"
 qing_treasure_ceylon_DESC:0 "Cross the Bay of Bengal to Ceylon, the jewelled isle at the ocean's heart. Where the third voyage once fought and carried off a hostile king, the Qing fleet comes in strength and is received. Costs #Y 80#! treasury."
 qing_treasure_needs_ceylon_tt:0 "The Qing must have a fleet of #Y 24 ships or more#! afloat."
 qing_treasure_ceylon_tt:0 "Ceylon joins the tributary order — a #G trade dividend, a wealth haul, and tributary prestige#!."
 qing_treasure_calicut:0 "The Pepper Coast — Calicut (古里)"
 qing_treasure_calicut_DESC:0 "Raise the coast of Malabar and the great mart of Calicut, the Zamorin's city and the richest spice port of the Indies — the principal destination of every voyage. The fleet trades silk and porcelain for pepper and gems, and the Zamorin sends envoys to Peking. Costs #Y 90#! treasury."
 qing_treasure_needs_calicut_tt:0 "The Qing must have a fleet of #Y 26 ships or more#! afloat."
 qing_treasure_calicut_tt:0 "Calicut opens to the Qing — a #G commerce dividend and a new trade route#!, a rich wealth haul, and a great swell of tributary prestige."
 qing_treasure_hormuz:0 "The Gulf Terminus — Hormuz (忽魯謨斯)"
 qing_treasure_hormuz_DESC:0 "Sail west to Hormuz at the mouth of the Persian Gulf, the terminus of the great voyages and the gateway to the Timurid and Arabian trade. Pearls, horses, and the wealth of Persia flow to the fleet. Costs #Y 100#! treasury."
 qing_treasure_needs_hormuz_tt:0 "The Qing must have a fleet of #Y 28 ships or more#! afloat."
 qing_treasure_hormuz_tt:0 "Hormuz receives the fleet — a #G commerce dividend, a rich wealth haul, and tributary prestige#!."
 qing_treasure_aden:0 "The Red Sea Gate — Aden (阿丹)"
 qing_treasure_aden_DESC:0 "Round Arabia to Aden, the Yemeni port that commands the mouth of the Red Sea and the road to the Islamic heartland. The Sultan opens his markets to the treasure ships. Costs #Y 110#! treasury."
 qing_treasure_needs_aden_tt:0 "The Qing must have a fleet of #Y 30 ships or more#! afloat."
 qing_treasure_aden_tt:0 "Aden opens to the fleet — a #G commerce dividend, a rich wealth haul, and tributary prestige#!."
 qing_treasure_malindi:0 "The Farthest Shore — Malindi (麻林)"
 qing_treasure_malindi_DESC:0 "Beyond the ocean's edge, to the Swahili coast of Africa — Mogadishu, Brava, and Malindi, the farthest shore any Chinese fleet has ever reached. Malindi sends its wonders home: the tall spotted beast the court hails as the auspicious 麒麟 (qilin). Costs #Y 130#! treasury."
 qing_treasure_needs_malindi_tt:0 "The Qing must have a grand fleet of #Y 34 ships or more#! afloat."
 qing_treasure_malindi_tt:0 "The African coast is reached and the qilin presented at court — the greatest #G wealth haul and tributary prestige#! of all, and a swell of #G legitimacy#! from the auspicious omen."
 qing_treasure_myriad_court:0 "Ten Thousand Nations Come to Court (萬國來朝)"
 qing_treasure_myriad_court_DESC:0 "With the far shores reached, let the envoys come. From Champa to Calicut, from Hormuz to the African coast, the ambassadors of the southern seas throng the road to Peking, bearing tribute to the Son of Heaven — the ideal of universal homage made real."
 qing_treasure_needs_myriad_tt:0 "The fleet must have reached the far stations — a grand fleet of #Y 30 ships or more#! (and the India voyage won)."
 qing_treasure_myriad_court_tt:0 "The court is thronged with envoys — the lasting #G Myriad Court (qing_treasure_myriad_court)#!: standing diplomatic weight and legitimacy, a great swell of #G tributary prestige#!, and the emperor's glory (#G ruler popularity#!)."

 ###[BT-M 2026-07-25] the per-leg dominion marks + navigation + myriad-court modifiers
 qing_treasure_leg_champa:0 "Sea Lane to Champa (占城航路)"
 qing_treasure_leg_champa_desc:0 "The southern route is open: a Qing sea lane to Champa and the trade of the South China Sea."
 qing_treasure_leg_malacca:0 "The Malacca Waystation (滿剌加要津)"
 qing_treasure_leg_malacca_desc:0 "A Qing-protected waystation on the strait through which the ocean's trade must pass — commerce and a new trade route."
 qing_treasure_leg_ceylon:0 "Sea Lane to Ceylon (錫蘭航路)"
 qing_treasure_leg_ceylon_desc:0 "The fleet's flag flies over the jewelled isle at the ocean's heart — the Bay of Bengal trade opens."
 qing_treasure_leg_calicut:0 "The Calicut Spice Route (古里香料航路)"
 qing_treasure_leg_calicut_desc:0 "Silk and porcelain for pepper and gems — a rich Qing trade route to the Zamorin's great mart on the Malabar coast."
 qing_treasure_leg_hormuz:0 "The Hormuz Trade (忽魯謨斯通商)"
 qing_treasure_leg_hormuz_desc:0 "The Persian Gulf terminus opens to the fleet — the wealth of Persia and the Timurid sphere flows east."
 qing_treasure_leg_aden:0 "The Aden Trade (阿丹通商)"
 qing_treasure_leg_aden_desc:0 "The Red Sea gate opens — the markets of Arabia and the road to the Islamic heartland."
 qing_treasure_leg_malindi:0 "The African Landfall (麻林遠航)"
 qing_treasure_leg_malindi_desc:0 "The farthest shore — the Swahili coast of Africa, and the wonders of a world no Chinese fleet had reached before."
 qing_treasure_navigation:0 "Mastery of Navigation (航海圖成)"
 qing_treasure_navigation_desc:0 "The Mao Kun chart and the compass-masters' sailing directions: swifter, abler shipbuilding and the seamanship of a sea-power reborn."
 qing_treasure_myriad_court:0 "Ten Thousand Nations at Court (萬國來朝)"
 qing_treasure_myriad_court_desc:0 "The envoys of the southern seas throng the road to Peking, bearing tribute to the Son of Heaven — the standing diplomatic weight and legitimacy of universal homage."
