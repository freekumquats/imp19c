l_english:
 qing_gcscandal.1.t:0 "The Tribunal Sits (審理)"
 qing_gcscandal.1.desc:0 "The graft of [gcscandal_minister.GetName], a Grand Minister of the realm, has come before a tribunal of the Censorate (都察院). The evidence is grave — silver diverted from the fisc on a scale that recalls Heshen (和珅) himself — but the accused is a powerful man with powerful friends, and a great minister has beaten such charges before. The Grand Censor lays out the case; the court awaits the throne's will. Shall we press for conviction, or let the matter drop?"
 qing_gcscandal.1.press:0 "Press the case to its conclusion (窮治)"
 qing_gcscandal.1.press.tt:0 "Pursue the conviction. Whether it holds is a #Y contest#! between the Censorate's rigour (the Grand Censor's finesse and zeal) and the minister's guile (his finesse); flagrant realm corruption tips the scales toward guilt. #G On conviction:#! confiscation, the office falls vacant, and the minister faces the emperor's sentence. #R On acquittal:#! he walks free, emboldened, and the graft entrenches."
 qing_gcscandal.1.drop:0 "Drop the matter (不問)"
 qing_gcscandal.1.drop.tt:0 "Spare the court the spectacle of trying one of its own — the throne is seen to shield the great offices.\n#R Corruption: +5#!"
 qing_gcscandal.2.t:0 "The Minister Falls (籍沒)"
 qing_gcscandal.2.desc:0 "The tribunal has convicted [gcscandal_minister.GetName]. His fortune — swollen with the realm's stolen silver — is confiscated to the treasury, and the great warning lands across the bureaucracy: even a Grand Minister is not beyond the throne's reach. His office now stands vacant, its work stalled until the emperor names a successor. How shall he be sentenced?"
 qing_gcscandal.2.mercy:0 "Mercy: dismiss him in disgrace, but spare his life."
 qing_gcscandal.2.mercy.tt:0 "Strip his office (it falls #R vacant — the ministry's performance suffers until re-staffed#!) and confiscate his estate, but let him retire in disgrace. The tainted grandee lives."
 qing_gcscandal.2.rigour:0 "The full rigour: the silken cord (賜死)."
 qing_gcscandal.2.rigour.tt:0 "Strip his office (it falls #R vacant#!) and grant him the Heshen sentence — death by the throne's command. The court is cowed, but the throne's hand is seen to be pitiless."
 qing_gcscandal.3.t:0 "The Case Collapses (脫罪)"
 qing_gcscandal.3.desc:0 "The tribunal has failed. [gcscandal_minister.GetName] proved too well-connected — witnesses recanted, memorials went missing, and the charges dissolved. He walks free and vindicated, his faction stronger for the failed prosecution. The realm marks that the throne could not discipline one of its own great ministers, and the graft goes on."
 qing_gcscandal.3.a:0 "The great offices are not so easily broken."
