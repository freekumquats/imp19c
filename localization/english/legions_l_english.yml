 ### Legion Army name ###
 COHORT_NAME_spanish:0 "$NUM$$ORDER$ $BASE$ Batallion"
 # [#98] Qing cohorts are named after the country's primary culture (jurchen for CHI),
 # so a single COHORT_NAME_jurchen names the sub-units of ALL Qing legions (Eight
 # Banners, Green Standard, etc.) — the engine key is COHORT_NAME_<culture>, NOT the
 # mis-keyed COHORT_jurchen the mod had before (which left the raw key on screen).
 # cohort naming is per-CULTURE, so this one key names EVERY Qing cohort regardless of
 # unit type — it can't say "Banner" or the Green Standard (綠營) would read as a Banner.
 # "Battalion" (營) is the correct universal noun (right for the Green Standard; banner
 # forces were also organized into battalions/companies); the Eight Banners identity is
 # carried by the ARMY name (八旗), not the cohort. Mirrors the COHORT_NAME_spanish form.
 COHORT_NAME_jurchen:0 "$NUM$$ORDER$ $BASE$ Battalion"
 LEGION_NAME_hellenic:0 "$NUM$$ORDER$ Taxis of $BASE$"
 LEGION_NAME_persia:0 "$NUM$$ORDER$ Spada of $BASE$"
 LEGION_NAME_germanic:0 "$NUM$$ORDER$ Harjaz of $BASE$"
 LEGION_NAME_britannic:0 "$NUM$$ORDER$ Slougos of $BASE$"
 LEGION_NAME_gallic:0 "$LEGION_NAME_britannic$"
 LEGION_NAME_gaelic:0 "$LEGION_NAME_britannic$"
 LEGION_NAME_belgae:0 "$LEGION_NAME_britannic$"
 LEGION_NAME_baltic:0 "$NUM$$ORDER$ Slog of $BASE$"
 LEGION_NAME_scythia:0 "$LEGION_NAME_persia$"

