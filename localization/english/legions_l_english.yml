 distinction_qing_green_standard:0 "Green-Standard Battalion (綠營標營)"
 distinction_qing_green_standard_desc:0 "A battalion of the Han provincial constabulary army — steady in defence, cheap to keep in the field."
 distinction_qing_jianrui:0 "Jianrui Vanguard Brigade (健銳營)"
 distinction_qing_jianrui_desc:0 "The elite storming corps raised for the stone watch-towers of the Jinchuan wars — masters of the mountain assault and the siege."
 distinction_qing_solon:0 "Solon Levies (索倫勁旅)"
 distinction_qing_solon_desc:0 "The Manchu-frontier marksmen of the Solon, Daur and Ewenki — the empire's finest skirmishers, deadly among the trees."
 distinction_qing_firearms_brigade:0 "Firearms Brigade (火器營)"
 distinction_qing_firearms_brigade_desc:0 "The Beijing artillery-and-musket division — smoothbore cannon and disciplined matchlock, the Qing's siege firepower."
 distinction_qing_rattan_shield:0 "Rattan-Shield Troops (藤牌兵)"
 distinction_qing_rattan_shield_desc:0 "The southern shield infantry, proof against cavalry and skilled in broken and wooded country."
 distinction_qing_camel_fort:0 "Camel-Fort Artillery (駝城)"
 distinction_qing_camel_fort_desc:0 "The mobile swivel-guns mounted on camels that carried the western campaigns across the desert."
