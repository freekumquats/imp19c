l_english:
 # qing_tribute_l_english.yml — [#322] the tribute-embassy rhythm (朝貢體系).
 # se_QING_TRIBUTE.txt + qing_tribute_events.txt. BOM + LF.

 # ---- modifier name/desc (subject-side, applied by the investiture/breakaway/GP options) ----
 qing_tributary_invested:0 "Invested by the Son of Heaven (冊封)"
 qing_tributary_invested_desc:0 "The Qing throne has confirmed this court's ruler with the imperial patent of investiture and seal — the ritual bond of the tributary order. The vassal is bound the tighter to Peking while the honour is fresh."

 qing_tribute.1.t:0 "A Tribute Embassy at Peking (朝貢入覲)"
 qing_tribute.1.desc:0 "An embassy has come to the capital from [trib_sender.GetName], bearing tribute for the Son of Heaven — the ritual homage by which the tributary states of the realm acknowledge the centre of the world. Its envoys wait in the antechambers of the [ROOT.GetCountry.Custom('get_country_formal_adjective')] court with their gifts and their memorial of submission. By ancient custom the throne receives such a mission in full ceremony and returns imperial largesse many times the tribute's worth — for the tribute was never about the goods, but about the ORDER it affirmed: that all under Heaven look to Peking. Yet the ceremony is costly, and a hard-pressed treasury may prefer to take the tribute and spare the spectacle."
 qing_tribute.1.a:0 "Receive them in full ceremony (賜宴頒賞)."
 qing_tribute.1.a.tt:0 "The lavish audience: a banquet, the return-gifts, the whole ritual of suzerainty.\n#G Suzerain Prestige (保藩威望): +7#!"
 qing_tribute.1.b:0 "Take the tribute; dismiss the mission curtly."
 qing_tribute.1.b.tt:0 "Spare the expense and the ceremony — the goods are taken, but the perfunctory reception is noted.\n#R Suzerain Prestige (保藩威望): -3#!"

 # ---- .2 A Tributary's New Ruler Awaits Investiture (冊封) [#322 deferred] ----------
 qing_tribute.2.t:0 "A Patent of Investiture Sought (冊封)"
 qing_tribute.2.desc:0 "The throne of [trib_invest_vassal.GetName] has passed to a new sovereign, [trib_invest_vassal.GetRuler.GetName], and by the custom of the tributary order he cannot be held a lawful king until the Son of Heaven confirms him — with a patent of investiture, a seal of office, and the calendar of the imperial dynasty. It was this ritual of 冊封, renewed each reign, that made the tributary bond a living thing rather than a dead letter. To invest him promptly affirms that Peking remains the fount of legitimacy in all the world; to withhold it is a calculated snub — one that a restless court, or a watching rival, will not fail to notice."
 qing_tribute.2.a:0 "Invest him promptly — confer the patent and seal."
 qing_tribute.2.a.tt:0 "The ritual affirmed without delay.\n#G Suzerain Prestige (保藩威望): +6#!"
 qing_tribute.2.b:0 "Confer it — but let the recognition be bought."
 qing_tribute.2.b.tt:0 "The patent granted, but a price extracted for it.\n#G Suzerain Prestige (保藩威望): +2#!"
 qing_tribute.2.c:0 "Withhold recognition — let him prove his submission."
 qing_tribute.2.c.tt:0 "The new sovereign is left unrecognised, to earn the patent by his loyalty.\n#R Suzerain Prestige (保藩威望): -5#!"

 # ---- .3 A Restless Tributary Tests the Bond (breakaway crisis) [#322 deferred] -----
 qing_tribute.3.t:0 "A Tributary Grows Restless"
 qing_tribute.3.desc:0 "[trib_restless.GetName], sensing the centre weaken, has grown slack in its obligations — a tribute mission not sent, a border courtesy withheld, an envoy received from a rival court. It is the oldest test of a fraying suzerainty: does the bond still hold, or is it now only a form? The throne may answer with an overawing show of strength on the marches, purchase the vassal's renewed loyalty with largesse, or judge that the empire cannot chase down every insolence — and let it drift toward the open door of independence."
 qing_tribute.3.a:0 "Overawe it — a show of strength on the marches."
 qing_tribute.3.a.tt:0 "A costly demonstration of the empire's long reach.\n#G Suzerain Prestige (保藩威望): +12#!"
 qing_tribute.3.b:0 "Buy its loyalty back — largesse and remitted tribute."
 qing_tribute.3.b.tt:0 "Silver where the sword would cost more.\n#G Suzerain Prestige (保藩威望): +5#!"
 qing_tribute.3.c:0 "Let it drift — the empire cannot answer every insolence."
 qing_tribute.3.c.tt:0 "The tributary is left to its restlessness.\n#R Suzerain Prestige (保藩威望): -8#!\n#R Reform Pressure: +4#!"

 # ---- .4 A Great Power Meddles in a Qing Tributary (以夷制夷) [#322 deferred] --------
 qing_tribute.4.t:0 "Barbarian Hands on a Tributary"
 qing_tribute.4.desc:0 "Word comes from the frontier that a Western power presses into the affairs of [trib_meddled.GetName] — a treaty offered behind Peking's back, a gunboat at a tributary harbour, a consul where none should be. This is the new danger of the age: the Sinocentric order, which for centuries knew no rival, now finds the outer barbarians reaching past the throne to deal with its vassals as sovereign states. The throne may warn the meddler off and reassert that the tributary is the empire's own, strike a face-saving bargain that cedes a measure of influence, or acquiesce — and watch another stone fall from the wall of the old order."
 qing_tribute.4.a:0 "Warn the meddler off — the tributary is ours."
 qing_tribute.4.a.tt:0 "A firm reassertion of suzerainty over [trib_meddled.GetName] (以夷制夷 pushback).\n#G Suzerain Prestige (保藩威望): +6#!\nThe meddling power's #R Tension: +8#!"
 qing_tribute.4.b:0 "Strike a bargain — cede a measure of influence."
 qing_tribute.4.b.tt:0 "A face-saving accommodation.\nThe meddling power's #G Tension: -6#!\n#R Suzerain Prestige (保藩威望): -4#!"
 qing_tribute.4.c:0 "Acquiesce — the empire cannot contest them here."
 qing_tribute.4.c.tt:0 "The throne yields the ground.\n#R Suzerain Prestige (保藩威望): -10#!\n#R Reform Pressure: +6#!"

 # ---- .5 A Tributary Defaults on its Tribute — Punish or Forgive (理藩院裁決) [BT-11] --
 qing_tribute.5.t:0 "A Tributary Defaults on its Tribute"
 qing_tribute.5.desc:0 "The quarterly reckoning of the Court of Colonial Affairs (理藩院) brings unwelcome news: [trib_defaulter.GetName] has failed to render the tribute it owes — its treasury exhausted, its obligation unmet. In the language of the tributary order this is no small thing: the rendering of tribute is the visible sign of submission, and a default left unanswered invites every other vassal to test the same slackness. Yet the Son of Heaven has long cloaked hard power in the garment of grace — 懷柔遠人, to cherish men from afar. The ministers of the Lifan Yuan await the throne's judgment: shall the defaulter be brought to heel, or its arrears forgiven as an act of imperial magnanimity?"
 qing_tribute.5.a:0 "Bring it to heel — a default cannot go unanswered."
 qing_tribute.5.a.tt:0 "The Lifan Yuan tightens its grip on [trib_defaulter.GetName].\n#G Suzerain Prestige (保藩威望): +6#!"
 qing_tribute.5.b:0 "Forgive the arrears — cherish men from afar (懷柔遠人)."
 qing_tribute.5.b.tt:0 "An act of imperial grace toward [trib_defaulter.GetName].\n#R Suzerain Prestige (保藩威望): -3#!"
