l_english:
 # ==========================================================================
 # qing_new_buildings_l_english.yml — [buildings-research 2026-07-27] names +
 # descriptions for the new Qing/IND buildings (scholarship, religion, military,
 # agriculture, commerce/fiscal, and the early-industrial chain). Buildable
 # buildings also carry a macro-builder title key. Seed-only flavour buildings
 # (Hanlin, Guozijian, Temple of Heaven, Ancestral Temple, Dujiangyan) get
 # name + desc only. BOM + l_english per loc convention.
 # ==========================================================================

 qing_hanlin_academy_building:0 "翰林院 Hanlin Academy"
 qing_hanlin_academy_building_desc:0 "The Hanlin Academy, the empire's supreme body of elite scholar-officials, who drafted state documents, compiled the histories and tutored the imperial house. The apex of the examination meritocracy. A powerful engine of learning and administrative prestige."
 qing_guozijian_building:0 "國子監 Imperial College"
 qing_guozijian_building_desc:0 "The Imperial College (Guozijian), the highest institution of state learning, where the sons of officials and tribute students studied the Confucian classics for the metropolitan examinations. The scholarly seedbed of the bureaucracy."
 qing_temple_of_heaven_building:0 "天壇 Temple of Heaven"
 qing_temple_of_heaven_building_desc:0 "The Temple of Heaven, where the Son of Heaven performed the great annual sacrifices that renewed the Mandate and secured the harvest. The supreme ritual centre of the imperial cult, radiating legitimacy across the realm."
 qing_ancestral_temple_building:0 "太廟 Imperial Ancestral Temple"
 qing_ancestral_temple_building_desc:0 "The Imperial Ancestral Temple (Taimiao), where the ruling house venerated its forebears in the rites that anchored dynastic legitimacy. The sacral heart of the reigning line."
 qing_dujiangyan_building:0 "都江堰 Dujiangyan Irrigation Works"
 qing_dujiangyan_building_desc:0 "The Dujiangyan headworks on the Min River, built in antiquity and maintained ever since, which tames the flood and waters the Chengdu plain without a dam — turning Sichuan into the 'land of abundance' (天府之國). A peerless engine of food and settlement."
 qing_examination_hall_building:0 "貢院 Examination Hall"
 qing_examination_hall_building_desc:0 "A provincial examination compound (gongyuan), its thousands of cramped cells the arena of the civil-service examinations that selected the empire's officials and bound the gentry to the throne. Raises learning and the scholar-official stratum."
 qing_tongwen_guan_building:0 "同文館 School of Combined Learning"
 qing_tongwen_guan_building_desc:0 "The Tongwen Guan, the pioneering school of Western languages and sciences that trained the interpreters and diplomats of the Zongli Yamen. The bridge from the classical academy to modern learning."
 qing_imperial_university_building:0 "京師大學堂 Imperial University"
 qing_imperial_university_building_desc:0 "The Imperial University of Peking, China's first national modern university, synthesising Chinese and Western learning and ancestor of Peking University. The capstone of educational modernisation."
 qing_confucian_temple_building:0 "文廟 Temple of Confucius"
 qing_confucian_temple_building_desc:0 "A Temple of Confucius (wenmiao), where officials and licentiates honoured the Sage in the rites that sacralised the Confucian order. The civic-religious focus of every administered city."
 qing_gelug_monastery_building:0 "格魯寺院 Gelug Monastery"
 qing_gelug_monastery_building_desc:0 "A great monastery of the Gelug (Yellow Hat) school of Tibetan Buddhism, patronised by the Qing to bind Tibet and Mongolia to the throne through the Dalai and Panchen hierarchs. A pillar of frontier loyalty."
 qing_great_mosque_building:0 "清真寺 Great Mosque"
 qing_great_mosque_building_desc:0 "A great congregational mosque serving the Hui and Turkic Muslim communities of the north-west and the cities of the interior. A centre of community, learning and trade."
 qing_banner_garrison_building:0 "駐防八旗城 Banner Garrison City"
 qing_banner_garrison_building_desc:0 "A provincial Eight-Banners garrison — the walled 'Manchu city' (滿城) planted inside a great Han city, home to hereditary banner soldiery who enforced imperial order. Loyalty and defence, but a privileged caste the local Han resented."
 qing_horse_pasture_building:0 "御馬牧場 Imperial Horse Pasture"
 qing_horse_pasture_building_desc:0 "An imperial horse pasture of the Court of the Imperial Stud, breeding the war-horses and remounts of the banner cavalry across the Mongol and Manchurian grasslands. The logistical base of Qing mounted power."
 qing_green_standard_post_building:0 "綠營汛塘 Green Standard Post"
 qing_green_standard_post_building_desc:0 "A post of the Green Standard Army, the sedentary Han provincial constabulary that policed the interior and guarded the roads from thousands of small garrisons. Cheap and broad, but a decaying institution by the nineteenth century."
 qing_coastal_battery_building:0 "海防砲臺 Coastal Battery"
 qing_coastal_battery_building_desc:0 "A coastal artillery fort of the Humen type, guarding a river mouth or treaty-port approach with heavy cannon. Littoral defence plus the infrastructure to support a modern fleet."
 qing_military_colony_building:0 "軍屯總局 Military Colony Directorate"
 qing_military_colony_building_desc:0 "The headquarters of a tuntian military-agricultural colony — the soldier-farmer settlements that held and fed the Xinjiang and Manchurian frontier. Food, defence and settlement pull on the open frontier."
 qing_river_conservancy_building:0 "河道總督衙門 River Conservancy Bureau"
 qing_river_conservancy_building_desc:0 "The seat of the Director-General of River Conservancy, who commanded the vast and ruinously expensive Yellow-River and Grand-Canal flood-control apparatus. The administrative brain of the empire's hydraulic defence."
 qing_karez_building:0 "坎兒井 Karez Irrigation"
 qing_karez_building_desc:0 "The karez: gravity-fed underground galleries tapping the snow-melt water table to green the Turpan and Tarim oases — the technology that made desert agriculture possible."
 qing_fishpond_dyke_building:0 "桑基魚塘 Mulberry-Dyke Fish-Pond"
 qing_fishpond_dyke_building_desc:0 "The Pearl-River-delta integrated system where mulberry grown on the pond dykes fed silkworms, whose waste fed the fish, whose mud re-fertilised the dykes — a closed sericulture-aquaculture ecology feeding both food and the silk economy."
 qing_polder_building:0 "圩田 Polder"
 qing_polder_building_desc:0 "Diked and drained wetland reclaimed for paddy in the Yangzi delta and the middle-Yangzi lake country — the high-Qing answer to a soaring population's hunger for land."
 qing_community_granary_building:0 "社倉 Community Granary"
 qing_community_granary_building_desc:0 "A community or charity granary (shecang / yicang), the local gentry- and village-run grain reserve for famine relief that formed the decentralised second tier of the Qing food-security system, distinct from the state ever-normal granary."
 qing_mint_building:0 "錢局 Provincial Mint"
 qing_mint_building_desc:0 "A provincial mint bureau casting the empire's copper cash (制錢) — the Board of Revenue and Board of Works mints and their provincial counterparts. The concrete node of the copper coinage."
 qing_draft_bank_building:0 "票號 Shanxi Draft Bank"
 qing_draft_bank_building_desc:0 "A Shanxi draft bank (piaohao), the remittance house that moved silver across the empire by paper draft and financed the long-distance trade — and in time the state's own transfers. Powerful reach across the trade network."
 qing_guild_hall_building:0 "會館 Merchant Guild Hall"
 qing_guild_hall_building_desc:0 "A native-place merchant guild hall (huiguan), where sojourning merchants of a common home region organised their trade, pooled credit and arbitrated disputes — the social infrastructure of Qing inter-regional commerce."
 qing_tribute_depot_building:0 "漕倉 Tribute Grain Depot"
 qing_tribute_depot_building_desc:0 "A tribute-grain depot on the Grand Canal, storing the grain tax barged north to feed the capital and the banner establishment — the buffer of the tribute-transport system, distinct from the price-stabilising ever-normal granary."
 qing_likin_station_building:0 "釐金局 Likin Station"
 qing_likin_station_building_desc:0 "A likin internal-transit tax station, improvised in the 1850s to fund the anti-Taiping armies and never abolished. Real revenue — but a barrier that throttles trade and angers the merchant class. A fiscal double edge."
 qing_imperial_bank_building:0 "大清銀行 Imperial Bank"
 qing_imperial_bank_building_desc:0 "The Imperial Bank of the Great Qing, the state's first modern central bank, issuing notes and managing the treasury on Western lines. The capstone of monetary modernisation."
 qing_telegraph_building:0 "電報局 Telegraph Administration"
 qing_telegraph_building_desc:0 "The Imperial Telegraph Administration, the wire network that collapsed the empire's communication distances — a modern administrative and commercial nerve linking the provinces to the capital."
 IND_coal_mine_building:0 "Coal Mine"
 IND_coal_mine_building_desc:0 "A mechanised deep-shaft coal mine with steam drainage — the fuel base of all heavy industry, buildable where coal is dug once the age of steam locomotion arrives."
 IND_blast_furnace_building:0 "Blast Furnace"
 IND_blast_furnace_building_desc:0 "A coke-fired blast furnace turning iron ore into cast iron for rails, machinery and structures — the middle link of the heavy-industry chain."
 IND_electric_plant_building:0 "Electric Power Station"
 IND_electric_plant_building_desc:0 "A coal-fired electric power station — the Second-Industrial-Revolution utility that lifts every industry in the province and draws population to the modern city."
 IND_gasworks_building:0 "Gasworks"
 IND_gasworks_building_desc:0 "A coal-gas works for urban lighting — the earlier utility that preceded electric power and a marker of the modern city."
 qing_steel_works_building:0 "漢陽鐵廠 Ironworks"
 qing_steel_works_building_desc:0 "The Hanyang Ironworks, Asia's first modern integrated steel plant and core of the Hanyeping combine — the apex of heavy industry, casting steel for rails, ships, machinery and modern arms."
 qing_textile_mill_building:0 "機器織布局 Mechanised Textile Mill"
 qing_textile_mill_building_desc:0 "A mechanised textile mill turning cotton and silk into cloth at scale on steam spinning frames and power looms — China's accessible first rung of factory industrialisation."
 qing_machine_works_building:0 "江南製造局 Arsenal & Machine Works"
 qing_machine_works_building_desc:0 "The Jiangnan Arsenal, East Asia's largest, casting not only arms but the machine tools — the 'mother machines' — and running a translation bureau and technical school. The technology incubator of the Self-Strengthening movement."
 qing_navy_yard_building:0 "福州船政局 Navy Yard"
 qing_navy_yard_building_desc:0 "The Foochow Navy Yard, China's first modern shipyard and naval academy, building steam warships and training the first modern officer corps. Naval construction plus a technical school."
 qing_coal_mine_building:0 "開平礦務局 Kaiping Mines"
 qing_coal_mine_building_desc:0 "The Kaiping Mines, China's first large mechanised colliery, which built the country's first standard-gauge railway to move its coal — the Chinese face of the fuel base for steamers, arsenals and mills."

