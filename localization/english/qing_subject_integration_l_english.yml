l_english:

 # [#task-20 2026-08-04] SHARED actor-status addenda, appended to every subject-integration event's
 # desc, naming the local resident amban / imperial garrison when they exist (resolved by
 # SUBJ_QING_resolve_integ_actors). Deliberately generic so the scandal/harvest/festival events (which
 # are not force-vs-persuasion dilemmas) can all reuse them; the crisis events (.10/.12/.40/.41) carry
 # their own situation-specific addenda instead.
 qing_integ.actors_both:0 "\n\n#Y On the ground:#! the resident amban [integ_amban.GetName] holds his post and an imperial garrison stands in the dependency — the throne's eyes and its sword are both close at hand."
 qing_integ.actors_amban:0 "\n\n#Y On the ground:#! the resident amban [integ_amban.GetName] holds his post — the throne's eyes are on the spot, though no imperial garrison stands near."
 qing_integ.actors_garrison:0 "\n\n#Y On the ground:#! an imperial garrison stands in the dependency — the throne's sword is close, though no resident amban attends the local court."
 qing_integ.actors_none:0 "\n\n#Y On the ground:#! neither a resident amban nor an imperial garrison is near — the throne watches this dependency only from afar."

# Qing subject-integration reaction events (events/imp19c_mod_events/qing_subject_integration.txt).
# Flavor text is grounded in real Qing frontier history and cites its sources
# inline. [target.GetName] = the subject being integrated.

# --- .10  POPULAR UNREST --------------------------------------------------
 qing_integ.10.t:0 "Unrest in [target.GetName]"
 qing_integ.10.desc:0 "Our drive to absorb [target.GetName] into the direct administration of the Great Qing has stirred the old resentments. Magistrates report crowds gathering in the market towns, tax registers burned, and agitators preaching that the throne means to strip the people of every liberty they were promised.\n\nThe court remembers the Revolt of the Three Feudatories (三藩之亂, 1673–1681), when the Kangxi Emperor's decision to revoke the autonomous southern fiefs against a divided council touched off eight years of civil war. It remembers too the White Lotus Rebellion (白蓮教起義, 1794–1804), of which a later decree admitted plainly: 'it was extortion by local officials that goaded the people into rebellion' (官吏苛索逼民為亂). Shall we press on regardless?"
 qing_integ.10.a:0 "Bring in troops to crush the disturbance. The Son of Heaven does not bargain with rabble."
 qing_integ.10.a.tt:0 "Bring in an outside column to suppress the unrest: #R -5 Stability, +War Exhaustion#!, harsh unrest in the affected province, and lasting resentment among our subjects — but integration continues. (When a #G local garrison#! is already on the spot, ordering IT out is cheaper — the other option.)"
 qing_integ.10.e:0 "Order the local garrison to restore order."
 qing_integ.10.e.tt:0 "Only when a #G banner garrison#! already stands in the dependency: the troops are #G already there#!, so they put the rising down at once — far cheaper and with less lasting resentment than marching in a column. A dominant garrison does it almost bloodlessly (#R -1 Stability#!); rough parity is rougher (#R -3 Stability#!). Integration continues; the Ministry of War is credited."
 qing_integ.10.b:0 "Suspend the integration until tempers cool."
 qing_integ.10.b.tt:0 "Halt the process (it can be resumed later), lose a step of progress, and recover #G +2 Stability#!."
 qing_integ.10.c:0 "Remit taxes and distribute grain to pacify the frontier (rou yuan 柔遠)."
 qing_integ.10.c.tt:0 "Spend #R ¥100#! from the treasury to feed the affected province and win our subject's goodwill."
 qing_integ.10.d:0 "Let the resident amban calm the unrest by persuasion."
 qing_integ.10.d.tt:0 "Only when a #G steady resident amban#! sits in the dependency: he attempts to quiet the rising without the mailed fist — a #Y skill check#! on his charisma and finesse (25 + twice his charisma + his finesse, bounded 10–90%).\n#G On success ([integ_amban.MakeScope.GetVariable('qing_amban_negotiate_chance_shown').GetValue|0]%)#!: #G +1 Stability#!, the affected province eased, the process moves on, and his standing rises (#G +5 prominence#!).\n#R On failure ([integ_amban.MakeScope.GetVariable('qing_amban_negotiate_fail_shown').GetValue|0]%)#!: his appeal falls flat — #R -1 Stability#!, and he is discredited (#R -5 prominence#!). He is not executed — this is not the mortal gamble of a rebel negotiation."

# --- .11  CORRUPTION SCANDAL ----------------------------------------------
 qing_integ.11.t:0 "The Resident's Graft (駐臣中飽)"
 qing_integ.11.desc:0 "The silver appropriated to smooth the integration of [target.GetName] has gone missing on the frontier. Auditors of the Court of Colonial Affairs (理藩院) trace the theft to our own resident amban there, [corrupt_official.GetName], who has grown fat diverting the funds meant for the local yamen, the tuntian granaries, and the garrison's pay.\n\nA resident commissioner is the throne's eye on the march — when he skims the very silver sent to bind the dependency, he undoes the work he was posted to do, and the frontier learns that Peking's officers are for sale. How shall we answer this?"
 qing_integ.11.a:0 "Impeach the resident, confiscate his gains, and recall him."
 qing_integ.11.a.tt:0 "Seize his ill-gotten silver (#G +¥50 treasury, +2 Stability#!, #R +3 Tyranny#!) and RECALL him to Peking in disgrace — the post falls vacant. The Court of Colonial Affairs is marked down for the graft on its watch."
 qing_integ.11.b:0 "Settle the matter quietly to avoid embarrassment."
 qing_integ.11.b.tt:0 "Pay #R ¥80#! in hush money, lose a step of integration progress, and slow all integration while the scandal festers. The amban keeps his post."
 qing_integ.11.c:0 "Institute 'nourish-honesty' stipends (yanglian yin 養廉銀)."
 qing_integ.11.c.tt:0 "Spend #R ¥120#! on Yongzheng's remedy — legitimate allowances that remove the resident's incentive to steal; our ruler gains popularity and the amban is bound to us."

# --- .12  ETHNIC STRIFE ---------------------------------------------------
 qing_integ.12.t:0 "Blood on the Frontier"
 qing_integ.12.desc:0 "As direct rule replaces the old chieftaincies in [target.GetName], Han settlers and the native peoples have fallen to open violence over land, water, and the desecration of ancestral ground.\n\nThis is the shadow of gaitu guiliu (改土归流) — the abolition of hereditary chiefs that Ortai pressed across the southwest in the 1720s, which lit the Miao Rebellion of 1795–1806 as settlers pushed the indigenous off their fields. It is the shadow of Du Wenxiu's Pingnan Guo (平南國) in the Panthay Rebellion (雲南回變, 1856–1873) and of the Dungan Revolt (陝甘回變, 1862–1877), in which some twenty-one million souls perished. The frontier waits on our word."
 # [#task-20 2026-08-04] actor-status addenda appended to the .12 desc when the local amban/garrison exist
 qing_integ.12.desc_actors_both:0 "\n\n#Y On the ground:#! the resident amban [integ_amban.GetName] is at his post, and a Beijing banner garrison stands in the province — the throne has both a voice and a sword to hand."
 qing_integ.12.desc_actors_amban:0 "\n\n#Y On the ground:#! the resident amban [integ_amban.GetName] is at his post and could mediate between the communities — but no imperial garrison stands near to enforce a settlement."
 qing_integ.12.desc_actors_garrison:0 "\n\n#Y On the ground:#! a Beijing banner garrison stands in the province and can restore order by force — but with no resident amban, there is no-one to broker a lasting peace."
 qing_integ.12.desc_actors_none:0 "\n\n#Y On the ground:#! neither a resident amban nor an imperial garrison is near — the throne must act at a distance, through the subject's own hand."
 qing_integ.12.a:0 "Bring in the Green Standard Army to restore order."
 qing_integ.12.a.tt:0 "Bring in an outside column to impose order by force: #R -3 Stability, +5 Aggressive Expansion#!, harsh unrest in the affected province, and strife that sours our subject relations. (When a #G local garrison#! is already on the spot, ordering IT out is cheaper — the other option.)"
 qing_integ.12.e:0 "Order the local garrison to separate the communities."
 qing_integ.12.e.tt:0 "Only when a #G banner garrison#! already stands in the dependency: the troops #G already there#! interpose between settlers and natives at once, with far less bloodshed than a marched-in column. #R -1 Stability#!; a dominant garrison uses minimal force (#R +2 Aggressive Expansion#!), rough parity is rougher (#R +3#!). The Ministry of War is credited."
 qing_integ.12.b:0 "Segregate settlers and natives; slow the process to keep the peace."
 qing_integ.12.b.tt:0 "Build walls and forts between the communities as after the Miao rising: lose a step of progress, gain #G +2 Stability#! and our subject's goodwill."
 qing_integ.12.c:0 "Fund resettlement and irrigation to defuse the land dispute."
 qing_integ.12.c.tt:0 "Spend #R ¥100#! to ease the land pressure and lastingly improve the affected province."
 qing_integ.12.d:0 "Let the resident amban mediate between settlers and natives."
 qing_integ.12.d.tt:0 "Only when a #G steady resident amban#! sits in the dependency: he attempts to broker a local settlement between the communities — a #Y skill check#! on his charisma and finesse (25 + twice his charisma + his finesse, bounded 10–90%).\n#G On success ([integ_amban.MakeScope.GetVariable('qing_amban_negotiate_chance_shown').GetValue|0]%)#!: the least bloody path — #G +1 Stability#!, the province eased, his standing rises (#G +5 prominence#!).\n#R On failure ([integ_amban.MakeScope.GetVariable('qing_amban_negotiate_fail_shown').GetValue|0]%)#!: the mediation collapses — #R -1 Stability#!, and he is discredited (#R -5 prominence#!). He is not executed — this is not the mortal gamble of a rebel negotiation."

# --- .20  BOUNTIFUL FRONTIER HARVEST --------------------------------------
 qing_integ.20.t:0 "A Bountiful Harvest"
 qing_integ.20.desc:0 "The military-agricultural colonies (tuntian 屯田) sown across [target.GetName] have brought in a bumper harvest. The granaries are full, the garrisons well fed, and the settlers who anchor our claim to the frontier are prospering.\n\nIt was on such colonies — soldiers, migrants, and convicts breaking new ground in Xinjiang, Mongolia, and the northeast — that Qing power on the frontier was built. A good year is a gift to be spent wisely."
 qing_integ.20.a:0 "Store the grain in the Ever-Normal Granaries (常平倉)."
 qing_integ.20.a.tt:0 "Lay up the harvest surplus as grain in the #Y Ever-Normal Granaries#! (a food reserve against future famine) and advance the integration a further step for free.\n\n#G Deposit: +150 grain#! (up to capacity)\n#Y Granary store: [Player.MakeScope.GetVariable('qing_granary_food').GetValue|0] / [Multiply_CFixedPoint( Player.MakeScope.GetVariable('qing_granary_count').GetValue, '(CFixedPoint)200')|0]#! (常平倉)"
 qing_integ.20.a2:0 "Build an Ever-Normal Granary to hold the surplus (常平倉)."
 qing_integ.20.a2.tt:0 "We hold no ever-normal granary yet. Raise a new #Y Ever-Normal Granary#! in the Yellow River heartland to hold future surpluses, and advance the integration a further step for free."
 qing_integ.20.b:0 "Invest the surplus in a new state farm and industry."
 qing_integ.20.b.tt:0 "Build an #Y Industrial Estate#! in the colony's heartland and earn our subject's goodwill."
 qing_integ.20.e:0 "Set the local garrison to work the military colonies (屯田)."
 qing_integ.20.e.tt:0 "Only when a #G banner garrison#! stands in the dependency and a granary exists to fill: the banner colonies literally #G farmed#! — with the garrison working and guarding the fields, more of the surplus reaches the store. A larger granary deposit than the civil options, the process advances a step for free, and the troops' labour credits the Ministry of War.\n\n#G Deposit: +250 grain#! (up to capacity)\n#Y Granary store: [Player.MakeScope.GetVariable('qing_granary_food').GetValue|0] / [Multiply_CFixedPoint( Player.MakeScope.GetVariable('qing_granary_count').GetValue, '(CFixedPoint)200')|0]#! (常平倉)"

# --- .21  INVESTITURE FESTIVAL / IMPERIAL FAVOUR --------------------------
 qing_integ.21.t:0 "An Auspicious Investiture"
 qing_integ.21.desc:0 "The season turns to ceremony. The nobles of [target.GetName] have come to the throne to receive crown, seal, and robes of office (冊封), binding their houses to the Great Qing with ritual and gifts.\n\nThis is the art the dynasty perfected — the investiture of tributaries, the six Southern Tours of the Qianlong Emperor (南巡, 1751–1784), the emperor honoured as a wheel-turning Buddhist king (轉輪聖王) among the frontier peoples. A well-run rite is worth an army in binding a subject's elite to us (rou yuan 柔遠)."
 qing_integ.21.a:0 "Hold the ceremony in the grandest style."
 qing_integ.21.a.tt:0 "Spend #R ¥60#!; our ruler gains #G +25 Prestige#! and the subject's elite is bound to us for years."
 qing_integ.21.b:0 "A modest rite will suffice."
 qing_integ.21.b.tt:0 "Spend nothing: gain #G +2 Stability#! and a shorter spell of our subject's goodwill."
 qing_integ.21.e:0 "Have the local garrison form the guard of honour."
 qing_integ.21.e.tt:0 "Only when a #G banner garrison#! stands in the dependency: the troops #G already there#! parade in dress array, lending martial splendour to the investiture (冊封). A show of imperial magnificence, not force — #G +5 Legitimacy#!, #G +10 ruler Popularity#!, and a long spell of the subject's goodwill. No cost; the Ministry of War is credited."

# --- Resume button (SUB_QING_subject_interactions.txt) --------------------
 QING_SUBJECT_RESUME_TT:0 "#Y Resume Integration#!\nLift the suspension and continue absorbing this governorship. Progress so far is preserved and there is no cost — the process and its events will resume.\n\n#T Progress: #Y [DiplomaticView.GetTargetCountry.MakeScope.GetVariable('SUBJ_integration_progress').GetValue|0]#! / #Y 5#!#!"

# --- Modifier names (common/modifiers/qing_integration_modifiers.txt) ------
 qing_integ_frontier_resentment:0 "Frontier Resentment"
 qing_integ_corruption_scandal:0 "Corruption Scandal"
 qing_integ_ethnic_strife:0 "Ethnic Strife on the Frontier"
 qing_integ_imperial_favor:0 "Imperial Favour"
 qing_integ_able_frontier_admin:0 "Capable Frontier Administration"
 qing_integ_able_frontier_admin_desc:0 "A competent Grand Director of the Lifan Yuan (理藩院) and able resident commissioners (駐紮大臣) on the march speed the paperwork of absorption.\n#G +15%#! integration speed."
 qing_integ_exemplary_frontier_admin:0 "Exemplary Frontier Administration"
 qing_integ_exemplary_frontier_admin_desc:0 "An exceptional Lifan Yuan Director and his ablest ambans carry the throne's will to the frontier with rare skill — the incorporation of dependencies proceeds swiftly and in good order.\n#G +30%#! integration speed, #G +5#! subject loyalty."
 qing_integ_bountiful_frontier:0 "Bountiful Frontier"
 qing_integ_bribed_official:0 "Palm Greased"
