 qing_gp_dispatch.1.t:0 "A Report from Abroad"
 qing_gp_dispatch.1.desc_success:0 "[qing_gp_dispatch_evt_diplomat.GetName], the envoy sent from the Zongli Yamen to soothe a great power's temper, has sent word: his mission has landed well. That power's tension has eased further."
 qing_gp_dispatch.1.desc_failure:0 "[qing_gp_dispatch_evt_diplomat.GetName], the envoy sent from the Zongli Yamen to soothe a great power's temper, has sent word: he stumbled in the negotiation. That power's tension has partly rebounded."
 qing_gp_dispatch.1.a:0 "Understood"
