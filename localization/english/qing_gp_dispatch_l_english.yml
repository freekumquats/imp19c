######################################################################
# qing_gp_dispatch_l_english.yml — GREAT GAME "DISPATCH A DIPLOMAT" follow-up report.
# Covers the qing_gp_dispatch.1 report event (redesigned task #10 2026-08-29: the roll is
# already resolved before it fires; desc just states which way it went, via triggered_desc
# on qing_gp_dispatch_evt_outcome — same idiom as qing_zongli_dispatch.1 and its precedent
# qing_march_unrest_outcome / qing_march.6, task #91). See se_QING_DIPLO.txt
