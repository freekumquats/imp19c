#
# [task #10 2026-08-29] Fixed loc-scope-syntax bug: a scope saved by save_scope_as is read
# BARE in loc ([X.GetName]), never with the script-only "scope:" prefix
# ([scope:X.GetName]) -- the latter rendered the literal ERROR:[scope:...] string in-game
# (the same bug class fixed on the Zongli play-dispatch report). See memory
# imp19c-loc-scope-syntax-rule.
