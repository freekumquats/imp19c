l_english:
 qing_personnel.1.t:0 "The 大計 — Great Reckoning of Officials"
 qing_personnel.1.desc:0 "The triennial 大計 (Great Reckoning) is upon us. The Grand Minister of Personnel [qing_office_personnel_holder.GetName] has compiled reports on every governor (總督/巡撫) across the realm. The able will be rewarded, the venal cashiered. How shall we conduct the review?"
 qing_personnel.1.a:0 "Conduct a rigorous 大計 under [qing_office_personnel_holder.GetName]."
 qing_personnel.1.a.tt:0 "Conduct the 大計 under a capable Personnel minister (Rigorous 大計 bonus, 3 years: civilization value +3%, cohort starting experience +10).\n#G Political Influence: +10#!\nEvery governor is scored (finesse+martial):\nIf able (score 16+): #G Popularity: +3#!, #G Prominence: +2#!, #G Loyalty: +5#!, and (this minister's strength) #G Family Prestige: +10#! as well.\nIf venal (Corrupt trait or corruption 40+): #R Loyalty: -10#!, #R Prominence: -5#!, and he is #G cleansed#! (Corrupt trait removed, #G Corruption: -20#!).\nOtherwise: noted only, no change."
 qing_personnel.1.b:0 "Conduct the 大計, but with modest outcomes."
 qing_personnel.1.b.tt:0 "Conduct the 大計 under a weaker Personnel minister.\nEvery governor is scored (finesse+martial):\nIf able (score 16+): #G Popularity: +3#!, #G Prominence: +2#!, #G Loyalty: +5#!.\nIf venal (Corrupt trait or corruption 40+): #R Loyalty: -10#!, #R Prominence: -5#!.\nOtherwise: noted only, no change."
 qing_personnel.1.c:0 "The review is perfunctory — no minister oversees it."
 qing_personnel.1.c.tt:0 "No minister oversees the review (Perfunctory 大計 malus, 3 years: happiness for same culture -2%, cohort starting experience -5).\nEvery governor's #R Loyalty: -1#!"
 
 qing_personnel.2.t:0 "Clash: [personnel_minister.GetName] vs. [clashing_governor.GetName]"
 qing_personnel.2.desc:0 "The Grand Minister of Personnel [personnel_minister.GetName] and the governor [clashing_governor.GetName] have come to loggerheads. [clashing_governor.GetName] resents the minister's oversight; [personnel_minister.GetName] questions the governor's loyalty. The court awaits our decision."
 qing_personnel.2.a:0 "Recall [clashing_governor.GetName] — appease the minister."
 qing_personnel.2.a.tt:0 "Recall the governor to appease the minister.\n[clashing_governor.GetName]'s #R Loyalty: -15#!\n#R His Prominence: -5#!\n[personnel_minister.GetName]'s #G Loyalty: +5#!\n#G His Popularity: +2#!\n#G His Prominence: +1#!\n#G Political Influence: +5#!"
 qing_personnel.2.b:0 "Indulge [clashing_governor.GetName] — preserve his service."
 qing_personnel.2.b.tt:0 "Indulge the governor; strain the minister.\n[clashing_governor.GetName]'s #G Loyalty: +3#!\n#G His Popularity: +1#!\n#G His Prominence: +1#!\n[personnel_minister.GetName]'s #R Loyalty: -5#!\nIf the minister is himself corrupt (corruption 20+): #R Corruption Level: +2#! (his authority to police it is compromised)."
 qing_personnel.2.c:0 "Balance them — both must compromise."
 qing_personnel.2.c.tt:0 "Balance them; both are discontent.\n[clashing_governor.GetName]'s #R Loyalty: -2#!\n[personnel_minister.GetName]'s #R Loyalty: -2#!\n#R Political Influence: -5#!"
 
 qing_personnel.3.t:0 "Talented Governor Identified: [talented_governor.GetName]"
 qing_personnel.3.desc:0 "The Grand Minister of Personnel [personnel_minister.GetName] has flagged [talented_governor.GetName], a provincial governor of exceptional ability, for advancement. [talented_governor.GetName] is congenial with the throne and capable. Shall we promote this talent?"
 qing_personnel.3.a:0 "Promote [talented_governor.GetName] to a great office."
 qing_personnel.3.a.tt:0 "Promote him to the first vacant great office.\n[talented_governor.GetName]'s #G Loyalty: +10#!\n[personnel_minister.GetName]'s #G Loyalty: +3#!\n#G His Popularity: +1#!\n#G His Prominence: +1#!\n#G Political Influence: +10#!\nRequires a vacant great office."
 qing_personnel.3.b:0 "Reward [talented_governor.GetName] but leave him in his post."
 qing_personnel.3.b.tt:0 "Reward him richly but leave him in his governorship.\n#R Treasury: -285#!\n[talented_governor.GetName]'s #G Loyalty: +5#!\n#G His Personal Wealth: +50#!\n#G His Family Prestige: +15#!\n[personnel_minister.GetName]'s #G Loyalty: +1#!"
 qing_personnel.3.c:0 "Decline — no action taken."
 qing_personnel.3.c.tt:0 "Decline.\n[talented_governor.GetName]'s #R Loyalty: -3#!\n[personnel_minister.GetName]'s #R Loyalty: -2#!"
 
 qing_personnel.4.t:0 "捐納 Scandal: [venal_governor.GetName]"
 qing_personnel.4.desc:0 "Word has reached the court that [venal_governor.GetName], a provincial governor, purchased his office through 捐納 (the sale of posts). The practice is widespread in corrupt times, but this case has become public. How shall we respond?"
 qing_personnel.4.a:0 "Investigate rigorously — purge corruption."
 qing_personnel.4.a.tt:0 "Investigate rigorously.\n#R Political Influence: -10#!\n[venal_governor.GetName] is cleansed: Corrupt trait removed (if held), #G his Corruption: -20#!.\n#R His Loyalty: -10#!\n#R His Prominence: -5#!\n#G Corruption Level: -5#!\nIf the Personnel minister is capable (finesse 9+): a further #G Corruption Level: -5#! (net -10), and his #G Loyalty: +3#!."
 qing_personnel.4.b:0 "Ignore the scandal — it is commonplace."
 qing_personnel.4.b.tt:0 "Ignore the scandal.\n[venal_governor.GetName]'s #G Loyalty: +2#!\n#R Corruption Level: +5#!\nIf a Personnel minister holds office: his #R Loyalty: -3#! (demoralized by the inaction)."
 qing_personnel.4.c:0 "Make an example — execute [venal_governor.GetName]."
 qing_personnel.4.c.tt:0 "Make an example: execute him.\n[venal_governor.GetName] is put to death.\n#G Corruption Level: -8#!\n#R Tyranny: +5#!\nEvery corrupt official's #R Loyalty: -3#! (the purge breeds fear)."
 
 qing_personnel_daji_rigorous:0 "Rigorous 大計"
 qing_personnel_daji_rigorous_desc:0 "The realm benefits from the Personnel minister's thorough evaluation of provincial officials."
 qing_personnel_daji_perfunctory:0 "Perfunctory 大計"
 qing_personnel_daji_perfunctory_desc:0 "Without a Personnel minister, the Great Reckoning was merely a formality. Officials drift."
