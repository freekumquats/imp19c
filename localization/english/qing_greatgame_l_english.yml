l_english:
 qing_greatgame.1.t:0 "A Great Power Overture"
 qing_greatgame.1.desc:0 "A foreign power whose enmity toward the Qing has grown elevated now presses the throne — a frontier concession, a trade privilege, a diplomatic slight redressed. The Zongli Yamen (總理衙門) must mediate the demand."
 qing_greatgame.1.a:0 "Play the rivals against it (以夷制夷)"
 qing_greatgame.1.a.tt:0 "Play the pressing power's rivals against it (以夷制夷).\n#R Ruler's Prestige: -8#!\n#G Pressing Power's Tension: -12#!\n#G Aggressive Expansion: -2#!\n#G Pressing Power's Opinion: +25 (Accommodation)#!\n#G Pressing Power's Opinion: +10 (Improved Relations)#!\n#R Its Two Rivals' Opinion: -15 each (Partisan)#!\n#R Its Two Rivals' Tension: +3 each#!\nThe Zongli holder's finesse is vindicated: #G His Popularity: +3#!, #G His Prominence: +2#!. If his affinity for the throne runs high enough, his loyalty may deepen (Congenial, +14)."
 qing_greatgame.1.b:0 "Concede the demand"
 qing_greatgame.1.b.tt:0 "Concede the demand and buy peace.\n#R Treasury: -60#!\n#R Ruler's Prestige: -12#!\n#G Pressing Power's Tension: -15#!\n#G Aggressive Expansion: -2#!\n#G Pressing Power's Opinion: +25 (Accommodation)#!\n#G Pressing Power's Opinion: +10 (Improved Relations)#!"
 qing_greatgame.1.c:0 "Stand firm — refuse"
 qing_greatgame.1.c.tt:0 "Stand firm and refuse the demand.\n#G Ruler's Prestige: +10#!\n#R Pressing Power's Tension: +8#!"
 qing_greatgame.2.t:0 "The Powers Coordinate"
 qing_greatgame.2.desc:0 "When multiple great powers sense a common opportunity, they press together — a coordinated threat harder to deflect. The Zongli Yamen (總理衙門) must navigate the entente."
 qing_greatgame.2.a:0 "Divide them (以夷制夷)"
 qing_greatgame.2.a.tt:0 "Divide the coordinated powers (以夷制夷 at full strength).\n#R Ruler's Prestige: -10#!\n#G Britain's Tension: -10#!\n#G Britain's Opinion: +25 (Accommodation)#!\n#G Britain's Opinion: +10 (Improved Relations)#!\n#G France's Tension: -10#!\n#G France's Opinion: +25 (Accommodation)#!\n#G France's Opinion: +10 (Improved Relations)#!\n#G Aggressive Expansion: -4#!\n#R Russia's Tension: +6#!\nThe Zongli holder's coup is rewarded: #G His Popularity: +6#!, #G His Prominence: +4#!. If his affinity for the throne runs high enough, his loyalty may deepen (Congenial, +14)."
 qing_greatgame.2.b:0 "Buy them off"
 qing_greatgame.2.b.tt:0 "Buy off all three powers.\n#R Treasury: -120#!\n#R Ruler's Prestige: -15#!\n#G Britain's Tension: -12#!\n#G Britain's Opinion: +25 (Accommodation)#!\n#G Britain's Opinion: +10 (Improved Relations)#!\n#G France's Tension: -12#!\n#G France's Opinion: +25 (Accommodation)#!\n#G France's Opinion: +10 (Improved Relations)#!\n#G Russia's Tension: -12#!\n#G Russia's Opinion: +25 (Accommodation)#!\n#G Russia's Opinion: +10 (Improved Relations)#!\n#G Aggressive Expansion: -6#!"
 qing_greatgame.2.c:0 "Weather the storm"
 qing_greatgame.2.c.tt:0 "Weather the storm and refuse.\n#G Ruler's Prestige: +12#!\n#R Britain's Tension: +6#!\n#R France's Tension: +6#!\n#R Russia's Tension: +6#!"
 qing_greatgame.3.t:0 "A Diplomatic Coup"
 qing_greatgame.3.desc:0 "The Zongli holder has engineered a breakthrough — a treaty that meaningfully settles a frontier with one of the great powers. The court debates whether to applaud or temper the achievement."
 qing_greatgame.3.a:0 "Applaud the coup"
 qing_greatgame.3.a.tt:0 "Applaud the coup and endorse the settlement.\n#G Ruler's Prestige: +10#!\n#G Settled Power's Tension: -20#!\n#G Aggressive Expansion: -2#!\n#G Settled Power's Opinion: +25 (Accommodation)#!\n#G Settled Power's Opinion: +10 (Improved Relations)#!\nThe Zongli holder is honoured: #G His Prestige: +15#!, #G His Popularity: +8#!, #G His Prominence: +5#!. If his affinity for the throne runs high enough, his loyalty may deepen (Congenial, +14)."
 qing_greatgame.3.b:0 "Temper the achievement"
 qing_greatgame.3.b.tt:0 "Temper the achievement — accept without applause.\n#G Settled Power's Tension: -15#!\n#G Aggressive Expansion: -2#!\n#G Settled Power's Opinion: +25 (Accommodation)#!\n#G Settled Power's Opinion: +10 (Improved Relations)#!\nThe Zongli holder's role: #G His Popularity: +4#!, #G His Prominence: +2#!."
 GREAT_GAME_PANEL_TITLE:0 "The Great Game (以夷制夷)"
 GREAT_GAME_PANEL_DESC:0 "The throne's dashboard for playing the great powers against each other. Each power's tension with the Qing, their standing, and the Zongli Yamen's (總理衙門) mediation."
 GREAT_GAME_BRITAIN_TITLE:0 "Britain"
 GREAT_GAME_FRANCE_TITLE:0 "France"
 GREAT_GAME_RUSSIA_TITLE:0 "Russia"
 GREAT_GAME_TENSION_LABEL:0 "Tension:"
 GREAT_GAME_TENSION_TT:0 "Great-power tension with the Qing (0..100). High tension = the power's enmity is felt in-game (rivalry modifier, closed advisor offers, predatory diplomatic plays)."
 GREAT_GAME_STANDING_LABEL:0 "Standing:"
 GREAT_GAME_STANDING_TT:0 "The power's opinion of the Qing — the core relations value every diplomatic action reads."
 GREAT_GAME_ZONGLI_TITLE:0 "Zongli Yamen (總理衙門)"
 GREAT_GAME_ZONGLI_DESC:0 "The proto-foreign-ministry founded 1861. The holder's skill/loyalty GATES the outcomes+costs of foreign-affairs events; a capable holder dampens GP tension, a vacant office = drift."
 GREAT_GAME_ZONGLI_VACANT:0 "Vacant — foreign affairs drift"
 GREAT_GAME_OPEN_BUTTON_TT:0 "Open the Great Game panel"
