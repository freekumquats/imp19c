l_english:
 qing_greatgame.1.t:0 "A Great Power Overture"
 qing_greatgame.1.desc:0 "A foreign power whose enmity toward the Qing has grown elevated now presses the throne — a frontier concession, a trade privilege, a diplomatic slight redressed. The Zongli Yamen (總理衙門) must mediate the demand."
 qing_greatgame.1.a:0 "Play the rivals against it (以夷制夷)"
 qing_greatgame.1.a.tt:0 "Play the pressing power's rivals against it (以夷制夷).\n#R Ruler's Prestige: -8#!\n#G Pressing Power's Tension: -12#!\n#G Aggressive Expansion: -2#!\n#G Pressing Power's Opinion: +25 (Accommodation)#!\n#G Pressing Power's Opinion: +10 (Improved Relations)#!\n#R Its Two Rivals' Opinion: -15 each (Partisan)#!\n#R Its Two Rivals' Tension: +3 each#!\nThe Zongli holder's finesse is vindicated: #G His Popularity: +3#!, #G His Prominence: +2#!. If his affinity for the throne runs high enough, his loyalty may deepen (Congenial, +10)."
 qing_greatgame.1.b:0 "Concede the demand"
 qing_greatgame.1.b.tt:0 "Concede the demand and buy peace.\n#R Treasury: -310#!\n#R Ruler's Prestige: -12#!\n#G Pressing Power's Tension: -15#!\n#G Aggressive Expansion: -2#!\n#G Pressing Power's Opinion: +25 (Accommodation)#!\n#G Pressing Power's Opinion: +10 (Improved Relations)#!"
 qing_greatgame.1.c:0 "Stand firm — refuse"
 qing_greatgame.1.c.tt:0 "Stand firm and refuse the demand.\n#G Ruler's Prestige: +10#!\n#R Pressing Power's Tension: +8#!"
 qing_greatgame.2.t:0 "The Powers Coordinate"
 qing_greatgame.2.desc:0 "When multiple great powers sense a common opportunity, they press together — a coordinated threat harder to deflect. The Zongli Yamen (總理衙門) must navigate the entente."
 qing_greatgame.2.a:0 "Divide them (以夷制夷)"
 qing_greatgame.2.a.tt:0 "Divide the coordinated powers (以夷制夷 at full strength).\n#R Ruler's Prestige: -10#!\n#G Britain's Tension: -10#!\n#G Britain's Opinion: +25 (Accommodation)#!\n#G Britain's Opinion: +10 (Improved Relations)#!\n#G France's Tension: -10#!\n#G France's Opinion: +25 (Accommodation)#!\n#G France's Opinion: +10 (Improved Relations)#!\n#G Aggressive Expansion: -4#!\n#R Russia's Tension: +6#!\nThe Zongli holder's coup is rewarded: #G His Popularity: +6#!, #G His Prominence: +4#!. If his affinity for the throne runs high enough, his loyalty may deepen (Congenial, +10)."
 qing_greatgame.2.b:0 "Buy them off"
 qing_greatgame.2.b.tt:0 "Buy off all three powers.\n#R Treasury: -440#!\n#R Ruler's Prestige: -15#!\n#G Britain's Tension: -12#!\n#G Britain's Opinion: +25 (Accommodation)#!\n#G Britain's Opinion: +10 (Improved Relations)#!\n#G France's Tension: -12#!\n#G France's Opinion: +25 (Accommodation)#!\n#G France's Opinion: +10 (Improved Relations)#!\n#G Russia's Tension: -12#!\n#G Russia's Opinion: +25 (Accommodation)#!\n#G Russia's Opinion: +10 (Improved Relations)#!\n#G Aggressive Expansion: -6#!"
 qing_greatgame.2.c:0 "Weather the storm"
 qing_greatgame.2.c.tt:0 "Weather the storm and refuse.\n#G Ruler's Prestige: +12#!\n#R Britain's Tension: +6#!\n#R France's Tension: +6#!\n#R Russia's Tension: +6#!"
 qing_greatgame.3.t:0 "A Diplomatic Coup"
 qing_greatgame.3.desc:0 "The Zongli holder has engineered a breakthrough — a treaty that meaningfully settles a frontier with one of the great powers. The court debates whether to applaud or temper the achievement."
 qing_greatgame.3.a:0 "Applaud the coup"
 qing_greatgame.3.a.tt:0 "Applaud the coup and endorse the settlement.\n#G Ruler's Prestige: +10#!\n#G Settled Power's Tension: -20#!\n#G Aggressive Expansion: -2#!\n#G Settled Power's Opinion: +25 (Accommodation)#!\n#G Settled Power's Opinion: +10 (Improved Relations)#!\nThe Zongli holder is honoured: #G His Popularity: +23#!, #G His Prominence: +5#!. If his affinity for the throne runs high enough, his loyalty may deepen (Congenial, +10)."
 qing_greatgame.3.b:0 "Temper the achievement"
 qing_greatgame.3.b.tt:0 "Temper the achievement — accept without applause.\n#G Settled Power's Tension: -15#!\n#G Aggressive Expansion: -2#!\n#G Settled Power's Opinion: +25 (Accommodation)#!\n#G Settled Power's Opinion: +10 (Improved Relations)#!\nThe Zongli holder's role: #G His Popularity: +4#!, #G His Prominence: +2#!."
 qing_greatgame.4.t:0 "An Exchange of Legations (互派使節)"
 qing_greatgame.4.desc:0 "Tension with one of the great powers has cooled into a workable détente. The Zongli Yamen (總理衙門) proposes what the court refused at Macartney and Amherst: an exchange of resident legations, a permanent Qing embassy (使館) seated in the power's capital and its envoy received in Peking. It is the Westphalian institution the reformers have long urged — and the tribute-world conservatives have long dreaded."
 qing_greatgame.4.a:0 "Exchange legations (互派使節)"
 qing_greatgame.4.a.tt:0 "Open a resident Qing legation (使館) in the power's capital.\n#G Diplomatic Reputation: +2#!\n#G Political Influence/month: +0.05#! (Embassy Representation, standing)\n#G The Power's Tension: -12#!\n#G Aggressive Expansion: -2#!\n#G The Power's Opinion: +25 (Accommodation)#!\n#G The Power's Opinion: +10 (Improved Relations)#!\n#R Reform Pressure: +3#! (accepting resident foreign diplomacy breaks the tribute worldview)\nThe Zongli holder's standing grows: #G His Popularity: +5#!, #G His Prominence: +3#!."
 qing_greatgame.4.b:0 "Hold to the tribute forms (守朝貢舊制)"
 qing_greatgame.4.b.tt:0 "Decline the resident legation and keep the old ceremonial distance.\n#G Reform Pressure: -3#!\n#G Legitimacy: +6#!\nNo legation is opened and the détente does not advance."
 qing_greatgame.5.t:0 "The Guest Becomes the Host (反客為主)"
 qing_greatgame.5.desc:0 "The throne stands strong and a great power that long pressed the Qing now finds the tables turned. The court weighs an unheard-of stroke: to force upon that power's OWN coast the very instrument of the unequal treaties — a commercial concession port, dictated by Peking. The mandarins savour the reversal (反客為主, 'the guest becomes the host'); the cautious counsel magnanimity."
 qing_greatgame.5.a:0 "Dictate the concession (反客為主)"
 qing_greatgame.5.a.tt:0 "Force a treaty-port concession onto the power's own coast.\n#G Diplomatic Reputation: +1#!\n#G Commerce: +5%#!\n#G Political Influence/month: +0.03#! (Treaty-Port Concession, standing)\nThe power bears the humiliation: its #R Diplomatic Reputation: -1#!, #R Unrest: +0.5#! (standing).\n#G Ruler's Popularity: +20#!\n#G Legitimacy: +8#!\n#R The Coerced Power's Tension: +12#!"
 qing_greatgame.5.b:0 "Stay the hand (以德服人)"
 qing_greatgame.5.b.tt:0 "Forgo the coercion and style it magnanimity (以德服人, 'win men by virtue').\n#G Legitimacy: +4#!\n#G The Power's Tension: -6#!\nNo concession is taken, but no fresh enmity is earned."
 GREAT_GAME_PANEL_TITLE:0 "The Great Game (以夷制夷)"
 GREAT_GAME_PANEL_DESC:0 "The throne's dashboard for playing the great powers against each other. Each power's tension with the Qing, their standing, and the Zongli Yamen's (總理衙門) mediation."
 GREAT_GAME_COURTING_TITLE:0 "Courting the Powers (以夷制夷)"
 GREAT_GAME_BRITAIN_TITLE:0 "Britain"
 GREAT_GAME_FRANCE_TITLE:0 "France"
 GREAT_GAME_RUSSIA_TITLE:0 "Russia"
 GREAT_GAME_TENSION_LABEL:0 "Tension:"
 GREAT_GAME_TENSION_TT:0 "Great-power tension with the Qing (0..100). High tension = the power's enmity is felt in-game (rivalry modifier, closed advisor offers, predatory diplomatic plays)."
 GREAT_GAME_STANDING_LABEL:0 "Standing:"
 GREAT_GAME_STANDING_TT:0 "The power's opinion of the Qing — the core relations value every diplomatic action reads."
 GREAT_GAME_ZONGLI_TITLE:0 "Zongli Yamen (總理衙門)"
 GREAT_GAME_ZONGLI_DESC:0 "The proto-foreign-ministry founded 1861. The holder's skill/loyalty GATES the outcomes+costs of foreign-affairs events; a capable holder dampens GP tension, a vacant office = drift."
 GREAT_GAME_ZONGLI_VACANT:0 "Vacant — foreign affairs drift"
 QING_GG_DISPATCH_DIPLOMAT_BTN:0 "Dispatch a Diplomat (遣使)"
 QING_GG_DISPATCH_DIPLOMAT_TT:0 "#Y Dispatch a Zongli Yamen envoy (遣使) to soothe this power#!\nSends the ablest AVAILABLE envoy from your foreign-service corps: #G eases this power's tension, scaled by his charisma (a gifted envoy eases it more; a weak one, less)#!, and #G wins a measure of goodwill#!. It does #Y not#! erase the tension — repeated missions ease it down over time. A follow-up report from the field 20-40 days later either reinforces or partly undoes the easing, again weighing his charisma. Unlike courting a power, this is quiet bilateral diplomacy and does #G not#! offend the other powers.\n\nRequires #G a serving, AVAILABLE diplomat in the Zongli corps#! (not already dispatched to a play or another mission) and #Y 15 political influence#!; one mission per power per month."
 GREAT_GAME_OPEN_BUTTON_TT:0 "Open the Great Game panel"
 QING_GREAT_GAME_INLINE_HEADER:0 "Great Game — Rivalry with this Power"
 QING_GREAT_GAME_TAB_TITLE:0 "The Great Game"
 QING_GREAT_GAME_TAB_BUTTON:0 "Great Game"
 QING_GREAT_GAME_SELF_TITLE:0 "Great Qing (你的帝国)"
 QING_SPHERE_INLINE_TALLY:0 "Contested Marches — China #G [Player.MakeScope.GetVariable('qing_sphere_china_count').GetValue|0]#! · Britain #R [Player.MakeScope.GetVariable('qing_sphere_britain_count').GetValue|0]#! · France #R [Player.MakeScope.GetVariable('qing_sphere_france_count').GetValue|0]#! · Russia #R [Player.MakeScope.GetVariable('qing_sphere_russia_count').GetValue|0]#! · Neutral [Player.MakeScope.GetVariable('qing_sphere_neutral_count').GetValue|0]"
 QING_SPHERE_INLINE_TALLY_TT:0 "The Great Game for the empire's frontier marches. Each contested border state and every state held by a Qing subject is fought over by four powers — China, Britain, France, Russia — whose influence rises and falls each year. The tally shows how many marches each power currently dominates. China loses ground where a rival's pull outweighs the throne's; winning a march back eases that rival's rivalry, losing one inflames it."
