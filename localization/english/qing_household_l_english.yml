l_english:
 qing_household.1.t:0 "The Privy Purse Runs Low"
 qing_household.1.desc:0 "The 內帑 — the emperor's private treasury — is nearly empty. Distinct from the state's 戶部 coffers, the privy purse is [ROOT.GetRuler.GetName]'s personal reserve, to be drawn upon in crisis or to fund the imperial household's establishment. The Grand Secretary of the Imperial Household reports that it must be replenished soon, or the throne will have no private cushion when the state's own treasury falters."
 qing_household.1.a:0 "Divert state funds to the privy purse."
 qing_household.1.a.tt:0 "Divert state funds to the privy purse.\n#R Treasury: -150#!\n#G Privy Purse: +20#!"
 qing_household.1.b:0 "Levy a 'donation' from the grandees."
 qing_household.1.b.tt:0 "The great families are asked to contribute.\n#G Privy Purse: +15#!\n#R Prestige: -50#!"
 qing_household.1.c:0 "Let it drain. We shall manage without."
 qing_household.1.c.tt:0 "Let it drain — the throne's private reserve dwindles.\n#R Privy Purse: -10#!"

 qing_household.2.t:0 "The Eunuch Faction Ascends"
 qing_household.2.desc:0 "The 太監 — the palace eunuchs — were tightly checked by the Qing founders, who remembered how eunuch power had brought down the Ming. But now [scope:eunuch_leader.GetName] has amassed a dangerous faction within the palace walls. He commands loyal retainers, dispenses patronage, and whispers counsel into the sovereign's ear. The Grand Secretary of the Imperial Household has lost control of the eunuchs; the throne must act before the faction grows more powerful still."
 qing_household.2.a:0 "Check him hard. Strip his power and scatter his faction."
 qing_household.2.a.tt:0 "The Qing way: [scope:eunuch_leader.GetName] is stripped of his power and his faction is broken.\n#R His Loyal Veterans: -3#!\n#R His Wealth: -£50#!\n#G His Corruption: -20#!\n#G Corruption Level (empire-wide): -3#!"
 qing_household.2.b:0 "Indulge him. Buy his compliance with silver and favour."
 qing_household.2.b.tt:0 "[scope:eunuch_leader.GetName] is enriched and his compliance bought.\n#G His Wealth: +£80#!\n#R His Corruption: +10#!\n#R Corruption Level (empire-wide): +2#!"
 qing_household.2.c:0 "Co-opt him as the throne's private instrument."
 qing_household.2.c.tt:0 "[scope:eunuch_leader.GetName] becomes the emperor's personal agent.\n#G His Loyal Veterans: +2#!\n#G His Loyalty: +20#!\nIf the Grand Secretary is in office and not already his rival: the two become rivals, and their friction will poison the household."

 qing_household.3.t:0 "The Imperial Workshops Await Commission"
 qing_household.3.desc:0 "The 造辦處 — the imperial workshops — stand ready to craft a great work. Under the able direction of the Grand Secretary [scope:grand_sec.GetName], the artisans can produce a luxury commission that will elevate the throne's prestige across the realm. But such a project demands silver and the Grand Secretary's personal touch; a lesser work is also possible, or the workshops may be left idle."
 qing_household.3.a:0 "Commission a great work of luxury."
 qing_household.3.a.tt:0 "Commission a great work of luxury.\n#R Treasury: -200#!\n#G Prestige: +150#!\n(Imperial Workshops Flourish, 5 years: monthly prestige +0.10, all power costs -5%)"
 qing_household.3.b:0 "A modest commission will suffice."
 qing_household.3.b.tt:0 "A modest commission will suffice.\n#R Treasury: -80#!\n#G Prestige: +60#!\n(Imperial Workshops Flourish, 5 years: monthly prestige +0.10, all power costs -5%)"
 qing_household.3.c:0 "Leave the workshops idle for now."
 qing_household.3.c.tt:0 "No cost, no gain. The artisans wait."

 qing_household.4.t:0 "The Grand Secretary's Corruption"
 qing_household.4.desc:0 "Scandal rocks the Imperial Household: the Grand Secretary [scope:grand_sec.GetName], the man closest to the throne, has turned venal. Reports of diverted silver, sold appointments, and personal enrichment at the expense of the 內帑 reach [ROOT.GetRuler.GetName]. The court whispers of a Heshen in the making — a trusted minister grown corrupt. The throne must act: dismiss him and weather the effectiveness blow, demand restitution and risk his loyalty, or tolerate the rot and watch corruption deepen."
 qing_household.4.a:0 "Dismiss him. The office must be clean."
 qing_household.4.a.tt:0 "[scope:grand_sec.GetName] is dismissed; the Grand Secretary's seat falls vacant.\n#R His Loyal Veterans: -4#!\n#G Corruption Level (empire-wide): -5#!\nCouncil effectiveness suffers until the office is refilled."
 qing_household.4.b:0 "Demand restitution. He stays, but pays."
 qing_household.4.b.tt:0 "The throne seizes gold from [scope:grand_sec.GetName].\n#G Treasury: +100#!\n#R His Loyalty: -20#!\n#G His Corruption: -10#!"
 qing_household.4.c:0 "Tolerate it. He is too useful to lose."
 qing_household.4.c.tt:0 "The scandal is ignored — the Heshen path.\n#R Corruption Level (empire-wide): +3#!\n#R His Corruption: +10#!\n#R His Wealth: +£50#!"

 qing_household_workshop_flourish:0 "Imperial Workshops Flourish"
 qing_household_workshop_flourish_desc:0 "The 造辦處 have completed a great commission. The throne's prestige shines."
