l_english:
 qing_censorate.1.t:0 "A Censor's Impeachment Memorial"
 qing_censorate.1.desc:0 "The Grand Inspector of the Censorate, [qing_censorate_target.GetName], has laid a memorial before the throne impeaching [qing_censorate_target.GetName], accusing the official of venality and disloyalty. The memorial is detailed and damning — [qing_censorate_target.GetName]'s corruption is [qing_censorate_target.GetCorruption], and the court whispers of embezzlement and abuse. The censor and the accused have clashed before, making this impeachment sharper still. How shall the throne respond?"
 qing_censorate.1.a:0 "Uphold the impeachment. [qing_censorate_target.GetName] is disgraced."
 qing_censorate.1.a.tt:0 "The accused is cleansed and, if he holds a great office, stripped of it. The censorate is emboldened.\n[qing_censorate_target.GetName]'s #G Corruption: -20#!\n[qing_censorate_target.GetName]'s #R Loyalty: -40#!\n[qing_censorate_target.GetName]'s #R Popularity: -20#!\n#G Corruption: -6#!\n#G Stability: +1#!\n#G Country Modifier: Vigilant Censorate (Monthly Political Influence: +5%, Unrest: -0.5, 5 years)#!"
 qing_censorate.1.b:0 "Exonerate [qing_censorate_target.GetName]; the censor oversteps."
 qing_censorate.1.b.tt:0 "The accused is indulged, the censor estranged.\n[qing_censorate_target.GetName]'s #G Loyalty: +20#!\n[qing_censorate_target.GetName]'s #G Popularity: +10#!\n[censor_holder.GetName]'s #R Loyalty: -16#!\n[censor_holder.GetName]'s #R Popularity: -15#!\n#R Corruption: +3#!\n#R Tyranny: +2#!"
 qing_censorate.1.c:0 "Suppress the memorial. Punish the censor for insolence."
 qing_censorate.1.c.tt:0 "The censor is disgraced and removed from office; the censorate is cowed.\n[censor_holder.GetName]'s #R Loyalty: -40#!\n[censor_holder.GetName]'s #R Popularity: -30#!\n#R Corruption: +5#!\n#R Tyranny: +3#!\n#R Country Modifier: Cowed Censorate (Monthly Corruption: +5%, Unrest: +1, Monthly Political Influence: -5%, 5 years)#!"

 qing_censorate.2.t:0 "Remonstrance Against the Throne"
 qing_censorate.2.desc:0 "The Grand Inspector [qing_censorate_target.GetName] has submitted a memorial criticizing not a courtier, but imperial policy itself. The censor argues that the realm's corruption and misgovernment stem from the throne's own decisions, and that reform is overdue. It is a bold remonstrance — the duty of a言官, but also lèse-majesté if the emperor chooses to take it so. How shall the throne respond?"
 qing_censorate.2.a:0 "Heed the remonstrance. Reform is needed."
 qing_censorate.2.a.tt:0 "The censor is praised for his candour.\n#G Legitimacy: +5#!\n#G Reform Pressure: -5#!\n[censor_holder.GetName]'s #G Loyalty: +12#!\n[censor_holder.GetName]'s #G Popularity: +20#!\n[censor_holder.GetName]'s #G Popularity: +10#!\n[censor_holder.GetName]'s #G Prominence: +8#!\n#G Stability: +1#!"
 qing_censorate.2.b:0 "Rebuke the censor privately; the throne is not to be lectured."
 qing_censorate.2.b.tt:0 "The censor is estranged.\n[censor_holder.GetName]'s #R Loyalty: -16#!\n[censor_holder.GetName]'s #R Popularity: -10#!\n#R Tyranny: +1#!"
 qing_censorate.2.c:0 "Punish the censor for lèse-majesté."
 qing_censorate.2.c.tt:0 "The censor is disgraced, removed from office, and tainted with corruption himself; the censorate is cowed for a generation.\n[censor_holder.GetName]'s #R Loyalty: -40#!\n[censor_holder.GetName]'s #R Popularity: -25#!\n[censor_holder.GetName]'s #R Corruption: +20#!\n#R Corruption: +5#!\n#R Tyranny: +5#!\n#R Country Modifier: Cowed Censorate (Monthly Corruption: +5%, Unrest: +1, Monthly Political Influence: -5%, 10 years)#!"

 qing_censorate.3.t:0 "A Factional Network Exposed"
 qing_censorate.3.desc:0 "The censorate's investigation has uncovered a factional network of corrupt officials — a clique that has enriched itself at the state's expense. [qing_censorate_target.GetName] has laid the evidence before the throne: embezzlement, kickbacks, and patronage spread across the bureaucracy. The censor urges decisive action. How shall the throne respond?"
 qing_censorate.3.a:0 "Purge the network. Root out the corruption."
 qing_censorate.3.a.tt:0 "The network is purged. The censor is praised, and the censorate is emboldened.\n#G Corruption: -10#!\n#R Tyranny: +3#!\n#R Stability: -1#!\n[censor_holder.GetName]'s #G Loyalty: +12#!\n[censor_holder.GetName]'s #G Popularity: +15#!\n#G Country Modifier: Vigilant Censorate (Monthly Political Influence: +5%, Unrest: -0.5, 5 years)#!"
 qing_censorate.3.b:0 "Investigate further. Gather more evidence."
 qing_censorate.3.b.tt:0 "No action yet, but the inquiry itself eases pressure.\n#G Corruption: -3#!\n#G Reform Pressure: -2#!"
 qing_censorate.3.c:0 "Let it lie. The disruption would be too great."
 qing_censorate.3.c.tt:0 "The network survives; the censor is estranged at being overruled.\n#R Corruption: +5#!\n[censor_holder.GetName]'s #R Loyalty: -16#!\n[censor_holder.GetName]'s #R Popularity: -10#!"

 qing_censorate.4.t:0 "The Censorate Captured"
 qing_censorate.4.desc:0 "The censorate itself has been captured by a faction. What began as anti-corruption work has become a weapon for factional purges — [qing_censorate_target.GetName] is wielding the censorate's authority to destroy rivals under the guise of rooting out venality. The court knows it; the throne knows it. The censorate, meant to be the dynasty's check on corruption, has become its tool. How shall the throne respond?"
 qing_censorate.4.a:0 "Break the captured censorate. Dismiss [qing_censorate_target.GetName]."
 qing_censorate.4.a.tt:0 "The censor is disgraced and removed from office; the captured censorate is broken.\n[censor_holder.GetName]'s #R Loyalty: -40#!\n[censor_holder.GetName]'s #R Popularity: -30#!\n#G Corruption: -8#!\n#R Tyranny: +4#!\n#R Stability: -1#!"
 qing_censorate.4.b:0 "Let the purge proceed. One faction will be destroyed."
 qing_censorate.4.b.tt:0 "The purge runs its course; the censor is indulged, and the censorate remains captured.\n#R Corruption: +3#!\n#R Tyranny: +6#!\n#R Stability: -2#!\n[censor_holder.GetName]'s #G Loyalty: +20#!\n[censor_holder.GetName]'s #G Popularity: +20#!\n#R Country Modifier: Captured Censorate (Monthly Tyranny: +5%, State Loyalty: -3%/mo, Monthly Political Influence: -5%, 10 years)#!"
 qing_censorate.4.c:0 "Dissolve the censorate entirely. The institution is irredeemable."
 qing_censorate.4.c.tt:0 "The censor is removed and the office permanently vacated — no successor will be seated.\n[censor_holder.GetName]'s #R Loyalty: -40#!\n#R Corruption: +10#!\n#R Tyranny: +10#!\n#R Stability: -3#!\n#R Country Modifier: Censorate Dissolved (Monthly Corruption: +10%, Unrest: +2, Legitimacy: -5%/mo, Monthly Political Influence: -10%, 20 years)#!"

 qing_censorate_cowed:0 "Censorate Cowed"
 qing_censorate_cowed_desc:0 "The censorate has been chastened by the throne's punishment of a censor. Oversight is chilled, and corruption festers unchecked."
 qing_censorate_captured:0 "Censorate Captured"
 qing_censorate_captured_desc:0 "The censorate has been weaponized for factional purges dressed as anti-corruption. It is no longer a check on venality, but a tool of tyranny."
 qing_censorate_dissolved:0 "Censorate Dissolved"
 qing_censorate_dissolved_desc:0 "The censorate has been dissolved by imperial decree. The last internal check on corruption is gone, and the realm knows it."
