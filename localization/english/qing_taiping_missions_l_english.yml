l_english:

 # ====================================================================
 # THE HEAVENLY KINGDOM — Christian-path mission tree (qing_taiping_missions.txt).
 # Task #14. The hardest, most heterodox road: the alternate history in which the
 # throne joins the Taiping faith rather than breaking it, and founds a Heavenly
 # Kingdom of Great Peace (太平天國) in earnest — the fourth golden-age end-state,
 # a Christian theocracy. Gated behind the Taiping overture. Task title = task
 # key; description = <key>_DESC. Sources: Spence, God's Chinese Son; Cambridge
 # History of China v.10; Hong Rengan's 資政新篇.
 # ====================================================================

 qing_heavenly_kingdom_mission:0 "The Heavenly Kingdom (天國)"
 qing_heavenly_kingdom_mission_DESCRIPTION:0 "History says the God Worshippers were heretics to be exterminated, and that Zeng Guofan's armies did the exterminating. But what if the throne had not fought the new faith — but taken it up? What if the Heavenly Kingdom of Great Peace were founded not at rebel Nanjing but at the heart of the realm? It is heresy, revolution and salvation in one, and the narrowest road of all: to remake China around an imported and radicalised Christianity, with the Western powers as our sponsors, and become something the world has never seen."
 qing_heavenly_kingdom_mission_CRITERIA_DESCRIPTION:0 "This enterprise is complete when the Taiping Heavenly Kingdom has been crushed and the Mandate secured against the rebellion."
 qing_heavenly_kingdom_mission_REWARD_DESCRIPTION:0 "Completing every objective in this tree grants its capstone reward."
 qing_heavenly_kingdom_mission_BUTTON_TOOLTIP:0 "Open this mission tree."

 # --- root: treat with the God Worshippers ---------------------------
 qing_hk_channel:0 "Treat with the God-Worshipping Society (拜上帝會)"
 qing_hk_channel_DESC:0 "Open a true channel to the movement of Hong Xiuquan (洪秀全) rather than fighting it to the death. Hear their preachers; take the measure of their fierce, austere faith. A door that history slammed shut is here left ajar."
 qing_hk_channel_tt:0 "Set out on the Christian road: #G advance the Taiping path and ease the sects#!."

 # --- western backing ------------------------------------------------
 qing_hk_western_backing:0 "Court Western Backing (missionaries and arms)"
 qing_hk_western_backing_DESC:0 "The powers that officered the Ever-Victorious Army against the Taiping can be courted the other way — as sponsors of a Christian China. Missionaries, arms, and recognition flow to a throne willing to embrace the cross."
 qing_hk_western_backing_tt:0 "#R Costs ¥90#!: #G strongly advance the Christian path#!, though foreign entanglement #R feeds the wider reform crisis#!."

 # --- heavenly doctrine ----------------------------------------------
 qing_hk_doctrine:0 "Propagate the Heavenly Doctrine (資政新篇)"
 qing_hk_doctrine_DESC:0 "Spread the syncretic Christian teaching and Hong Rengan's reformist programme, the New Treatise on Aids to Administration (資政新篇) — banks, railways, newspapers, and one God — through the realm. The conversion of China's heart, not merely its government."
 qing_hk_doctrine_tt:0 "#G Strongly advance the Christian path#! — but heterodoxy #R is destabilising before it is triumphant (-1 Stability)#!. Requires the path already begun."

 # --- heavenly capital -----------------------------------------------
 qing_hk_heavenly_capital:0 "Consecrate the Heavenly Capital (天京)"
 qing_hk_heavenly_capital_DESC:0 "Raise a capital of the new order and put the God Worshippers' iron discipline — opium and foot-binding banned, granaries shared, the sexes drilled apart — into the machinery of state. The Heavenly Kingdom takes visible, earthly form."
 qing_hk_heavenly_capital_tt:0 "#R Costs ¥80#!: #G advance the Christian path toward its apex#!; the transformation is turbulent #R (-1 Stability, the Taiping ferment grips the land)#!. Requires the path well advanced."

 # --- capstone: proclaim the Heavenly Kingdom ------------------------
 qing_hk_proclaim:0 "Proclaim the Heavenly Kingdom (天國)"
 qing_hk_proclaim_DESC:0 "The capstone, and the rarest fate in all the realm's possible histories: proclaim the Heavenly Kingdom of Great Peace. The government becomes a militant theocracy; the state faith turns to the syncretic Chinese Christianity of the God Worshippers. The Great Qing is gone; something wholly new stands in its place."
 qing_hk_proclaim_tt:0 "Become a #Y Christian theocracy#! — the fourth and rarest golden-age end-state. Requires the Christian path at its apex and no other fate already sealed."
 qing_hk_needs_progress_tt:0 "Requires the #Y Christian path#! to have advanced far enough."
 qing_hk_needs_apex_tt:0 "Requires the #Y Christian path at its apex#! (the road fully walked)."
 qing_hk_needs_not_sealed_tt:0 "Requires that the dynasty's fate is #Y not already sealed#! by another end-state."

# --- Taiping tree expansion (>=10 tasks) ---
 qing_hk_congregation_tt:0 "The God Worshippers organise in the Guangxi hills — the seed-body of the rising."
 qing_hk_uprising_tt:0 "The banner of revolt is raised at Jintian; the sect breaks out of Guangxi as an army."
 qing_hk_land_system_tt:0 "The radical land programme — common granary, shared field — levels the old gentry order."
 qing_hk_northern_expedition_tt:0 "The army lunges north against the old capital, the throw for the throne itself."
 qing_hk_new_admin_tt:0 "Hong Rengan's reform programme — railways, banks, a free press — modernises the new state."

# --- task titles + descriptions (mission-tree display) ---
 qing_hk_congregation:0 "The God Worshippers (拜上帝會)"
 qing_hk_congregation_DESC:0 "Organise the secret congregation in the Guangxi hills, the seed-body of the rising. Costs #Y 15#! political influence."
 qing_hk_uprising:0 "The Jintian Uprising (金田起義)"
 qing_hk_uprising_DESC:0 "Raise the banner of revolt and break out of Guangxi — the march that turns a sect into an army. Costs #Y 60#! treasury."
 qing_hk_land_system:0 "The Land System (天朝田畝制度)"
 qing_hk_land_system_DESC:0 "Proclaim the radical land programme — common granary, shared field. Costs #Y 25#! political influence."
 qing_hk_northern_expedition:0 "The Northern Expedition (北伐)"
 qing_hk_northern_expedition_DESC:0 "Send the army against the old capital, the lunge for the throne itself. Costs #Y 100#! treasury."
 qing_hk_new_admin:0 "The New Administration (資政新篇)"
 qing_hk_new_admin_DESC:0 "Put Hong Rengan's reform programme — railways, banks, a free press — into the new state. Costs #Y 70#! treasury."

 qing_hk_xiang_army:0 "The Xiang Army (湘軍)"
 qing_hk_xiang_army_DESC:0 "Let Zeng Guofan raise the Xiang Army of Hunan gentry and militia. Requires Changsha under the Qing wing. Costs #Y 60#! treasury."
 qing_hk_needs_changsha_tt:0 "The Qing (or a Qing subject) must hold #Y Changsha#!."
 qing_hk_xiang_army_tt:0 "A real #Y Xiang Army#! column (5 companies) is raised at #Y Changsha#!."
 qing_hk_huai_army:0 "The Huai Army (淮軍)"
 qing_hk_huai_army_DESC:0 "Let Li Hongzhang raise the Huai Army to relieve the lower Yangtze. Requires Hefei under the Qing wing. Costs #Y 60#! treasury."
 qing_hk_needs_hefei_tt:0 "The Qing (or a Qing subject) must hold #Y Hefei#!."
 qing_hk_huai_army_tt:0 "A real #Y Huai Army#! column (5 companies) is raised at #Y Hefei#!."
 qing_hk_anqing:0 "The Siege of Anqing (安慶會戰)"
 qing_hk_anqing_DESC:0 "Take Anqing, the river-gate to the rebel capital. Requires Anqing under the Qing wing. Costs #Y 55#! treasury."
 qing_hk_needs_anqing_tt:0 "The Qing (or a Qing subject) must hold #Y Anqing#!."
 qing_hk_anqing_tt:0 "A real #Y relief force#! (4 companies) garrisons #Y Anqing#!."
 qing_hk_suzhou:0 "The Recapture of Suzhou (蘇州克復)"
 qing_hk_suzhou_DESC:0 "Retake Suzhou, jewel of the Yangtze delta. Requires Suzhou under the Qing wing. Costs #Y 55#! treasury."
 qing_hk_needs_suzhou_tt:0 "The Qing (or a Qing subject) must hold #Y Suzhou#!."
 qing_hk_suzhou_tt:0 "A real #Y relief force#! (4 companies) garrisons #Y Suzhou#!."
 qing_hk_hangzhou:0 "The Fall of Hangzhou (杭州)"
 qing_hk_hangzhou_DESC:0 "Wrest Hangzhou from the rebel grip. Requires Hangzhou under the Qing wing. Costs #Y 55#! treasury."
 qing_hk_needs_hangzhou_tt:0 "The Qing (or a Qing subject) must hold #Y Hangzhou#!."
 qing_hk_hangzhou_tt:0 "A real #Y relief force#! (4 companies) garrisons #Y Hangzhou#!."
 qing_hk_nian:0 "The Nian Rebels (捻軍)"
 qing_hk_nian_DESC:0 "Ride down the Nian horsemen of the northern plain. Requires Bozhou, heart of the Nian country, under the Qing wing. Costs #Y 55#! treasury."
 qing_hk_needs_bozhou_tt:0 "The Qing (or a Qing subject) must hold #Y Bozhou#!."
 qing_hk_nian_tt:0 "A real #Y suppression column#! (4 companies) is raised at #Y Bozhou#!."
 qing_hk_gordon:0 "Gordon's Command (戈登常勝)"
 qing_hk_gordon_DESC:0 "Set Gordon over the Ever Victorious Army before Shanghai. Requires Shanghai under the Qing wing. Costs #Y 25#! political influence."
 qing_hk_needs_shanghai_tt:0 "The Qing (or a Qing subject) must hold #Y Shanghai#!."
 qing_hk_gordon_tt:0 "A real #Y Ever Victorious Army#! detachment (3 companies) is raised at #Y Shanghai#!."
 qing_hk_militia:0 "The Local Militias (團練鄉勇)"
 qing_hk_militia_DESC:0 "Raise the tuanlian militias across the loyal countryside. Requires unrailed ground still needing a garrison in the Yangzi heartland. Costs #Y 55#! treasury."
 qing_hk_needs_militia_ground_tt:0 "The Qing must hold a #Y Yangzi-heartland#! province without a banner garrison."
 qing_hk_militia_tt:0 "A real #G banner garrison#! is planted on a held Yangzi-heartland province."
 qing_hk_grain_south:0 "The Southern Revenues (東南財賦)"
 qing_hk_grain_south_DESC:0 "Restore the southeastern revenues that fund the war. Requires unturned ground in the Jiangsu, Zhejiang or Jiangxi regions. Costs #Y 55#! treasury."
 qing_hk_needs_grain_south_tt:0 "The Qing must hold a #Y Jiangsu/Zhejiang/Jiangxi#! province not already working #Y silk#!."
 qing_hk_grain_south_tt:0 "A held #Y southeastern#! province is turned to #G silk#!."
 qing_hk_restore_order:0 "Retake Nanjing (克復金陵)"
 qing_hk_restore_order_DESC:0 "Storm the Heavenly Capital at Nanjing and restore the order of Heaven. Requires Nanjing under the Qing wing. Costs #Y 70#! treasury."
 qing_hk_needs_nanjing_tt:0 "The Qing (or a Qing subject) must hold #Y Nanjing#!."
 qing_hk_restore_order_tt:0 "A real #Y garrison#! (6 companies) retakes #Y Nanjing#!, and the #G rebellion modifier lifts#! if it was active."
