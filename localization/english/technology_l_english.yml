#Academic Advances

tech_education:0 "Education"
tech_education_desc:0 "By removing our children from the streets and into the classroom we can expect our nation to profit in the long run."

tech_scientific_method:0 "Scientific Method"
tech_scientific_method_desc:0 "The antiquated lessons of the past must be dispensed with, superstitions hold no place in our society, every claim has to be proven empirically for it to be taken seriously."

tech_society_analysis:0 "Society Analysis"
tech_society_analysis_desc:0 "Why do we as a society act how we do and not in a different manner? Why do we find certain actions noble whilst other repulse us? The answer to these questions we don't know, but we're getting there."

tech_scientific_revolution:0 "Scientific Revolution"
tech_scientific_revolution_desc:0 "Unbeknownst to our people at large, it would seem science is not only useful in the military arena but can prove it's worth in transportation, medicine, nutrition, and everything in between. Our scientist are enjoying a period of bonanza never seen before."

tech_anthropology:0 "Anthropology"
tech_anthropology_desc:0 "How our society behaves has recently became a subject of incresing interes within our growing scientific ambiance."

tech_scientific_journals:0 "Scientific Journals"
tech_scientific_journals_desc:0 "Knowledge is useless if contained to one's private mind; therefore, a myriad of scientific journals have sprawled, provoking a rich and fruitful scholarly debate among the erudites of the nation."

tech_historiography:0 "Historiography"
tech_historiography_desc:0 "It is not merely sufficient to study our own history but to learn and construct it in a way that help serve our national interest, for the good of the nation."
tech_historicism:0 "Historicism"
tech_historicism_desc:0 "In examining our national legacy, we can either analyze our historic victories and defeats with equal objectivity, or, to our immense benefit, lean into a narrative of self-aggrandizement."

tech_psychology:0 "Psychology"
tech_psychology_desc:0 "The trappings of the psyche have eluded our people since time immemorial, however, pressed with the necessity to guard our citizen's mental health, the state has seen fit to delve resources into this abstract science."

tech_art_history:0 "Art History"
tech_art_history_desc:0 "It is a widely tought misconception that history is only a realm composed of books and dates. Far from it, compositions from the past and the legacy of them can help us people of the modern era to profit inmensely from the wisdom of days gone bye."

tech_national_epic:0 "National Epic"
tech_national_epic_desc:0 "Every individual profits from having someone to look up to. We have applied the same reasoning to a state level, having a national hero, part of an epic spread far and wide across our demesne helps us all to feel part of the same, conjoined project. It's irrelevant if the story is real or fabricated."

tech_theatre:0 "Theatre"
tech_theatre_desc:0 "Some of the best stories out there are meant to be told to as many ears as possible. Like the Romans of old, we shall build and extend theatres for our citizens to delight in the oldest human tradition ; storytelling."

tech_neoclassicism:0 "Neoclassicism"
tech_neoclassicism_desc:0 "A new cultural current is emerging across our painters and sculptors. Drawing from the themes and inspirations of the greco-roman world. We should further this past-inspired trend as we look into the future and the task ahead of us."

tech_cultural_imperialism:0 "Cultural Imperialism"
tech_cultural_imperialism_desc:0 "There are many ways to go about life and the pursuit of happiness. But ours is the right one."

tech_museums:0 "Museums"
tech_museums_desc:0 "Cloistering our most coveted artifacts for the public at large to observe is a revolutionary concept, but one we are sure to profit from."

tech_romanticism:0 "Romanticism"
tech_romanticism_desc:0 "Our artist are awed by nature, its force, beauty and expanse. There is within us a call to nature we cannot ignore; its time to provide these innovators with state investment."

tech_astronomy:0 "Astronomy"
tech_astronomy_desc:0 "What lies between the stars has compelled our species ever since our origins. But the time is now to finally unravel one of mankind's great misteries."

tech_astrophysics:0 "Astrophysics"
tech_astrophysics_desc:0 "As it turns out, space is vastly more complex than traditional religions imagined and we have a lot of ground to cover, fortunately we have no lack of spacegazers in our mist."

tech_secular_sciences:0 "Secular Sciences"
tech_secular_sciences_desc:0 "Science has for a long time clashed with religion. Galille was burnt at the stake. We can not stop the tides of progress and so we must separate superstition and the fear of the unknown from what is true and empirical, no matter how we feel about it."

tech_absorption_spectroscopy:0 "Absorption Spectroscopy"
tech_absorption_spectroscopy_desc:0 "Our newest discovery in space is that there appears to exist something called "Electromagnetic Radiation" which is one of the key forces that rule the cosmos, we have to learn as much as we can from it."

tech_molecular_physics:0 "Molecular Physics"
tech_molecular_physics_desc:0 "It would seem that the cell is no longer the smallest known organism. Molecules and the interactions between them are the new obsession of our learned minds."

tech_geology:0 "Geology"
tech_geology_desc:0 "Our own land can teach us lessons from its very ground. The rocks and soil that populate our treasured nation can shed light upon its age, origins and the meaning of life itself."

# --- Qing-specific technology (00_qing_inventions.txt) ---
 qing_tech_group:0 "Qing Statecraft & Industry"
 qing_tech_group_desc:0 ""
 qing_tech_imperial_kilns:0 "Imperial Kilns (景德鎮御窯)"
 qing_tech_imperial_kilns_desc:0 "The imperial porcelain kilns at Jingdezhen — the world's foremost ceramic industry, a proto-industrial complex of divided labour whose wares command every market from Edo to Amsterdam."
 qing_tech_imperial_silk:0 "Imperial Silk Manufactories (江南織造)"
 qing_tech_imperial_silk_desc:0 "The state silk manufactories of Suzhou, Hangzhou and Nanjing weave the finest brocades on earth for court and export alike."
 qing_tech_tea_canton:0 "Tea Administration & the Canton System (茶政十三行)"
 qing_tech_tea_canton_desc:0 "We are the sole source of the world's tea, and every leaf passes through the Thirteen Hongs of Canton — a river of foreign silver flows into the imperial treasury."
 qing_tech_grand_canal:0 "Grand Canal Hydraulics (河工漕運)"
 qing_tech_grand_canal_desc:0 "The Grand Canal and the Yellow River conservancy works are the most sophisticated hydraulic engineering on earth, binding the grain of the south to the capital of the north."
 qing_tech_siku_compilation:0 "The Four Treasuries Compilation (四庫全書)"
 qing_tech_siku_compilation_desc:0 "The Complete Library of the Four Treasuries gathers the whole of the empire's learning, cut on woodblocks and copied for the great libraries."
 qing_tech_court_mathematics:0 "Imperial Astronomical Bureau (欽天監)"
 qing_tech_court_mathematics_desc:0 "At the Imperial Astronomical Bureau, the mathematics and astronomy of East and West are reconciled — rigorous learning, though it remains bound to the court."
 qing_tech_eight_banners:0 "The Eight Banners (八旗)"
 qing_tech_eight_banners_desc:0 "The Eight Banners garrison the empire from Beijing to Ili, the martial backbone of Manchu rule."
 qing_tech_columbian_crops:0 "Columbian-Crop Agronomy (番薯玉米)"
 qing_tech_columbian_crops_desc:0 "Maize, the sweet potato and the peanut climb the marginal uplands the old grains could never feed, and the people multiply as never before."
 qing_tech_variolation:0 "Variolation (種痘)"
 qing_tech_variolation_desc:0 "The practice of inoculation against smallpox, long known to our physicians, spares the multitudes the ravages of the pox."
 qing_tech_manchu_science:0 "Manchu Horsemanship & Archery (滿洲騎射)"
 qing_tech_manchu_science_desc:0 "The horsemanship and archery of the banner people — the martial soul of the dynasty."
 qing_tech_han_science:0 "Confucian Statecraft (儒家治術)"
 qing_tech_han_science_desc:0 "The statecraft of the Confucian scholar-official and the examination bureaucracy that has governed the realm for two thousand years."
 qing_tech_mongol_science:0 "Mongol Horse-Administration (蒙古馬政)"
 qing_tech_mongol_science_desc:0 "The horse-administration of the steppe, its remounts and its light cavalry, now bent to the service of the empire."
 qing_tech_tibetan_science:0 "Tibetan Highland Administration (藏地治理)"
 qing_tech_tibetan_science_desc:0 "The administration of the highlands and the imperial patronage of the lamaseries binds Tibet to the throne."
 qing_tech_uyghur_science:0 "Xinjiang Oasis Colonies (回疆屯墾)"
 qing_tech_uyghur_science_desc:0 "The military-colony agriculture of the Xinjiang oases settles the New Dominion and turns desert into garrison-field."

# --- 1763-1815 additions (early-industrial + Napoleonic-era) ---
tech_water_frame:0 "Water Frame"
tech_water_frame_desc:0 "Arkwright's water-powered spinning frame turns raw cotton into strong thread by the ton — the machine that raises the first true factories."
tech_spinning_mule:0 "Spinning Mule"
tech_spinning_mule_desc:0 "Crompton's mule spins yarn fine and strong at once, the machine that clothes the world in cheap cotton."
tech_power_loom:0 "Power Loom"
tech_power_loom_desc:0 "Mechanised weaving at last keeps pace with mechanised spinning; the whole cloth trade passes into the mill."
tech_puddling_process:0 "Puddling & Rolling"
tech_puddling_process_desc:0 "Cort's puddling furnace and rolling mill turn out wrought-iron bar by the ton — cheap iron for an age of iron."
tech_leblanc_process:0 "Leblanc Process"
tech_leblanc_process_desc:0 "Soda ash made from salt on an industrial scale, the alkali that feeds the glass, soap and bleaching trades."
tech_smallpox_vaccination:0 "Smallpox Vaccination"
tech_smallpox_vaccination_desc:0 "Jenner's cowpox inoculation is a surer shield against the pox than the old variolation, and the people multiply."
tech_interchangeable_parts:0 "Interchangeable Parts"
tech_interchangeable_parts_desc:0 "Uniform, gauged components that any fitter can assemble — the principle from which mass manufacture will grow."
tech_gribeauval_system:0 "Gribeauval System"
tech_gribeauval_system_desc:0 "Standardised, lightened, mobile field guns with interchangeable carriages — the reform that makes artillery the queen of the battlefield."
tech_shrapnel_shell:0 "Shrapnel Shell"
tech_shrapnel_shell_desc:0 "A hollow shell packed with musket-balls and a timed fuse, bursting over the enemy's heads in a lethal shower."
tech_congreve_rockets:0 "Congreve Rockets"
tech_congreve_rockets_desc:0 "Iron war-rockets loosed by the flight, terrifying if wayward — the red glare over the ramparts."
tech_corps_darmee:0 "Corps d'Armee"
tech_corps_darmee_desc:0 "The self-contained army corps — infantry, cavalry and guns under one command — that lets a host march dispersed and fight concentrated."
tech_horse_artillery:0 "Horse Artillery"
tech_horse_artillery_desc:0 "Every gunner mounted, the guns galloping with the cavalry to unlimber wherever the battle turns."
tech_optical_telegraph:0 "Optical Telegraph"
tech_optical_telegraph_desc:0 "Chappe's semaphore towers pass a message across the realm in an hour — the state's nerves, a generation before the electric wire."
tech_metric_system:0 "Metric System"
tech_metric_system_desc:0 "Decimal weights and measures on one rational standard, sweeping away the tangle of local units."
tech_modern_chemistry:0 "Modern Chemistry"
tech_modern_chemistry_desc:0 "Lavoisier's oxygen theory and the conservation of mass overturn phlogiston and set chemistry on a quantitative footing."
tech_pneumatics:0 "Pneumatics & Ballooning"
tech_pneumatics_desc:0 "The study of gases and the first ascents by balloon — natural philosophy made spectacle, and the air itself opened."
tech_comparative_anatomy:0 "Comparative Anatomy"
tech_comparative_anatomy_desc:0 "Cuvier's systematic comparison of living and fossil forms founds a rigorous natural history and the science of extinction."
tech_meritocratic_recruitment:0 "Meritocratic Recruitment"
tech_meritocratic_recruitment_desc:0 "Office by examined merit rather than birth or purchase — a civil service the throne can trust to be competent."
tech_professional_civil_service:0 "Professional Civil Service"
tech_professional_civil_service_desc:0 "A salaried, permanent bureaucracy with fixed grades and pensions, insulated from the churn of patronage."
tech_administrative_codification:0 "Administrative Codification"
tech_administrative_codification_desc:0 "The tangle of edicts and precedents distilled into a single ordered code every clerk can cite."
tech_provincial_gazetteers:0 "Provincial Gazetteers"
tech_provincial_gazetteers_desc:0 "Standardised local records — population, revenue, geography — flow to the centre in a common form."
tech_statistical_bureau:0 "Statistical Bureau"
tech_statistical_bureau_desc:0 "A dedicated office to gather and reconcile the empire's numbers, turning raw returns into policy."
tech_cadastral_survey:0 "Cadastral Survey"
tech_cadastral_survey_desc:0 "Every field measured and registered to its holder — the tax roll made honest and complete."
tech_double_entry_bookkeeping:0 "Double-Entry Bookkeeping"
tech_double_entry_bookkeeping_desc:0 "Every credit answered by a debit — the merchant's accounts, and the state's, made auditable at a glance."
tech_bond_markets:0 "Bond Markets"
tech_bond_markets_desc:0 "Public debt made tradable — the state borrows cheaply from a broad market rather than a few financiers."
tech_joint_stock_companies:0 "Joint-Stock Companies"
tech_joint_stock_companies_desc:0 "Capital pooled from many shareholders under limited liability — great ventures no single purse could bear."
tech_commodity_exchange:0 "Commodity Exchange"
tech_commodity_exchange_desc:0 "A central floor where staples are priced and traded in standardised lots, smoothing supply across the realm."
tech_sinking_fund:0 "Sinking Fund"
tech_sinking_fund_desc:0 "A dedicated reserve that steadily retires the principal of the public debt, restoring the state's credit."
tech_treasury_bills:0 "Treasury Bills"
tech_treasury_bills_desc:0 "Short-term paper against future revenue lets the treasury bridge the seasons without ruinous borrowing."
tech_permanent_embassies:0 "Permanent Embassies"
tech_permanent_embassies_desc:0 "Resident ministers at foreign courts — a standing ear and voice abroad rather than ad-hoc envoys."
tech_international_law:0 "Law of Nations"
tech_international_law_desc:0 "A shared body of custom and treaty governing war, trade and the conduct of states toward one another."
tech_consular_service:0 "Consular Service"
tech_consular_service_desc:0 "Consuls posted to foreign ports protect our merchants and report on the commerce of distant markets."
tech_commercial_treaties:0 "Commercial Treaties"
tech_commercial_treaties_desc:0 "Negotiated tariffs and most-favoured terms open foreign markets to our goods and ours to theirs."
tech_diplomatic_protocol:0 "Diplomatic Protocol"
tech_diplomatic_protocol_desc:0 "Fixed forms of precedence and audience end the ruinous quarrels over ceremony that once wrecked embassies."
tech_newspapers:0 "Newspapers"
tech_newspapers_desc:0 "A regular printed sheet carries decree, market price and news of the world to every literate town."
tech_lithography:0 "Lithography"
tech_lithography_desc:0 "Printing from a drawn stone — cheap illustration and sheet music for a widening reading public."
tech_stereotyping:0 "Stereotyping"
tech_stereotyping_desc:0 "Whole pages cast as solid plates let a press run off editions by the tens of thousands."
tech_periodical_press:0 "Periodical Press"
tech_periodical_press_desc:0 "Journals and reviews on a fixed cycle sustain learned debate and shape an informed opinion."
tech_public_opinion:0 "Public Opinion"
tech_public_opinion_desc:0 "The mood of the reading public becomes a force the throne must court, not merely command."
tech_municipal_government:0 "Municipal Government"
tech_municipal_government_desc:0 "Chartered towns manage their own markets, watch and works under the crown's oversight."
tech_public_records_office:0 "Public Records Office"
tech_public_records_office_desc:0 "A single repository preserves the deeds, censuses and edicts of the realm against loss and forgery."
tech_civil_registry:0 "Civil Registry"
tech_civil_registry_desc:0 "Births, marriages and deaths recorded by the state — the population made legible for tax and levy."
tech_passport_system:0 "Passport System"
tech_passport_system_desc:0 "Papers of identity and leave-to-travel let the state track and channel the movement of its subjects."
tech_police_administration:0 "Police Administration"
tech_police_administration_desc:0 "A salaried, uniformed force keeps the peace of the streets in place of the old militias and watch."
tech_fire_brigades:0 "Fire Brigades"
tech_fire_brigades_desc:0 "Organised, equipped companies save the crowded quarters from the conflagrations that once razed them."
tech_clinical_medicine:0 "Clinical Medicine"
tech_clinical_medicine_desc:0 "Diagnosis at the bedside from observed signs and case histories, not the humours of the ancients."
tech_vaccination_theory:0 "Vaccination Theory"
tech_vaccination_theory_desc:0 "Deliberate inoculation with a mild strain arms the body against the killing pox before it strikes."
tech_germ_hypothesis:0 "Germ Hypothesis"
tech_germ_hypothesis_desc:0 "The suspicion that unseen living agents, not bad air, carry the great epidemics — and can be kept out."
tech_public_hygiene:0 "Public Hygiene"
tech_public_hygiene_desc:0 "Clean water, drained streets and quarantine break the cycles of fever that thinned the cities."
tech_pharmacology:0 "Pharmacology"
tech_pharmacology_desc:0 "The active principles of the old remedies isolated, measured and dosed with real precision."
tech_hospitals:0 "Modern Hospitals"
tech_hospitals_desc:0 "Wards ordered by disease, trained nursing and surgical theatres turn the poorhouse infirmary into a place of cure."
tech_analytical_chemistry:0 "Analytical Chemistry"
tech_analytical_chemistry_desc:0 "Substances resolved into their elements by weight and reaction — the chemist's balance made a tool of proof."
tech_electrochemistry:0 "Electrochemistry"
tech_electrochemistry_desc:0 "The pile's current tears compounds apart, revealing new elements and the electrical nature of the bond."
tech_atomic_theory:0 "Atomic Theory"
tech_atomic_theory_desc:0 "Matter as combinations of indivisible atoms in fixed proportions — Dalton's law made chemistry exact."
tech_thermodynamics:0 "Thermodynamics"
tech_thermodynamics_desc:0 "Heat, work and their conservation understood as one — the theory that will govern every engine."
tech_optics:0 "Wave Optics"
tech_optics_desc:0 "Light as a wave — diffraction, interference and polarisation explained where corpuscles could not."
tech_electromagnetism:0 "Electromagnetism"
tech_electromagnetism_desc:0 "The discovery that a current bends a needle and a moving magnet drives a current — one force, two faces."
tech_stratigraphy:0 "Stratigraphy"
tech_stratigraphy_desc:0 "The earth read in its layers — each stratum a page of a history far longer than scripture allowed."
tech_palaeontology:0 "Palaeontology"
tech_palaeontology_desc:0 "The fossil record reconstructed into vanished worlds and the fact of extinction."
tech_systematic_botany:0 "Systematic Botany"
tech_systematic_botany_desc:0 "Every plant named and placed in a rational order — the ground of scientific agriculture and the physic garden."
tech_agronomy:0 "Scientific Agronomy"
tech_agronomy_desc:0 "Rotation, selective breeding and soil chemistry turn husbandry from custom into a studied art."
tech_scientific_expeditions:0 "Scientific Expeditions"
tech_scientific_expeditions_desc:0 "State-backed voyages of survey and collection map the coasts, the heavens and the wealth of distant lands."
tech_philology:0 "Philology"
tech_philology_desc:0 "The critical study of texts and their languages — scripture, classic and charter read with a scholar's rigour."
tech_comparative_linguistics:0 "Comparative Linguistics"
tech_comparative_linguistics_desc:0 "The kinship of tongues traced to common roots, binding scattered peoples into families of descent."
tech_epigraphy:0 "Epigraphy"
tech_epigraphy_desc:0 "Inscriptions in stone and bronze deciphered — the record of ages before the written book."
tech_political_economy:0 "Political Economy"
tech_political_economy_desc:0 "The wealth of nations analysed as a system of production, trade and value that policy can steer."
tech_sociology:0 "Sociology"
tech_sociology_desc:0 "Society itself made an object of study — its classes, institutions and the laws of its change."
tech_ethnography:0 "Ethnography"
tech_ethnography_desc:0 "The systematic description of peoples, their customs and beliefs — the empire come to know its many subjects."
tech_public_schooling:0 "Public Schooling"
tech_public_schooling_desc:0 "Letters and numbers taught to the common child at the state's charge — a literate populace by design."
tech_teacher_training:0 "Teacher Training"
tech_teacher_training_desc:0 "Normal schools produce a trained corps of instructors, ending the age of the amateur schoolmaster."
tech_polytechnic_institutes:0 "Polytechnic Institutes"
tech_polytechnic_institutes_desc:0 "Engineers, chemists and artillerists schooled together in applied science for the service of the state."
tech_research_universities:0 "Research Universities"
tech_research_universities_desc:0 "The university refounded around original inquiry — the seminar and the laboratory, not merely the lecture."
tech_learned_academies:0 "Learned Academies"
tech_learned_academies_desc:0 "Chartered societies of savants correspond, publish and adjudicate — the republic of letters given a seat."
