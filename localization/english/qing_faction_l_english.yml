l_english:
 # qing_faction_events.txt — conservative-vs-reformist Grand Council politics (#158).
 # Every key BOM+LF. The reform balance / effectiveness / harmony numbers moved by
 # each option are described in se_QING_FACTION.txt and the event options.

 # --- qing_faction.1  THE REFORM MEMORIAL (變法奏摺) ---
 qing_faction.1.t:0 "A Memorial on Reform"
 qing_faction.1.desc:0 "The council chamber is loud today. [reformer.GetName], of the reform-minded party, has laid before the throne a memorial urging the adoption of Western methods — machines, schools, new-model troops. Before the ink is dry, [conservative.GetName] is on his feet in opposition, invoking the ancestors and the sages against every clause of it.\n\nThe two factions of the Grand Council look to Us. The whole court is waiting to see which way the wind blows from the throne."
 qing_faction.1.a:0 "Back the memorial — the times demand it"
 qing_faction.1.a.tt:0 "The reform trajectory advances; [reformer.GetName] is commended, [conservative.GetName] estranged.\n#G [reformer.GetName]'s Loyalty: +12#!\n#R [conservative.GetName]'s Loyalty: -5#!\n#R Political Influence: -10#!"
 qing_faction.1.b:0 "Hold to the ancestral ways"
 qing_faction.1.b.tt:0 "The reform trajectory recedes; [conservative.GetName] is commended, [reformer.GetName] estranged.\n#G Stability: +1#!\n#G [conservative.GetName]'s Loyalty: +12#!\n#R [reformer.GetName]'s Loyalty: -5#!"
 qing_faction.1.c:0 "Seek a middle course — strength without upheaval"
 qing_faction.1.c.tt:0 "Neither faction is satisfied.\n#G Council Effectiveness: +2#!\n#R [reformer.GetName]'s Loyalty: -4#!\n#R [conservative.GetName]'s Loyalty: -4#!"

 # --- qing_faction.2  BEHIND THE SCREEN, AGAINST THE TIDE (慈禧阻變) ---
 qing_faction.2.t:0 "Behind the Screen"
 qing_faction.2.desc:0 "The Grand Council has swung toward reform, and the edicts of a new age are being drafted. But from the inner palace the Empress Dowager [dowager.GetName] has made her displeasure known. She summons the great ministers behind the screen, and lets it be understood that the ancestors' realm will not be remade by upstarts while she draws breath.\n\nIt is the old question of this reign: does the throne rule, or does the Dowager? Reform hangs on the answer."
 qing_faction.2.a:0 "Defer to the Empress Dowager"
 qing_faction.2.a.tt:0 "The reforms are rolled back; the Dowager's prestige rises and the house is outwardly kept, but the council is dragged rightward.\n#G Dynastic Harmony: +6#!\n#G Dowager's Popularity: +30#!\n#R Council Effectiveness: -3#!"
 qing_faction.2.b:0 "Defy her — the reforms will proceed"
 qing_faction.2.b.tt:0 "The reform trajectory advances and the Emperor gains prestige, but the imperial house is bitterly divided.\n#G Emperor's Popularity: +15#!\n#R Dynastic Harmony: -14#!\n#R Political Influence: -15#!"

 # --- qing_faction.3  A COUNCIL AT DEADLOCK (朝議紛爭) ---
 qing_faction.3.t:0 "A Council at Deadlock"
 qing_faction.3.desc:0 "The Grand Council is split down the middle. For every reformer like [reformer.GetName] there is a conservative like [conservative.GetName], and every question — a railway, a tariff, an appointment — divides the chamber into two immovable camps. Memorials pile up unanswered; nothing is decided; the business of the empire grinds to a halt.\n\nThe factions will not resolve this themselves. Only the throne can break the deadlock."
 qing_faction.3.a:0 "Force it — purge the lesser faction's loudest voice"
 qing_faction.3.a.tt:0 "The smaller bloc's spokesman is unseated; council effectiveness recovers as the deadlock breaks, and the reform balance tilts toward the surviving majority.\n#R Purged Spokesman's Loyalty: -5#!\n#R Tyranny: +2#!"
 qing_faction.3.b:0 "Broker a working consensus"
 qing_faction.3.b.tt:0 "Bridge the two blocs.\n#R Political Influence: -20#!\n#G Council Effectiveness: +5#!\n#G [reformer.GetName]'s Loyalty: +12#!\n#G [conservative.GetName]'s Loyalty: +12#!"
 qing_faction.3.c:0 "Let the paralysis run its course"
 qing_faction.3.c.tt:0 "The two spokesmen become personal rivals.\n#R Council Effectiveness: -6#!"
 # [#308/user] .4 — a collective memorial (聯名上奏): a bloc of councillors lobbies together
 qing_faction.4.t:0 "A Collective Memorial (聯名上奏)"
 # [continuation fix 2026-08-19] the memorial now names a SPECIFIC concrete petition
 # (qing_lobby_petition) instead of a generic "press their case" — this is the reform-posture
 # variant (the common-case fallback); desc_succession/desc_council below are the other two.
 qing_faction.4.desc:0 "It is not one man this time but many. A bloc of the Grand Council has set its names to a single memorial, urging the throne to fix the realm's course on reform — [lobby_leader.GetName] at their head. They have banded together to press their case as a body, and the weight of their number is itself the argument: to refuse them is to face down a caucus of the men who run the empire, not a lone petitioner.\n\nThe throne may grant what they ask, face them down, or quietly draw off their spokesman and let the bloc collapse without him."
 qing_faction.4.desc_succession:0 "It is not one man this time but many. A bloc of the Grand Council has set its names to a single memorial — not on policy, but on the succession itself. [lobby_leader.GetName] speaks for them: the throne must show, now, which of the princes it favours. To refuse them is to face down a caucus of the men who run the empire, not a lone petitioner.\n\nThe throne may grant what they ask, face them down, or quietly draw off their spokesman and let the bloc collapse without him."
 qing_faction.4.desc_council:0 "It is not one man this time but many. A bloc of the Grand Council has set its names to a single memorial — a grievance that cuts across reformer and conservative alike, over how the court itself is staffed and run. [lobby_leader.GetName] speaks for them. To refuse them is to face down a caucus of the men who run the empire, not a lone petitioner.\n\nThe throne may grant what they ask, face them down, or quietly draw off their spokesman and let the bloc collapse without him."
 # [continuation fix 2026-08-19] one desc per qing_lobby_law_choice, naming the specific statute.
 qing_faction.4.desc_law_examcadence:0 "It is not one man this time but many. A bloc of the Grand Council has set its names to a single memorial on the cadence of the examinations — [lobby_leader.GetName] at their head. Some would run the metropolitan exam more often, to widen and renew the pool of degree-holders faster; others would keep it rare, and the resulting elite thin and select. To refuse them is to face down a caucus of the men who run the empire, not a lone petitioner.\n\nThe throne may grant what they ask, face them down, or quietly draw off their spokesman and let the bloc collapse without him."
 qing_faction.4.desc_law_advisory:0 "It is not one man this time but many. A bloc of the Grand Council has set its names to a single memorial on foreign advisors at court — [lobby_leader.GetName] at their head. Some would open the bench wide, in the spirit of 師夷長技 — learning the barbarians' methods to master them; others would keep the circle small and wary, 拒夷 — holding the foreigners at arm's length. To refuse them is to face down a caucus of the men who run the empire, not a lone petitioner.\n\nThe throne may grant what they ask, face them down, or quietly draw off their spokesman and let the bloc collapse without him."
 qing_faction.4.desc_law_anticorruption:0 "It is not one man this time but many. A bloc of the Grand Council has set its names to a single memorial on the pursuit of graft — [lobby_leader.GetName] at their head. Some would order draconian audits, sparing no rank; others counsel a tolerant blind eye, lest the whole edifice of patronage crack. To refuse them is to face down a caucus of the men who run the empire, not a lone petitioner.\n\nThe throne may grant what they ask, face them down, or quietly draw off their spokesman and let the bloc collapse without him."
 qing_faction.4.desc_law_xinjiang:0 "It is not one man this time but many. A bloc of the Grand Council has set its names to a single memorial on the administration of Xinjiang — [lobby_leader.GetName] at their head. Some would provincialize it outright, direct modern rule from Peking; others hold to the old indirect method, ruling through the begs as always. To refuse them is to face down a caucus of the men who run the empire, not a lone petitioner.\n\nThe throne may grant what they ask, face them down, or quietly draw off their spokesman and let the bloc collapse without him."
 qing_faction.4.desc_law_missionary:0 "It is not one man this time but many. A bloc of the Grand Council has set its names to a single memorial on the Christian missionaries — [lobby_leader.GetName] at their head. Some would open the field to them entirely; others would prohibit them outright, root and branch. To refuse them is to face down a caucus of the men who run the empire, not a lone petitioner.\n\nThe throne may grant what they ask, face them down, or quietly draw off their spokesman and let the bloc collapse without him."
 qing_faction.4.desc_law_integration:0 "It is not one man this time but many. A bloc of the Grand Council has set its names to a single memorial on the nature of the realm itself — [lobby_leader.GetName] at their head. Some would bind Han, Manchu, and every frontier people into one civic nation; others hold that the dynasty is, and must remain, a Manchu house first. To refuse them is to face down a caucus of the men who run the empire, not a lone petitioner.\n\nThe throne may grant what they ask, face them down, or quietly draw off their spokesman and let the bloc collapse without him."
 qing_faction.4.desc_law_provmil:0 "It is not one man this time but many. A bloc of the Grand Council has set its names to a single memorial on who commands the realm's armies — [lobby_leader.GetName] at their head. Some would delegate real force to trusted provincial governors, on the Xiang/Huai model; others insist the Banners and Green Standard stay held tight in the throne's own hand. To refuse them is to face down a caucus of the men who run the empire, not a lone petitioner.\n\nThe throne may grant what they ask, face them down, or quietly draw off their spokesman and let the bloc collapse without him."
 qing_faction.4.desc_law_examcurr:0 "It is not one man this time but many. A bloc of the Grand Council has set its names to a single memorial on what the examinations should actually TEST — [lobby_leader.GetName] at their head. Some would admit practical subjects into the curriculum; others hold that the classical canon alone makes a gentleman fit to govern. To refuse them is to face down a caucus of the men who run the empire, not a lone petitioner.\n\nThe throne may grant what they ask, face them down, or quietly draw off their spokesman and let the bloc collapse without him."
 qing_faction.4.desc_law_regency:0 "It is not one man this time but many. A bloc of the Grand Council has set its names to a single memorial on the rules of regency itself — [lobby_leader.GetName] at their head. Some would bind any future regent with conciliar checks; others would leave him as unbound as the throne itself, should the need ever arise. To refuse them is to face down a caucus of the men who run the empire, not a lone petitioner.\n\nThe throne may grant what they ask, face them down, or quietly draw off their spokesman and let the bloc collapse without him."
 qing_faction.4.a:0 "Concede to the memorial"
 qing_faction.4.a.tt:0 "Grant the bloc's demand. #G The whole caucus is gratified#! and the throne fixes its reform posture their way — a reformist bloc #G sets the throne's posture to Reformist#! and eases pressure; a conservative bloc #G sets it to Conservative#! for a gain in stability. This is the SAME durable shift enacting the Reform Posture law would make, not a one-off.\n#Y Reform trajectory: [Player.MakeScope.GetVariable('qing_faction_reform_balance_shown').GetValue|0]/100#! (reactionary -100 .. +100 constitutional — feeds the reform mission track). Costs political influence."
 qing_faction.4.a2.tt:0 "Grant the bloc's demand. #G The whole caucus is gratified#! — their grievance cuts across the reform/conservative divide, so the throne settles it as a matter of administration: #G the Council Composition policy shifts#! toward whichever pole this caucus pressed for, the SAME durable shift enacting that law would make, plus a rise in council effectiveness.\n#Y Council effectiveness: [Player.MakeScope.GetVariable('qing_faction_council_eff_concede_shown').GetValue|0]/100#! (drives ministry performance and the Self-Strengthening threshold). Costs political influence."
 qing_faction.4.a3.tt:0 "Grant the bloc's demand. #G The whole caucus is gratified#! — the throne shows its hand in the succession, openly favouring their candidate. #G His standing with the court rises sharply#!, pulling him toward the succession.\n#Y [qing_lobby_petition_prince.GetName]'s backing: [Player.MakeScope.GetVariable('qing_faction_prince_backing_shown').GetValue|0]/100#! (the same meter that decides who is eventually named heir). Costs political influence."
 qing_faction.4.a4.tt:0 "Grant the bloc's demand. #G The whole caucus is gratified#! and the throne settles the specific statute their way — the SAME durable shift enacting that law would make, not a one-off.\n#Y Policy setting now: [Player.MakeScope.GetVariable('qing_faction_law_bias_shown').GetValue|0]#! (see the memorial's own text above for which statute and which way). Costs political influence."
 qing_faction.4.b:0 "Face them down — the throne will not be dictated to"
 qing_faction.4.b.tt:0 "Assert the autocrat's prerogative. The bloc sulks, but the throne's authority stands undivided.\n#R The Bloc's Loyalty: -5#!\n#R Tyranny: +1#!\n#Y Council Effectiveness: [Player.MakeScope.GetVariable('qing_faction_council_eff_facedown_shown').GetValue|0]/100#!"
 qing_faction.4.c:0 "Co-opt their spokesman"
 qing_faction.4.c.tt:0 "Draw off [lobby_leader.GetName] with favour and standing so he abandons the caucus — divide and rule.\n#G [lobby_leader.GetName]'s Loyalty: +12#!\n#G [lobby_leader.GetName]'s Prominence: +10#!\n#R The Rest of the Bloc's Loyalty: -3#!\n#R Political Influence: -10#!"
