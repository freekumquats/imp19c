 qing_col_amur_frontier:0 "The Amur Frontier (黑龍江邊防)"
 qing_col_fur_coast:0 "The Alaskan Fur Coast (阿拉斯加毛皮海岸)"
 qing_col_pacific_trade:0 "The Northwest Fur Trade (西北毛皮貿易)"
 qing_col_golden_shore:0 "The Golden Shore (金山)"
 qing_daoguang_doctrine:0 "The Daoguang Doctrine (道光主義)"
