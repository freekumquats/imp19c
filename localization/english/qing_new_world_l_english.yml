l_english:

 # ====================================================================
 # THE NEW WORLD ENTERPRISE (新大陸事業) — the trans-Pacific American arc.
 # #27, lifted out of qing_colonization_l_english.yml (2026-08-02, see
 # design/DESIGN_COLONIZATION_SPLIT.md §A2). Amur / Alaska / Canada /
 # California / the Daoguang Doctrine, and the Pacified-New-World march (安新).
 # Sources: Gibson, Otter Skins, Boston Ships and China Goods (1992);
 # Perdue, China Marches West (2005).
 # ====================================================================

 # --- mission-group title --------------------------------------------
 qing_new_world_mission:0 "The New World Enterprise (新大陸事業)"
 qing_new_world_mission_DESCRIPTION:0 "Where the island road (the Great Pacific Enterprise) plants the stepping-stones and the southern continent, this enterprise crosses the Great Ocean itself: secure the Amur springboard, contest Russian America and the fur coast, plant a colony on the golden shore of California, and forge the Pacific-basin entente with the young American republic — gathering the Pacific-coast conquests into the transpacific march of the Pacified New World."
 qing_new_world_mission_CRITERIA_DESCRIPTION:0 "This enterprise is complete when the dragon banner flies on the Pacific coast of the New World."
 qing_new_world_mission_REWARD_DESCRIPTION:0 "Completing every objective in this tree grants its capstone reward."
 qing_new_world_mission_BUTTON_TOOLTIP:0 "Open this mission tree."


 # --- Amur ------------------------------------------------------------
 qing_col_amur:0 "Secure the Amur Frontier (鞏固黑龍江)"
 qing_col_amur_DESC:0 "On the great river the two empires have faced one another since the Cossacks first came — at Albazin, at Nerchinsk (尼布楚), at Kyakhta (恰克圖). The Tsar's men grow bolder each year. Fortify the Amur, settle the banner-lands, and lay the Qing claim upon the Okhotsk coast before Russia closes it off for good."
 qing_col_amur_tt:0 "Fortify the #Y Amur#!, ease #Y banner decay#!, and claim the Okhotsk coast."
 qing_col_amur_napoleonic_tt:0 "#Y While Russia is pinned in the west by the Napoleonic Wars#! (from ~1812), the undefended Amur yields a #G further claim on the Outer-Manchurian coast#! and a #G stability#! bonus."

 # --- Alaska ----------------------------------------------------------
 qing_col_alaska:0 "Contest Russian America (爭奪阿拉斯加)"
 qing_col_alaska_DESC:0 "Across the northern ocean lies Russian America, governed from the little wooden capital of Novoarkhangelsk (Sitka) by the chronically under-supplied Russian-American Company — a colony that survives only on the Canton tea trade and Californian grain. A Qing fleet that can reach it can contest the whole fur coast: Sitka, Kodiak, and the sea-otter wealth of the north Pacific."
 qing_col_alaska_tt:0 "Claim the #Y Alaskan fur coast#! (Sitka, Novoarkhangelsk, Kodiak) and gain development capital."

 # --- Canada ----------------------------------------------------------
 qing_col_canada:0 "The Northwest Fur Coast (西北毛皮海岸)"
 qing_col_canada_DESC:0 "South of Alaska runs the misted coast of the Nootka and Columbia trade, where British, American and Russian ships already vie for sea-otter pelts bound for Canton. Plant Qing factories along it and the richest fur trade on earth flows into imperial hands."
 qing_col_canada_tt:0 "Establish the #Y Pacific-Northwest fur trade#! and gain development capital."

 # --- California ------------------------------------------------------
 qing_col_california:0 "A Colony on the Golden Shore (開拓金山)"
 qing_col_california_DESC:0 "Fort Ross fed Russian Alaska from the California coast; a generation hence, Chinese hands would build the American West and call San Francisco 金山, the Golden Mountain. Let the Qing plant its own colony on the great bay of the western sea — the eastern anchor of a Pacific empire."
 qing_col_california_tt:0 "Claim #Y San Francisco Bay#!; found the Golden Shore colony and gain great capital."

 # --- the Daoguang Doctrine (US entente) ------------------------------
 qing_col_daoguang_doctrine:0 "Proclaim the Daoguang Doctrine (道光主義)"
 qing_col_daoguang_doctrine_DESC:0 "In 1823 the American president Monroe declared the New World closed to European empire. Let the Great Qing answer with a doctrine of its own: the Pacific and the Americas are the sphere of the rising powers who border them, and the old empires of Europe — Britain, France, Russia — shall gain no further ground there. The young American republic came to Canton as a rival of the British, not their partner; by the Treaty of Wanghia (望廈條約, 1844) it dealt with the Qing on gentler terms than London ever offered. Make that common interest a common front. Where the Qing and the Americans stand together, the Pacific coast need not be a field of rivalry — and the powers of Europe find the ocean's far shore closed to them."
 qing_col_daoguang_doctrine_tt:0 "Forge an #Y entente with the United States#!: shared goodwill, trade and standing — and Qing expansion on the New World coast no longer provokes #Y Britain#! or America itself."
 qing_col_needs_usa_tt:0 "The #Y United States#! must exist to forge the entente"

 # --- 安新 Anxin (Pacified New World) — invented ---------------------
 qing_col_anxin:0 "The Protectorate of the Pacified New World (安新都護府)"
 qing_col_anxin_DESC:0 "Beyond the Great Ocean, where no Chinese dynasty ever held ground, this Qing has. Gather the Pacific-coast conquests of the New World — the fur coast of the north, the golden shore of California — into a single transpacific march: the Protectorate of the Pacified New World (安新都護府), the most distant and improbable of all the marches, a Protector-General of a continent the Tang cartographers never knew. An invention wholly of this Qing."
 qing_col_anxin_tt:0 "Erect the invented #Y Protectorate of the Pacified New World#! from your #Y North-American holdings#! — released as a new #G tributary#! march. Gain the #G Pacified New World#! modifier (export commerce, tax, legitimacy)."
 qing_col_needs_newworld_land_tt:0 "You must own at least #Y 3 provinces on the New World Pacific coast#! (Alaska, the Northwest coast or California) to erect the march"
 qing_protectorate_anxin_name:0 "Anxin (安新都護府)"
 qing_protectorate_anxin_adj:0 "Anxin"
 qing_col_protectorate_newworld:0 "Protectorate of the Pacified New World (安新)"

 # --- New-World reward-modifier display names -------------------------
 qing_col_amur_frontier:0 "The Amur Frontier (黑龍江邊防)"
 qing_col_fur_coast:0 "The Alaskan Fur Coast (阿拉斯加毛皮海岸)"
 qing_col_pacific_trade:0 "The Northwest Fur Trade (西北毛皮貿易)"
 qing_col_golden_shore:0 "The Golden Shore (金山)"
 qing_daoguang_doctrine:0 "The Daoguang Doctrine (道光主義)"

 # ##################################################################
 # [#42] THE PACIFIC-RIM ARC (環太平洋弧) — the expanded fur-coast enterprise.
 # ##################################################################
 # --- allow-tooltip -------------------------------------------------
 qing_nw_needs_pacific_rim_tt:0 "You must own at least #Y 4 provinces#! along the Pacific-rim arc (Alaska, British Columbia, Vancouver Island, Cascadia or California) to proclaim the Pacific Rim"

 # --- 鄂霍次克 — Okhotsk --------------------------------------------
 qing_nw_okhotsk:0 "The Okhotsk Seaboard (鄂霍次克)"
 qing_nw_okhotsk_DESC:0 "The bleak seaboard at the Pacific mouth of Siberia, the port from which Vitus Bering sailed to find America. Whoever holds Okhotsk turns the Russian flank on the northern ocean and commands the road to Kamchatka and Alaska beyond."
 qing_nw_okhotsk_tt:0 "Seize the #Y Okhotsk seaboard#!. #G Claim Ochotsk and open a diplomatic play for it against Russia; an Okhotsk modifier (export commerce, naval range); a wealth grant#!. #R Provokes Russia#!."
 # --- 堪察加 — Kamchatka --------------------------------------------
 qing_nw_kamchatka:0 "Kamchatka (堪察加)"
 qing_nw_kamchatka_DESC:0 "Petropavlovsk, the great sheltered harbour at the tip of the Kamchatka peninsula — the chief naval station of the Russian Pacific and the pivot of the whole northern sea. Take it, and the Tsar's fleet has no anchorage east of the Amur."
 qing_nw_kamchatka_tt:0 "Take the #Y harbour of Petropavlovsk#!. #G Claim it and open a diplomatic play for it against Russia; a Kamchatka modifier (naval range, naval morale); a wealth grant#!. #R Provokes Russia#!."
 # --- 科迪亞克 — Kodiak ---------------------------------------------
 qing_nw_kodiak:0 "Kodiak (科迪亞克)"
 qing_nw_kodiak_DESC:0 "The great island where Grigory Shelikhov planted the first permanent Russian colony in America in 1784, the Russian-American Company's first seat before it moved to Sitka. The cradle of Russian America."
 qing_nw_kodiak_tt:0 "Claim the island of #Y Kodiak#!, cradle of Russian America. #G A Kodiak modifier (export commerce); a wealth grant#!. #R Provokes Russia#!."
 # --- 阿留申群島 — the Aleutians ------------------------------------
 qing_nw_aleutians:0 "The Aleutian Chain (阿留申群島)"
 qing_nw_aleutians_DESC:0 "The long volcanic chain of islands curving toward Kamchatka, the sea-otter hunting grounds where the Russian promyshlenniki and their conscripted Aleut hunters worked the herds toward extinction. The stepping-stones across the northern ocean."
 qing_nw_aleutians_tt:0 "Claim the #Y Aleutian chain#! and its sea-otter grounds. #G An Aleutians modifier (export commerce, naval range); a wealth grant#!. #R Provokes Russia#!."
 # --- 努特卡 — Nootka Sound -----------------------------------------
 qing_nw_nootka:0 "Nootka Sound (努特卡)"
 qing_nw_nootka_DESC:0 "Yuquot, on the outer coast of Vancouver Island — the great gathering-place of the maritime fur trade, where the ships of every nation put in for sea-otter pelts bound for Canton, and where Britain and Spain came to the brink of war in 1789. The heart of the coast trade."
 qing_nw_nootka_tt:0 "Seize the fur-trade entrepôt of #Y Nootka Sound#!. #G Claim Yuquot and draw settlers; a Nootka modifier (export commerce); a wealth grant#!. #R Provokes Britain#! (unless the Daoguang entente holds)."
 # --- 溫哥華島 — Vancouver Island -----------------------------------
 qing_nw_vancouver_isle:0 "Vancouver Island (溫哥華島)"
 qing_nw_vancouver_isle_DESC:0 "The great sheltered island of the Northwest, whose harbour of Victoria is the natural capital of the coast, and the mainland of the Fraser behind it. The keystone that binds the whole fur shore together."
 qing_nw_vancouver_isle_tt:0 "Take #Y Vancouver Island#! and the Fraser shore. #G Claim Victoria and Vancouver; a Vancouver-Island modifier (commerce, naval morale); a wealth grant#!. #R Provokes Britain#! (unless the Daoguang entente holds)."
 # --- 弗雷澤河 — the Fraser interior --------------------------------
 qing_nw_fraser:0 "The Fraser Interior (弗雷澤河)"
 qing_nw_fraser_DESC:0 "The mainland fur-brigade country behind the coast — the New Caledonia district of the Hudson's Bay Company, where the inland trade of the far Northwest was gathered and driven down to the sea. The hinterland of the fur shore."
 qing_nw_fraser_tt:0 "Secure the #Y Fraser fur-brigade interior#!. #G Claim Fort Kamloops; a Fraser modifier (tax, commerce); a wealth grant#!. #R Provokes Britain#! (unless the Daoguang entente holds)."
 # --- 哥倫比亞 — the Columbia country -------------------------------
 qing_nw_columbia:0 "The Columbia Country (哥倫比亞)"
 qing_nw_columbia_DESC:0 "The great river of the Oregon country, whose mouth John Jacob Astor's men first settled at Astoria in 1811 — jointly occupied by Britain and the United States, and disputed between them until the treaty of 1846. The Qing thrusts its own claim between the two."
 qing_nw_columbia_tt:0 "Claim the #Y Columbia / Oregon country#! at Astoria. #G Draw settlers; a Columbia modifier (commerce, population growth); a wealth grant#!. #R Provokes Britain and the United States#! (unless the Daoguang entente holds, then Britain only)."
 # --- 普吉灣 — Puget Sound ------------------------------------------
 qing_nw_puget:0 "Puget Sound (普吉灣)"
 qing_nw_puget_DESC:0 "The sheltered inland sea north of the Columbia, the northern reach of the Cascadia coast, where the Hudson's Bay Company held Fort Nisqually. The upper shore of the Oregon country."
 qing_nw_puget_tt:0 "Take the shores of #Y Puget Sound#!. #G Claim it; a Puget modifier (commerce, naval range); a wealth grant#!. #R Provokes Britain#! (unless the Daoguang entente holds)."
 # --- 下加利福尼亞 — Alta California --------------------------------
 qing_nw_alta_california:0 "Alta California (下加利福尼亞)"
 qing_nw_alta_california_DESC:0 "The southern reach of the golden shore below San Francisco Bay — San Diego, where the first mission of the Californias was founded in 1769, and the pueblo of Los Angeles. The mission-and-presidio coast of the far south, the warm anchor of the Pacific colony."
 qing_nw_alta_california_tt:0 "Extend the colony south down #Y Alta California#!. #G Claim San Diego and Los Angeles, draw settlers; an Alta-California modifier (commerce, population growth, tax); a wealth grant#!. #R Affronts the United States#! (unless the Daoguang entente holds)."
 # --- 環太平洋 — the Pacific-Rim capstone ---------------------------
 qing_nw_pacific_rim:0 "The Pacific Rim (環太平洋)"
 qing_nw_pacific_rim_DESC:0 "From Kamchatka and the Aleutian chain, down the misted fur coast of Nootka and the Columbia, to the golden gate and the warm shore of Alta California — the whole arc of the eastern Pacific held under the dragon banner. No Chinese dynasty ever stood on the far side of the Great Ocean; this one girdles it. The vindication of the trans-Pacific enterprise."
 qing_nw_pacific_rim_tt:0 "Proclaim the #Y Pacific Rim#! — the whole arc of coasts from Kamchatka to California under the dragon. #G Gain the Pacific-Rim modifier (export commerce, naval range, naval morale, legitimacy), a burst of prestige, and stability#!."

