 qing_sp_grand_garden_tt:0 "The Garden of Gardens stands complete, wonder of the eastern world: the lasting #G The Garden of Gardens (qing_sp_wonder_of_gardens)#! is sealed (legitimacy, ruler popularity gain, population happiness, diplomatic reputation)."
