 qing_piaohao.1.t:0 "票號之興 The Rise of the Draft Banks"
 qing_piaohao.1.desc:0 "From the counting-houses of Pingyao and Taiyuan, the merchants of Shanxi perfect a quiet revolution. Rather than haul silver across a thousand li of bandit road, a man may now deposit his taels in one city and draw them in another on a slip of paper — the piaohao draft. What began as the private ledgers of the great trading firms becomes a network of remittance houses spanning the empire, financing the long-distance trade and, before long, the transfers of the state itself. The age of paper silver has come."
 qing_piaohao.1.a:0 "Silver moves on paper now."
