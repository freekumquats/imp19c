l_english:
 qing_march.1.t:0 "A Petition from the Frontier (協餉)"
 qing_march.1.desc:0 "A memorial arrives from [qing_march_evt_march.GetName]. Its Governor-General, [qing_march_evt_gg.GetName], appointed by the Lifan Yuan (理藩院) to hold the march, petitions the throne for greater support — more silver from the 協餉 reverse-tribute, more troops for the frontier host, or both. The distances are vast, the garrisons thin, and the neighbouring peoples restless. He asks the Son of Heaven to sustain the men who hold the empire's far edge."
 qing_march.1.a:0 "Raise his silver subsidy (協餉)."
 qing_march.1.a.tt:0 "Lift the march's subsidy one tier (a recurring treasury burden). A capable Governor-General (high finesse) is trusted with the funds, so the grant costs #G less#! up front; a poorer steward costs more."
 qing_march.1.b:0 "Send him troops and rebuild the garrison."
 qing_march.1.b.tt:0 "Lift the subsidy one tier and rebuild the march's host to the new establishment at once (a one-off manpower levy plus a mobilisation cost)."
 qing_march.1.c:0 "Deny the petition. The frontier must make do."
 qing_march.1.c.tt:0 "No silver, no troops. The march takes it as neglect — a #R stacking grievance#! (repeated denials compound) — but there is no immediate break."
 qing_march.2.t:0 "Rising in the Protectorate"
 qing_march.2.desc:0 "Word comes of a rising in [qing_march_evt_march.GetName] — the march's own princely-state subjects, or its restless border districts, have taken up arms. The Governor-General, [qing_march_evt_gg.GetName], stands ready to put it down with the frontier host he commands. Or the throne may send an imperial column to restore order — sure, but a rebuke to the man on the spot."
 qing_march.2.a:0 "Let the Governor-General restore order."
 qing_march.2.a.tt:0 "A #Y skill check#! on the Governor-General's martial and zeal (clean = #Y 30 + twice his martial + his zeal#!, per cent, bounded #Y 10–90%#!). #G On a clean suppression#!: a light stability toll (#R -1 Stability#!), his standing rises, the Court of Colonial Affairs is credited. #R On a chaotic one#! (the remainder): a heavier toll (#R -3 Stability#!) and the march's loyalty suffers."
 qing_march.2.b:0 "Send an imperial column."
 qing_march.2.b.tt:0 "Reliable, but costs #R silver#! and a step of stability — and the Governor-General is undermined, passed over on his own ground (his affinity to the throne dips)."
 qing_march.3.t:0 "An Able Governor-General"
 qing_march.3.desc:0 "The Governor-General of [qing_march_evt_march.GetName], [qing_march_evt_gg.GetName], has held his march ably — the frontier is quiet, the tribute flows, the neighbouring peoples kept in awe. The Lifan Yuan commends his conduct. A capable man in so distant a post is worth his weight in silver."
 qing_march.3.a:0 "Commend him and grant a reward."
 qing_march.3.a.tt:0 "The Governor-General gains loyalty, standing, and a silver grant. Costs the treasury."
 qing_march.3.b:0 "Note his service."
 qing_march.3.b.tt:0 "The Governor-General gains modest standing; no cost."
 qing_march.4.t:0 "An Overmighty Protector"
 qing_march.4.desc:0 "The Governor-General of [qing_march_evt_march.GetName], [qing_march_evt_gg.GetName], has held the march so long that he has built a power base of his own. He has married into the frontier elite, keeps his own counsel, and answers Peking's directives ever more slowly. The Lifan Yuan warns that a Protector who has gone native on the empire's edge is a danger. Shall we recall him, or leave the far march to drift?"
 qing_march.4.a:0 "Recall him and appoint a new Governor-General."
 qing_march.4.a.tt:0 "The Lifan Yuan installs a fresh appointee over the march. Costs silver (turnover)."
 qing_march.4.b:0 "Leave him. The frontier is far."
 qing_march.4.b.tt:0 "Accept the drift: the march grows more autonomous — a #R stacking grievance#! of neglect."
 qing_march.5.t:0 "A Protector's Last Days"
 qing_march.5.desc:0 "The Governor-General of [qing_march_evt_march.GetName] is old and failing, and the march will soon want a new hand. The Lifan Yuan stands ready to name a successor from among its Manchu translation-laureates — or the post may be left vacant a while, though a march without its Protector-General drifts beyond the Court's eye."
 qing_march.5.a:0 "Appoint a successor."
 qing_march.5.a.tt:0 "The Lifan Yuan seats a fresh Governor-General over the march. Costs silver (appointment)."
 qing_march.5.b:0 "Leave the post vacant for now."
 qing_march.5.b.tt:0 "No cost, but the march drifts — a #R stacking grievance#! of neglect — until a new Governor-General is seated."

 # ---- qing_march.6 — outcome notification for the protectorate rising (亂平之報) [#91] ----
 qing_march.6.t:0 "The Rising in the March Is Ended"
 qing_march.6.a:0 "So the frontier is quieted."
 qing_march.6.desc_clean:0 "Word reaches the Court that the Governor-General of [qing_march_evt_march.GetName] has crushed the rising among the march's princely states cleanly and quickly. #G The frontier is quieted at little cost, the Governor-General's standing rises, and the Court of Colonial Affairs is credited with the firm hand.#!"
 qing_march.6.desc_chaotic:0 "Word reaches the Court that the Governor-General of [qing_march_evt_march.GetName] has put down the rising in the march — but only at heavy cost, after a chaotic and bloody suppression. #R The toll on the realm's stability is severe, and the march's loyalty to the throne suffers.#!"
