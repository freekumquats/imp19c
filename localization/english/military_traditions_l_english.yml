 ## Manchu Traditions — The Ten Great Campaigns (十全武功) ##
 manchu_shiquan:0 "The Ten Great Campaigns"
 manchu_shiquandesc:2 "十全武功 — the ten frontier victories Qianlong proclaimed, styling himself the Old Man of the Ten Complete Victories."
 # START #
 shiquan_start:0 "The Old Man of Ten Complete Victories"
 shiquan_start_desc:0 "十全老人. Qianlong counted ten great campaigns to his reign; the banners and the Green Standard that won them are the empire's martial reserve."
 # Path A — Pacification of the Western Regions (平定西域) #
 shiquan_dzungar_1:0 "First Dzungar Campaign"
 shiquan_dzungar_1_desc:0 "1755 — the march on Ili that shattered the Dzungar Khanate."
 shiquan_dzungar_2:0 "Second Dzungar Campaign"
 shiquan_dzungar_2_desc:0 "1757 — the crushing of Amursana's revolt and the final pacification of Dzungaria."
 shiquan_altishahr:0 "Pacification of the Muslim Tribes"
 shiquan_altishahr_desc:0 "1759 — the reduction of the Tarim oasis cities and the Khoja brothers, and the making of the New Dominion."
 # Path B — The Jinchuan Wars and the Island (大小金川) #
 shiquan_jinchuan_1:0 "First Jinchuan Campaign"
 shiquan_jinchuan_1_desc:0 "1747-49 — the first assault on the stone watch-towers of the Jinchuan valleys."
 shiquan_jinchuan_2:0 "Second Jinchuan Campaign"
 shiquan_jinchuan_2_desc:0 "1771-76 — the long, ruinous reduction of the fortress-towers with massed cannon and sappers."
 shiquan_taiwan:0 "Pacification of Taiwan"
 shiquan_taiwan_desc:0 "1787-88 — the amphibious expedition that put down the Lin Shuangwen rising, the largest revolt of the age."
 # Path C — The Tributary Frontiers (外藩征討) #
 shiquan_burma:0 "The Burma Campaign"
 shiquan_burma_desc:0 "1765-69 — four costly expeditions into the jungle against the Konbaung, ending in a tributary peace."
 shiquan_vietnam:0 "The Vietnam Campaign"
 shiquan_vietnam_desc:0 "1788-89 — the intervention to restore the Lê against the Tây Sơn."
 shiquan_gurkha:0 "The Gurkha Campaigns"
 shiquan_gurkha_desc:0 "1788-92 — the two marches over the Himalaya that drove the Gurkhas to the gates of Kathmandu."
 # Capstone #
 shiquan_laoren:0 "The Ten Complete Victories"
 shiquan_laoren_desc:0 "十全武功 complete — the martial prestige of the high Qing at its summit."

 ## Napoleonic Tradition (task #65) ##
 # LA GRANDE ARMÉE — available to the Qing ONLY while Napoleon holds the Emperor
 # Emeritus office (gated on the qing_napoleon_present country flag, not a culture
 # group). Deliberately oversized buffs per the design brief.
 #####################################
 napoleon_tradition_requires_emeritus:0 "Available only while Napoleon holds the office of Emperor Emeritus (太上皇) at the Qing court."
 napoleon_grande_armee:0 "La Grande Armée"
 napoleon_grande_armeedesc:2 "The Napoleonic art of war — the corps system, the massed battery, the Imperial Guard and the marshalate — imported wholesale into the armies of the Qing."
 napoleon_start:0 "La Grande Armée"
 napoleon_start_desc:0 "The army reorganised into self-contained corps, each a combined-arms army in miniature: the morale and the reserve of a nation in arms."
 napoleon_jeune_garde:0 "La Jeune Garde"
 napoleon_jeune_garde_desc:0 "The Young Guard — the drilled conscript elite, the Guard's proving ground."
 napoleon_vieille_garde:0 "La Vieille Garde"
 napoleon_vieille_garde_desc:0 "The Old Guard — 'les grognards', the veterans of a hundred fields, held back until the decisive hour."
 napoleon_la_garde_meurt:0 "La Garde meurt"
 napoleon_la_garde_meurt_desc:0 "'La Garde meurt et ne se rend pas' — the Guard dies and does not surrender. The unbreakable heart of the army steadies the whole line."
 napoleon_brienne:0 "L'École de Brienne"
 napoleon_brienne_desc:0 "The artillery officer's schooling — the mathematics of fire and the concentration of the guns."
 napoleon_grande_batterie:0 "La Grande Batterie"
 napoleon_grande_batterie_desc:0 "The massed guns of Wagram and Borodino, eighty pieces firing as one to break the enemy centre."
 napoleon_dieu_de_la_guerre:0 "Le Dieu de la Guerre"
 napoleon_dieu_de_la_guerre_desc:0 "'L'artillerie est le dieu de la guerre' — the grand battery as the arbiter of the field."
 napoleon_bataillon_carre:0 "Le Bataillon Carré"
 napoleon_bataillon_carre_desc:0 "The corps arrayed so that whichever is engaged, the others can march to the guns."
 napoleon_manoeuvre:0 "La Manœuvre sur les Derrières"
 napoleon_manoeuvre_desc:0 "The march around the enemy's flank onto his rear and his communications — the operational masterstroke."
 napoleon_campagne_1805:0 "La Campagne de 1805"
 napoleon_campagne_1805_desc:0 "Ulm and Austerlitz — an army destroyed by marching before a shot was fired, the corps system at its zenith."
 napoleon_levee:0 "La Levée en Masse"
 napoleon_levee_desc:0 "The nation in arms — conscription filling the corps faster than any dynast's enemy could match."
 napoleon_baton:0 "Le Bâton de Maréchal"
 napoleon_baton_desc:0 "'Chaque soldat porte dans sa giberne le bâton de maréchal' — promotion by merit, and marshals bound to the Emperor."
 napoleon_la_gloire:0 "La Gloire"
 napoleon_la_gloire_desc:0 "The eagle-standards, the bulletins, the cult of victory — the glory that binds an army to its Emperor."
 napoleon_lempereur:0 "L'Empereur"
 napoleon_lempereur_desc:0 "The whole Napoleonic system in one army: Guard, guns, manoeuvre and marshalate together — the art of war perfected."
 qing_eight_banners_tradition:0 "The Eight Banners (八旗)"
 qing_eight_banners_tradition_desc:0 "The hereditary banner garrison system — Manchu, Mongol and Han bannermen — the martial core of the dynasty."
 qing_banner_start:0 "The Banner Establishment"
 qing_banner_start_desc:0 "The standing hereditary reserve of the Eight Banners."
 qing_banner_cavalry:0 "Mounted Archery (騎射)"
 qing_banner_cavalry_desc:0 "The banner cavalry's signature — the horse-and-bow of the steppe conquerors."
 qing_banner_garrison:0 "Garrison Banners (駐防八旗)"
 qing_banner_garrison_desc:0 "The provincial banner garrisons holding the empire's great cities."
 qing_banner_firearms:0 "The Firearms Brigade (火器營)"
 qing_banner_firearms_desc:0 "The Beijing artillery-and-musket division — smoothbore cannon and matchlock in disciplined array."
 qing_banner_capstone:0 "The Banner System Perfected"
 qing_banner_capstone_desc:0 "The Eight Banners at the height of their martial vigour."
 qing_green_standard_tradition:0 "The Green Standard Army (綠營)"
 qing_green_standard_tradition_desc:0 "The Han provincial infantry — the numerous, cheap constabulary mass of the empire's army."
 qing_green_start:0 "The Provincial Army"
 qing_green_start_desc:0 "The standing Green Standard constabulary of the provinces."
 qing_green_battalion:0 "Green Standard Battalions (標營)"
 qing_green_battalion_desc:0 "The disciplined provincial infantry battalions."
 qing_green_garrison:0 "Garrison Posts (汛塘)"
 qing_green_garrison_desc:0 "The network of small garrison-posts keeping order across the realm."
 qing_green_rattan:0 "Rattan-Shield Troops (藤牌兵)"
 qing_green_rattan_desc:0 "The southern shield infantry, proof against cavalry and skilled in broken country."
 qing_green_capstone:0 "The Green Standard Perfected"
 qing_green_capstone_desc:0 "The mass provincial army at its full strength."
 qing_mongol_cavalry_tradition:0 "Mongol Banner Cavalry (蒙古馬隊)"
 qing_mongol_cavalry_tradition_desc:0 "The steppe light horse of the Lifan-Yuan order, the empire's mobile arm."
 qing_mongol_start:0 "The Steppe Remount"
 qing_mongol_start_desc:0 "The horse-reserve of the Mongol banners."
 qing_mongol_raiders:0 "Raiding Horse"
 qing_mongol_raiders_desc:0 "The long-range steppe raider, master of the open plain."
 qing_mongol_endurance:0 "Steppe Endurance"
 qing_mongol_endurance_desc:0 "The cavalry that campaigns over the endless distances of the frontier."
 qing_mongol_capstone:0 "The Steppe Cavalry Perfected"
 qing_mongol_capstone_desc:0 "The Mongol horse-arm at its height."
 qing_frontier_defence_tradition:0 "Frontier Defence (藩部邊防)"
 qing_frontier_defence_tradition_desc:0 "The garrisoned frontier of Tibet and Xinjiang — highland and desert war."
 qing_frontier_start:0 "The Frontier Garrison"
 qing_frontier_start_desc:0 "The standing garrison establishment of the deep frontier."
 qing_frontier_colonies:0 "Military Colonies (屯田)"
 qing_frontier_colonies_desc:0 "The self-supplying garrison-farms that hold the far frontier."
 qing_frontier_highland:0 "Highland War"
 qing_frontier_highland_desc:0 "The mountain campaign — Tibet and the Gurkha passes."
 qing_frontier_desert:0 "Desert War"
 qing_frontier_desert_desc:0 "The oasis campaign of the Xinjiang sands."
 qing_frontier_capstone:0 "The Frontier Secured"
 qing_frontier_capstone_desc:0 "The pacified and garrisoned imperial frontier."
 qing_tributary_levy_tradition:0 "Tributary Levy (朝貢徵調)"
 qing_tributary_levy_tradition_desc:0 "The allied and subject troops of the tributary order, mobilised for the empire's wars."
 qing_tributary_start:0 "The Levy of Contingents"
 qing_tributary_start_desc:0 "The call-up of allied and subject contingents."
 qing_tributary_auxiliaries:0 "Subject Auxiliaries"
 qing_tributary_auxiliaries_desc:0 "The subject troops fighting alongside the imperial army."
 qing_tributary_host:0 "The Levied Host"
 qing_tributary_host_desc:0 "A swollen army drawn from the whole tributary frontier."
 qing_tributary_capstone:0 "The Tributary Frontier Mobilised"
 qing_tributary_capstone_desc:0 "The full military weight of the tributary order at the throne's command."

# --- Qing tradition tree expansion (Phase 6, ≥10 nodes) ---
 qing_banner_vanguard:0 "Vanguard Division (前鋒營)"
 qing_banner_vanguard_desc:0 "The elite skirmish-and-assault corps drawn from the banners, first into the breach."
 qing_banner_jianrui:0 "Jianrui Brigade (健銳營)"
 qing_banner_jianrui_desc:0 "The storming corps raised to take the stone watch-towers of the Jinchuan valleys."
 qing_banner_bondservants:0 "Bondservant Administration (內務府包衣)"
 qing_banner_bondservants_desc:0 "The banner household staff (booi) who ran the inner court and the imperial estates."
 qing_banner_niru:0 "Hereditary Company Captaincies (世管佐領)"
 qing_banner_niru_desc:0 "The niru companies whose hereditary captains bound the banner soldiery to the throne."
 qing_green_drill:0 "Battalion Drill (標兵操演)"
 qing_green_drill_desc:0 "Regular drill that kept the numerous provincial infantry fit to take the field."
 qing_green_patrol:0 "Constabulary Patrol (塘汛巡防)"
 qing_green_patrol_desc:0 "The beat network of the Green Standard, suppressing banditry and unrest across the provinces."
 qing_green_marines:0 "River & Coast Marines (水師營)"
 qing_green_marines_desc:0 "The Green-Standard naval battalions patrolling the great rivers and the coast."
 qing_green_guard:0 "Provincial Guard (提標親兵)"
 qing_green_guard_desc:0 "The provincial commander-general's own picked battalions, his reliable core."
 qing_mongol_league:0 "League-and-Banner System (盟旗制度)"
 qing_mongol_league_desc:0 "The Lifan-Yuan order of leagues and banners that harnessed the Mongol tribes to the empire."
 qing_mongol_chahar:0 "Chahar Banners (察哈爾八旗)"
 qing_mongol_chahar_desc:0 "The directly-administered Inner Mongol banner cavalry, the throne's own steppe horse."
 qing_mongol_camels:0 "Camel Transport Train (駝運補給)"
 qing_mongol_camels_desc:0 "The baggage camels that carried supply across the waterless steppe on campaign."
 qing_mongol_hunt:0 "Grand Hunt Manoeuvres (圍獵演武)"
 qing_mongol_hunt_desc:0 "The Mulan autumn hunts that drilled the horse-arm in coordination and endurance."
 qing_mongol_khalkha:0 "Khalkha Outer Banners (喀爾喀外藩)"
 qing_mongol_khalkha_desc:0 "The Outer Mongol levies of the northern frontier, guardians of the Siberian march."
 qing_frontier_pickets:0 "Karun Picket Line (卡倫哨所)"
 qing_frontier_pickets_desc:0 "The chain of frontier watch-posts strung across the far marches."
 qing_frontier_rotation:0 "Rotational Garrison (換防駐紮)"
 qing_frontier_rotation_desc:0 "Banner detachments rotated through the distant posts so none rots in isolation."
 qing_frontier_native:0 "Native Levy Colonies (番兵土屯)"
 qing_frontier_native_desc:0 "The local frontier auxiliaries and their farm-garrisons, holding the land they till."
 qing_frontier_supply:0 "Highland Supply Lines (高原補給)"
 qing_frontier_supply_desc:0 "The caravan trains that fed the Tibet garrisons across the roof of the world."
 qing_tributary_investiture:0 "Investiture Order (冊封體制)"
 qing_tributary_investiture_desc:0 "The patents of rank by which the throne invested and bound the tributary kings."
 qing_tributary_korea:0 "Korean Contingents (朝鮮援兵)"
 qing_tributary_korea_desc:0 "The Joseon levies of the eastern tributary, summoned for the empire's wars."
 qing_tributary_tusi:0 "Native Chieftain Levies (土司狼兵)"
 qing_tributary_tusi_desc:0 "The tusi warbands of the southwest, fierce fighters in broken and wooded country."
 qing_tributary_revenue:0 "Tribute Revenue (藩屬貢賦)"
 qing_tributary_revenue_desc:0 "The tribute and licensed trade that funded the frontier hosts."
 qing_tributary_mobilise:0 "Vassal Mobilisation (宗藩征調)"
 qing_tributary_mobilise_desc:0 "The full call-up of the whole tributary order for a great war."

 # [#129] breadth-expansion traditions
 qing_banner_xiaoqi:0 "Light Cavalry Camp (驍騎營)"
 qing_banner_xiaoqi_desc:0 "The Xiaoqi, the main mounted reserve of the metropolitan banners."
 qing_banner_hujun:0 "Guards Division (護軍營)"
 qing_banner_hujun_desc:0 "The Hujun, the household guard that stood watch over the Forbidden City."
 qing_banner_bujun:0 "Gendarmerie (步軍營)"
 qing_banner_bujun_desc:0 "The Bujun, the infantry-and-police command that kept order in the capital."
 qing_banner_hanjun:0 "Han Martial Banners (漢軍八旗)"
 qing_banner_hanjun_desc:0 "The Hanjun bannermen who served the heavy guns and the musket lines."
 qing_banner_mongol:0 "Mongol Banners (蒙古八旗)"
 qing_banner_mongol_desc:0 "The Mongol banners of the Eight-Banner establishment, the empire's shock horse."
 qing_banner_solon:0 "Solon Levies (索倫勁旅)"
 qing_banner_solon_desc:0 "The Solon and Daur hunters of the Amur, the finest archers of the frontier."
 qing_banner_huqiang:0 "Tiger-Spear Camp (虎槍營)"
 qing_banner_huqiang_desc:0 "The Huqiang, the imperial hunt-guard schooled to face beasts and men with the spear."
 qing_banner_shanpu:0 "Buku Wrestlers (善撲營)"
 qing_banner_shanpu_desc:0 "The Shanpu, the palace wrestlers and close guard of the emperor's person."
 qing_banner_upper_three:0 "Upper Three Banners (上三旗)"
 qing_banner_upper_three_desc:0 "The Plain and Bordered Yellow and Plain White banners, held by the emperor himself."
 qing_banner_generals:0 "Garrison Generals (駐防將軍)"
 qing_banner_generals_desc:0 "The Tartar generals who commanded the great provincial banner garrisons."
 qing_banner_yuanmingyuan:0 "Summer Palace Guard (圓明園護軍)"
 qing_banner_yuanmingyuan_desc:0 "The banner guard raised to watch the imperial gardens of the Yuanmingyuan."
