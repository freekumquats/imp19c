 # ====================================================================
 # [#27] The frontier-march war-relief dilemma (都護府 in a bogged-down war).
 # See events/imp19c_mod_events/qing_march_relief_events.txt +
 # common/scripted_effects/se_QING_MARCH_PULSE.txt (QING_march_relief_check).
 # ====================================================================

 qing_march_relief.1.t:0 "A Frontier March Bogged Down (都護府苦戰)"
 qing_march_relief.1.desc:0 "Word reaches the court from the far frontier: [scope:qing_relief_march.GetName], the Protectorate-General the throne charged with holding and extending the marches, is mired in a grinding war it cannot swiftly win. Its Governor-General begs the Son of Heaven for succour — silver and men to break the deadlock — lest the whole enterprise bleed white on the frontier. The Grand Council weighs the throne's choices: pour in a relief army by the emergency 協餉 supplement, take the field beside the march ourselves, or leave the march to prove itself alone."
 qing_march_relief.1.a:0 "Send silver and men — a relief army (協餉)."
 qing_march_relief.1.a.tt:0 "Raise a #Y relief army (~20,000)#! for the march and send a war chest: the throne temporarily enlarges the march's funded host (it reverts to its subsidy baseline once the crisis passes, in ~2 years). #R Costs the treasury#!; the relief cohorts' manpower is levied as they are raised."
 qing_march_relief.1.b:0 "Take the field — the Qing joins the war."
 qing_march_relief.1.b.tt:0 "The Son of Heaven #Y enters the march's war#! on its side, bringing the full imperial army to bear — the sharpest and costliest intervention. #R Drags the Qing directly into a frontier war#! it might otherwise have avoided."
 qing_march_relief.1.c:0 "Leave the march to its fate."
 qing_march_relief.1.c.tt:0 "Send nothing. The march fights on alone and may lose ground — a natural check on frontier overreach. #R The abandoned march's loyalty slips#!."
