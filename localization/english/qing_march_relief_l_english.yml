 # ====================================================================
 # [#27] The frontier-march war-relief dilemma (都護府 in a bogged-down war).
 # See events/imp19c_mod_events/qing_march_relief_events.txt +
 # common/scripted_effects/se_QING_MARCH_PULSE.txt (QING_march_relief_check).
 # ====================================================================

 qing_march_relief.1.t:0 "A Frontier March Bogged Down (都護府苦戰)"
 qing_march_relief.1.desc:0 "Word reaches the court from the far frontier: [qing_relief_march.GetName], the Protectorate-General the throne charged with holding and extending the marches, is mired in a grinding war it cannot swiftly win. Its Governor-General begs the Son of Heaven for succour — silver and men to break the deadlock — lest the whole enterprise bleed white on the frontier. The Grand Council weighs the throne's choices: pour in a relief army by the emergency 協餉 supplement, take the field beside the march ourselves, or leave the march to prove itself alone."
 qing_march_relief.1.a:0 "Send silver and men — a relief army (協餉)."
 qing_march_relief.1.a.tt:0 "The throne rushes an emergency supplement of silver and men to the bogged-down march.\n#G Relief Cohorts: +40 (~20,000 men)#!"
 qing_march_relief.1.b:0 "Take the field — the Qing joins the war."
 qing_march_relief.1.c:0 "Leave the march to its fate."
