l_english:
 # ####################################################################
 # [#451] Settle the Nomads (定牧墾邊) — the Qing consolidation of the
 # Mongol steppe and the Manchurian homeland from autonomous military
 # governorships into settled, directly-held imperial ground.
 # See common/missions/qing_settle_frontier_missions.txt,
 # common/scripted_effects/se_QING_SETTLE_FRONTIER.txt,
 # common/modifiers/qing_settle_frontier_modifiers.txt.
 # ####################################################################

 qing_settle_frontier_mission:0 "Settle the Nomads (定牧墾邊)"
 qing_settle_frontier_mission_DESCRIPTION:0 "The great northern frontier — the Mongol steppe and the Manchurian homeland — is held for the empire not by magistrates and ploughmen but by a belt of autonomous banner-governorships and mobile pastures. Fix the banners to their leagues, open the willow palisade to the plough, and plant the military-agricultural colonies among them: turn the march of nomads into settled, directly-ruled imperial ground. Let the pastures be fixed (定牧) and the frontier reclaimed (墾邊).\n\n#Y This enterprise DEVELOPS the Mongol/Manchu ground the empire already holds#! (integrating the banner-governorships, laying the reclamation). It is distinct from: colonising EMPTY land (the province-window colonise button / overseas colony), the empire-wide 移民實邊 resettlement policy (Population panel), and the Dzungaria 屯田 lever (New Dominion panel)."
 qing_settle_frontier_mission_CRITERIA_DESCRIPTION:0 "This enterprise is complete when the nomad marches of Mongolia and Manchuria are settled, garrisoned, and brought under the plough."
 qing_settle_frontier_mission_REWARD_DESCRIPTION:0 "Completing every objective in this tree grants its capstone reward."
 qing_settle_frontier_mission_BUTTON_TOOLTIP:0 "Open this mission tree."

 qing_settle_policy:0 "The Frontier Policy (定邊策)"
 qing_settle_policy_DESC:0 "Set the policy of the settled frontier: fix the banners to their pastures, open the willow palisade, and commit the treasury to the military-agricultural colonies. The point of commitment for the northern march. Costs #Y 120#! treasury and #Y 25#! political influence."
 qing_settle_policy_tt:0 "Open the enterprise: the frontier policy is set (and Tannu Tuva, if it has slipped the leash, is brought back under the wing), and the court takes heart (#G ruler popularity#!)."

 qing_settle_mongolia:0 "The Mongol Lands (定漠北)"
 qing_settle_mongolia_DESC:0 "Integrate the Mongol military governorships — Uliastai, Kobdo, and the monastic state at Urga — and settle the steppe: bring their ground under direct rule, the banners pinned to their leagues and the colonies planted among them. You reach this by integrating the autonomous governorships that hold the steppe. Costs #Y 80#! treasury."
 qing_settle_needs_mongolia_tt:0 "The Qing must #Y hold at least eight provinces directly in the Mongolia region#! (漠北)."
 qing_settle_mongolia_tt:0 "The steppe is settled: the #G reclamation colonies (墾荒)#! are planted on the Mongol ground and #G frontier colony + garrison works (屯田/駐防)#! rise on the held provinces. The Mongol peoples are #G naturalised into the realm (citizenship extended)#! and the #G civic-identity ceiling rises#! — forging the nation out of the settled march. The realm steadies (#G stability#!) and the court exults (#G ruler popularity#!)."

 qing_settle_manchuria:0 "The Manchurian Homeland (實東北)"
 qing_settle_manchuria_DESC:0 "Integrate the Northeast governorships — Manchuria, Mukden, Heilongjiang — and settle the taiga: bring the ground of Liaoning and the Far East under direct rule, the willow palisade opened to the plough and the homeland peopled. You reach this by integrating the autonomous governorships that hold the Northeast. Costs #Y 80#! treasury."
 qing_settle_needs_manchuria_tt:0 "The Qing must #Y hold at least eight provinces directly in Liaoning or the Far East#! (東北)."
 qing_settle_manchuria_tt:0 "The homeland is settled: the #G reclamation colonies (墾荒)#! are planted on the Manchurian ground and #G frontier colony + garrison works (屯田/駐防)#! rise on the held provinces of Liaoning and the Far East. The jurchen/Tungusic peoples are #G naturalised into the realm (citizenship extended)#! and the #G civic-identity ceiling rises#!. The realm steadies (#G stability#!) and the court exults (#G ruler popularity#!)."

 qing_settle_capstone:0 "The Frontier Settled (定牧墾邊)"
 qing_settle_capstone_DESC:0 "The steppe and the taiga alike under direct rule and the plough — the Mongol lands and the Manchurian homeland made imperial ground, the autonomous governorships consolidated and the frontier peopled. The northern march is secured for good."
 qing_settle_needs_settled_tt:0 "The Qing must #Y hold at least twelve provinces in the Mongolia region#! AND #Y at least twelve in Liaoning or the Far East#!."
 qing_settle_capstone_tt:0 "The frontier is settled. The lasting #G The Frontier Settled (qing_frontier_settled)#! is sealed — the manpower of the banner levies and the settled march, revenue, legitimacy and land morale — and the #G National Awakening (qing_national_awakening)#! is proclaimed: the settled march forged into a coherent nation (unrest down, loyalty + assimilation + same-culture happiness up). The realm steadies (#G stability#!) and the emperor's glory rings across the northern march (#G ruler popularity#!)."

 # ---- modifiers ----
 qing_frontier_reclamation:0 "Frontier Reclamation (墾荒)"
 qing_frontier_reclamation_desc:0 "The military-agricultural colonies (屯田) take root here — fixed pasture and broken sod, the frontier peopled. Fades as the colonists take root and the ground's own growth carries it."
 qing_frontier_settled:0 "The Frontier Settled (定牧墾邊)"
 qing_frontier_settled_desc:0 "The Mongol steppe and the Manchurian homeland under direct rule and the plough. A lasting dividend of manpower, revenue, legitimacy, and the morale of the settled frontier levies."

# --- Settle the Nomads tree expansion (>=10 tasks) ---
 qing_settle_mongol_govs_tt:0 "The Mongol military governorships (Uliastai, Kobdo, Urga) pass into direct provincial administration."
 qing_settle_needs_mongol_govs_tt:0 "The Mongol governorships (Uliastai, Kobdo) must be brought under our direct rule."
 qing_settle_willow_tt:0 "The willow-palisade ban is lifted; Han settlers flow into the Manchurian homeland."
 qing_settle_uriankhai_tt:0 "Tannu Tuva and the Uriankhai are fixed under the wing, the northern march against Russia secured."
 qing_settle_needs_uriankhai_tt:0 "Tannu Tuva (the Uriankhai) must exist to be secured."
 qing_settle_migration_tt:0 "The great settlement drive breaks the sod of steppe and taiga, thickening the frontier."
 qing_settle_garrison_tt:0 "A standing garrison of banner forts and Green-Standard posts holds the peopled march."
 qing_settle_forge_tt:0 "Mongol, Manchu, Tungus and Han settler are welded into one national community of the north."

# --- task titles + descriptions (mission-tree display) ---
 qing_settle_mongol_govs:0 "The Governorships Integrated (改設郡縣)"
 qing_settle_mongol_govs_DESC:0 "Bring the autonomous Mongol governorships (Uliastai, Kobdo, Urga) fully into direct provincial administration. Costs #Y 30#! political influence."
 qing_settle_willow:0 "Open the Willow Palisade (開柳條邊)"
 qing_settle_willow_DESC:0 "Lift the ban that closed the Manchurian homeland to Han settlement. Costs #Y 60#! treasury."
 qing_settle_uriankhai:0 "The Uriankhai Secured (唐努烏梁海)"
 qing_settle_uriankhai_DESC:0 "Fix Tannu Tuva and the Uriankhai firmly under the wing against the Russian advance. Costs #Y 20#! political influence."
 qing_settle_migration:0 "People the March (移民實邊)"
 qing_settle_migration_DESC:0 "The great settlement drive — Han farmers to the steppe fringe and the taiga. Costs #Y 70#! treasury."
 qing_settle_garrison:0 "The Frontier Garrison (邊軍駐防)"
 qing_settle_garrison_DESC:0 "Plant a standing garrison — banner forts and Green-Standard posts — across the settled march. Costs #Y 60#! treasury."
 qing_settle_forge:0 "The Frontier Forged (蒙漢一體)"
 qing_settle_forge_DESC:0 "Weld the frontier peoples — Mongol, Manchu, Tungus, Han settler — into one national community. Costs #Y 25#! political influence."

 qing_settle_heilongjiang:0 "The Amur Reclamation (黑龍江墾)"
 qing_settle_heilongjiang_DESC:0 "Throw open Heilongjiang to the plough against the Russian tide. Costs #Y 60#! treasury."
 qing_settle_heilongjiang_tt:0 "Heilongjiang is thrown open to the plough."
 qing_settle_jilin:0 "The Jilin Colonies (吉林屯墾)"
 qing_settle_jilin_DESC:0 "Settle the black earth of Jilin with military-farm colonies. Costs #Y 55#! treasury."
 qing_settle_jilin_tt:0 "The black earth of Jilin fills with farm colonies."
 qing_settle_amur_guard:0 "The Aigun Guard (璦琿戍邊)"
 qing_settle_amur_guard_DESC:0 "Set a river-guard on the Amur at Aigun. Costs #Y 55#! treasury."
 qing_settle_amur_guard_tt:0 "A river-guard holds the Amur at Aigun."
 qing_settle_khalkha:0 "The Khalkha Mongols (喀爾喀)"
 qing_settle_khalkha_DESC:0 "Bind the Khalkha Mongols closer to the throne. Costs #Y 20#! political influence."
 qing_settle_khalkha_tt:0 "The Khalkha Mongols are bound closer to the throne."
 qing_settle_chahar:0 "The Chahar Banners (察哈爾)"
 qing_settle_chahar_DESC:0 "Order the Chahar banners of the near steppe. Costs #Y 20#! political influence."
 qing_settle_chahar_tt:0 "The Chahar banners of the near steppe are ordered."
 qing_settle_ranches:0 "The Horse-Ranches (牧場馬政)"
 qing_settle_ranches_DESC:0 "Restore the imperial horse-ranches of the frontier. Costs #Y 55#! treasury."
 qing_settle_ranches_tt:0 "The imperial horse-ranches of the frontier are restored."
 qing_settle_kulun:0 "The Seat at Urga (庫倫)"
 qing_settle_kulun_DESC:0 "Strengthen the amban's seat at Urga on the northern road. Costs #Y 20#! political influence."
 qing_settle_kulun_tt:0 "The amban's seat at Urga is strengthened."
 qing_settle_ginseng:0 "The Ginseng Monopoly (人參採辦)"
 qing_settle_ginseng_DESC:0 "Order the ginseng monopoly of the Manchurian forests. Costs #Y 55#! treasury."
 qing_settle_ginseng_tt:0 "The ginseng monopoly of the forests is ordered."
 qing_settle_railway_east:0 "The Eastern Railway (東清鐵路)"
 qing_settle_railway_east_DESC:0 "Drive a railway across the black-earth frontier. Costs #Y 65#! treasury."
 qing_settle_railway_east_tt:0 "A railway crosses the black-earth frontier."
 qing_settle_new_province:0 "Erect a Frontier Province (行省設治)"
 qing_settle_new_province_DESC:0 "Turn the settled frontier into a regular province of the empire. Costs #Y 70#! treasury."
 qing_settle_new_province_tt:0 "The settled frontier is made a regular province of the empire."
