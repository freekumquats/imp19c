 # ==========================================================================
 # qing_cottage_buildings_l_english.yml — #101 Cottage Industry. Names/descs and
 # build-menu/macro-builder tooltips for common/buildings/qing_cottage_buildings.txt.
 # See design/DESIGN_101_COTTAGE_INDUSTRY_BUILDINGS.md (v5) for the design.
 # BOM / LF, matching the other localization/english/*.yml files.
 # ==========================================================================

 qing_cottage_smithy_building:0 "Village Smithy (鄉村鐵匠鋪)"
 qing_cottage_smithy_building_desc:0 "The village smith, working iron for tools, fittings and simple arms alike at the household scale — a rural craft outside any state works. Multiplies the province's iron output and draws in the lower strata and proletariat who work it, without competing with any other building for the province's job slots."
 qing_cottage_leadworks_building:0 "Village Lead Works (鄉村鉛作坊)"
 qing_cottage_leadworks_building_desc:0 "Household lead-working — casting shot and simple fittings at the family scale. Multiplies the province's lead output and draws in the lower strata and proletariat who work it, without competing with any other building for the province's job slots."
 qing_cottage_weaving_hut_building:0 "Peasant Weaving Hut (農家織屋)"
 qing_cottage_weaving_hut_building_desc:0 "Peasant household weaving — the archetypal putting-out craft, needing almost no fixed capital. Multiplies the province's textile-fibre output and draws in the lower strata and proletariat who work it, without competing with any other building for the province's job slots."
 qing_cottage_silk_reeling_shed_building:0 "Village Silk-Reeling Shed (繅絲棚)"
 qing_cottage_silk_reeling_shed_building_desc:0 "Village silk-reeling, alongside — not replacing — the Imperial Silk Manufactory. Multiplies the province's silk output and draws in the lower strata and proletariat who work it, without competing with any other building for the province's job slots."
 qing_cottage_woodlot_building:0 "Village Woodlot (鄉村伐木場)"
 qing_cottage_woodlot_building_desc:0 "The village woodlot, cutting ordinary timber for tools, fittings and building material. Multiplies the province's wood output and draws in the lower strata and proletariat who work it, without competing with any other building for the province's job slots."
 qing_cottage_herbalist_building:0 "Village Herbalist (鄉村藥鋪)"
 qing_cottage_herbalist_building_desc:0 "The village herbalist, growing and preparing medicinal plants at the household scale. Multiplies the province's vegetable output and draws in the lower strata and proletariat who work it, without competing with any other building for the province's job slots."
 qing_cottage_founders_workshop_building:0 "Village Founder's Workshop (鄉村鑄坊)"
 qing_cottage_founders_workshop_building_desc:0 "The village founder's workshop, casting bronze from copper and tin at the household scale. Multiplies the province's copper and tin output and draws in the lower strata and proletariat who work it, without competing with any other building for the province's job slots."
 qing_cottage_quarry_building:0 "Village Quarry (鄉村採石場)"
 qing_cottage_quarry_building_desc:0 "The village quarry, cutting stone for building and munitions at the household scale. Multiplies the province's stone output and draws in the lower strata and proletariat who work it, without competing with any other building for the province's job slots."
 qing_timber_lineage_building:0 "Lineage Timber Grant (力分/山分)"
 qing_timber_lineage_building_desc:0 "The 力分/山分 (labour-share/mountain-share) system of the Huizhou and Fujian highlands: landowning lineages granted tenant planters long-term rights to plant and tend timber against a divisible, tradable share of the eventual harvest — a registered financial instrument over standing timber, not an ordinary woodlot."
 qing_cottage_sugarhouse_building:0 "Sugar House (糖廍)"
 qing_cottage_sugarhouse_building_desc:0 "The jointly-capitalized 糖廍 sugar house: cane-growing was smallholder, but processing ran through a pooled-household institution distinct from both pure cottage and full factory scale, documented for Guangdong and Fujian."
 qing_cottage_sulphur_pit_building:0 "Sulphur Pit (硫磺廠)"
 qing_cottage_sulphur_pit_building_desc:0 "Sulphur, unlike the household crafts above, needed concentrated volcanic-terrain mineral deposits, not diffuse peasant labour — historically mined in China from a handful of fixed sites, or imported from Japan. The 硫磺廠 pit is a pooled/specialized institution like the sugar house, not an ordinary cottage craft."
 qing_cottage_saltpetre_works_building:0 "Niter Works (硝廠)"
 qing_cottage_saltpetre_works_building_desc:0 "Earth-niter (土硝) leaching and boiling from cave deposits and old walls, concentrated in the SW-China karst belt — diffuse household and village work, much like the smithy or leadworks above, not a specialized institution. Feeds the province's saltpetre output, gunpowder's dominant input."
 qing_cottage_powder_mill_building:0 "Powder Mill (碾房/火藥作)"
 qing_cottage_powder_mill_building_desc:0 "The water-powered stamping and incorporation mill that grinds and combines saltpetre, sulphur, and charcoal into usable gunpowder — the milling institution behind every powder-mill province, distinct from the raw niter and sulphur works that merely supply it."

