l_english:

#Military Ideas

idea_world_police:0 "World Police"
idea_world_police_desc:0 "Impose your ideology across the globe, turning every intervention into a chance to widen your influence. For a power that can base its armies in trade zones the world over."

idea_spanish_revanchism:0 "Spanish Revanchism"
idea_spanish_revanchism_desc:0 "The reinstated absolutist regime of Fernando VII has brought back our attention to our wayward colonies in America, should we be able to hold on to key cities, our revanchist spirit will not waver."

idea_gott_mit_uns:0 "Gott Mit Uns"
idea_gott_mit_uns_desc:0 "God is with us germans, always has and always will be."

#Economic Ideas

idea_mercantilism:0 "Mercantilism"
idea_mercantilism_desc:0 "Shield your own commerce and hoard the carrying trade. For a realm that directly controls many trade routes and goods and means to squeeze every advantage from them."

idea_free_trade:0 "Free Trade"
idea_free_trade_desc:0 "Throw open the markets and let commerce flow. For a realm that owns few trade routes outright but would extend its reach through open exchange rather than direct control."

idea_monopsony:0 "Monopsony"
idea_monopsony_desc:0 "By once again forcing our colonies to trade only with us, we can guarantee a happier upper strata as well as directly benefiting in the process..."

#Diplomatic Ideas

idea_merchant_colonialism:0 "Merchant Colonialism"
idea_merchant_colonialism_desc:0 "Seize the world's key trade routes through settlement and the pinpoint acquisition of ports. For a strong economy and fleet that lacks the land to grow its own raw goods."

idea_settler_colonialism:0 "Settler Colonialism"
idea_settler_colonialism_desc:0 "Pour settlers into the uncolonised lands and weaker realms along your borders. For a power with underdeveloped neighbours and the strength to overawe them."

idea_isolationism:0 "Isolationism"
idea_isolationism_desc:0 "Turn inward and tend to your own house, trading foreign ambition for domestic calm and steadily rising #Y stability#!."

idea_counter_colonialism:0 "Counter Colonialism"
idea_counter_colonialism_desc:0 "Bar foreign powers from meddling in your trade zone and those around it — a doctrine of the hemisphere for its own. For a realm contesting distant rivals over a continental sphere."

#Cultural Ideas

idea_civilising_mission:0 "Civilising Mission"
idea_civilising_mission_desc:0 "Carry the torch of your civilisation to the less-developed nations of the earth, winning them to your influence. For a realm of long reach and advanced industry."

idea_defender_of_the_faith:0 "Defender of the Faith"
idea_defender_of_the_faith_desc:0 "Take up the mantle of protector for all who share your religion, drawing the faithful abroad into your sphere. For a realm with co-religionists in lands it covets."

idea_pan_nationalism:0 "Pan-Nationalism"
idea_pan_nationalism_desc:0 "Rally every land that shares your culture group under one banner, claiming kinship as a title to influence. For a people scattered across many realms beyond your borders."
idea_qing_banner_host:0 "The Banner Host (八旗勁旅)"
idea_qing_banner_host_desc:0 "The disciplined banner garrisons that carried the Ten Great Campaigns from the steppe to the southern jungles — the martial spine of Manchu rule."
idea_qing_tanding:0 "Tanding into Land (攤丁入畝)"
idea_qing_tanding_desc:0 "The Yongzheng reform that merged the ancient head tax into the land tax, broadening the fiscal base and freeing the multitudes to grow — the fiscal engine of the High-Qing population boom."
idea_qing_tributary_system:0 "The Tributary System (朝貢體系)"
idea_qing_tributary_system_desc:0 "The Sinocentric order of tribute missions and the Canton trade, by which the Middle Kingdom orders its relations with the lesser realms of the earth."
idea_qing_reverence_heaven:0 "Reverence for Heaven & Ancestors (敬天法祖)"
idea_qing_reverence_heaven_desc:0 "The Son of Heaven upholds the cosmic and ancestral order; his ritual devotion is the very foundation of the dynasty's mandate to rule."
