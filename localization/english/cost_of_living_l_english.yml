l_english:
 # [triage] cost_of_living event chain (events/imp19c_mod_events/economy/cost_of_living_events.txt)
 # was entirely unlocalized (16 boot "Unrecognized loc key" errors). Rising cost of living in a
 # governorship's provinces per pop stratum; each fires a cost_of_living_excessive_* province modifier
 # + stability hit, and cost_of_living.4 is the "worsening" follow-up. Options are acknowledgements.
 cost_of_living.1.t:0 "The Poor Cannot Make Ends Meet"
 cost_of_living.1.desc:0 "In [cost_of_living_province.GetName], the labouring poor find their wages swallowed whole by the price of bread and rent. Grumbling fills the workshops and tenements, and word of privation spreads faster than any governor can quiet it."
 cost_of_living.1.a:0 "The treasury must look to their plight."
 cost_of_living.1.b:0 "Hardship is the lot of the low-born."
 cost_of_living.2.t:0 "The Common Folk Grow Restless"
 cost_of_living.2.desc:0 "The ordinary households of [cost_of_living_province.GetName] can no longer stretch their earnings to cover daily needs. What was once modest comfort has become a monthly struggle, and resentment simmers in the streets."
 cost_of_living.2.a:0 "We shall see what relief can be offered."
 cost_of_living.2.b:0 "They must tighten their belts as we all do."
 cost_of_living.3.t:0 "The Middling Sort Feel the Squeeze"
 cost_of_living.3.desc:0 "Shopkeepers, clerks and tradesmen in [cost_of_living_province.GetName] complain bitterly that prices have outrun their incomes. When even the respectable middle ranks feel pinched, discontent reaches quarters that matter to the state."
 cost_of_living.3.a:0 "Their grievances deserve a hearing."
 cost_of_living.3.b:0 "The market will settle in time."
 cost_of_living.4.t:0 "The Hardship Deepens"
 cost_of_living.4.desc:0 "Despite the passage of time, the cost of living in [cost_of_living_province.GetName] has not eased. Prices remain punishing and the affected households sink further into want, dragging the province's spirits and stability down with them."
 cost_of_living.4.a:0 "This cannot be allowed to fester."
 cost_of_living.4.b:0 "We can only weather it and hope for better."
